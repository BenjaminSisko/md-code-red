# MD CODE RED CI — BQP HTML profile (ADR-001 §10, threat-model-v1 §11).
#
# Seven steps, in order, stopping at the first failure:
#   1 build            2 QA gate (Q1-Q18)   3 STIG accuracy re-check
#   4 gitleaks         5 size report        6 drift check (reproducible build)
#   7 artifact upload (with the .sha256 sidecar)
#
# PROTECTED: .forgejo/workflows/** has a CODEOWNERS entry (today @benny; ADR-001 §10
# names Devon Park as the platform owner of this path). A change to this file needs
# that owner's review, so the gate cannot be edited by whoever is trying to get past
# it (threat-model-v1 §10, "workflow files protected").
#
# Size is REPORTED, never enforced: the Founder ruled the ceiling UNLIMITED on
# 2026-09-17, which supersedes ADR-001 §7.2's 8 MB line. No step here fails on size.
#
# NODE IS NOW REQUIRED (changed under CR-T-16). The command assembler is
# JavaScript, and Marcus's CI merge-gate #4 (threat-model-v1 §11) runs the
# hostile-input harness against the assembler lifted out of the built artifact.
# A Python re-implementation of the quoting would be a second assembler to keep
# in sync, and the one that shipped would be the one nobody tested — so the
# runner installs Node and qa.py Q18 FAILS rather than skips without it. The
# older `node --check` syntax gate stays optional; a missing syntax check is an
# inconvenience, a missing injection check is a production RHEL host.
name: CI
on:
  push:
  pull_request:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Required, not optional — see the header note. qa.py Q18 and
      # tests/test_hostile_inputs.py both run the assembler under Node.
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Node is present (the assembler gate cannot be skipped)
        run: node --version

      # extract/schema.py states the content schema once; test_schema.py pins it
      # against valid and invalid bundles, and test_build_fails_on_broken.py proves
      # the build itself refuses defective content. Discover runs both, so a new
      # test file is picked up without editing this protected workflow.
      # test_accuracy_gate.py additionally proves the Q10 accuracy gate FAILS on a
      # committed mutated fixture and PASSES on the clean one (CR-T-08), and
      # test_hostile_inputs.py runs the assembler harness over template.html
      # before anything is built (CR-T-16).
      - name: Schema, accuracy-gate, hostile-input and build-refusal tests
        run: python3 -m unittest discover -s tests -v

      # ---- 1 ----------------------------------------------------------------
      - name: Build the single file from sources (never patch an assembled file)
        run: python3 build.py

      # ---- 2 ----------------------------------------------------------------
      - name: QA gate (Q1-Q18, including the hostile-input harness over the built artifact)
        run: python3 qa.py

      # ---- 3 ----------------------------------------------------------------
      - name: STIG and CCI accuracy re-check against the pinned XCCDF (Q10, Q11)
        run: |
          cd stig-src && sha256sum -c SHA256SUMS && cd ..
          python3 qa.py --accuracy

      # ---- 4 ----------------------------------------------------------------
      # .gitleaks.toml keeps the default rule set and exempts exactly one pattern:
      # the example GRUB 2 password hash quoted inside the pinned DISA check text.
      # The four XCCDF files are still scanned in full by every other rule.
      - name: gitleaks (secret scan, full history and working tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # ---- 5 ----------------------------------------------------------------
      - name: Size report (informational — Founder ruled the ceiling unlimited, 2026-09-17)
        run: python3 qa.py --size

      # ---- 6 ----------------------------------------------------------------
      - name: Drift check (a build must be reproducible from the same sources)
        run: |
          set -eu
          first=$(sha256sum dist/md-code-red_*.html | awk '{print $1}')
          sidecar=$(awk '{print $1}' dist/md-code-red_*.html.sha256)
          rm -f dist/md-code-red_*.html dist/md-code-red_*.html.sha256
          python3 build.py >/dev/null
          second=$(sha256sum dist/md-code-red_*.html | awk '{print $1}')
          echo "build 1: $first"
          echo "sidecar: $sidecar"
          echo "build 2: $second"
          test "$first" = "$sidecar" || { echo "FAIL: sha256 sidecar does not match its own artifact"; exit 1; }
          test "$first" = "$second"  || { echo "FAIL: two builds of the same sources differ — the build is not reproducible"; exit 1; }
          echo "OK: rebuild is byte-identical"

      # ---- 7 ----------------------------------------------------------------
      - name: Upload artifact and sha256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: md-code-red-build
          path: |
            dist/md-code-red_*.html
            dist/md-code-red_*.html.sha256
          if-no-files-found: error
