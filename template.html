   banner, the inspector, the clipboard preview, doCopy() and the CR-T-28
   exporter all read it. */
var RESULT={key:null,value:null};
/* A generator's assembled command depends on live form input as well as on
   STATE.version/entryId, so its key folds STATE.formValues in too — every
   keystroke is then a genuinely new "interaction" for MCR-SEC-012's cache,
   computed once and reused by the gutter, the banner, the inspector and the
   clipboard, exactly like a static entry's key never needing formValues at
   all (a plain string concatenation is a no-op when the object is empty). */
function resultKey(){ return STATE.version+"|"+String(STATE.entryId)+"|"+formValuesKey(); }
function formValuesKey(){
  var keys=[],k,out=[];
  for(k in STATE.formValues){ if(Object.prototype.hasOwnProperty.call(STATE.formValues,k)) keys.push(k); }
  keys.sort();
  for(var i=0;i<keys.length;i++){
    out.push(encodeURIComponent(keys[i])+"="+encodeURIComponent(STATE.formValues[keys[i]]));
  }
  return out.join("&");
}
function computeResult(){
  if(!STATE.entryId) return null;
  var entry=entryById(STATE.entryId);
  if(!entry) return null;
  var values=isGeneratorEntry(entry)?STATE.formValues:{};
  var res=assembleCommand(entry,STATE.version,values,{patterns:PATTERNS});
  if(!res) return null;
  return withCopyPayloads(res,entry);
}
function invalidateResult(){ RESULT.key=null; RESULT.value=null; }
function currentResult(){
  var key=resultKey();
  if(RESULT.key!==key){
    RESULT.key=key;
    RESULT.value=computeResult();
  }
  return RESULT.value;
}

/* The lines of the comment header, as plain label+value text. They are NOT
   "# "-prefixed here: commentPayload() owns the prefix so that exactly one
   place in this file decides what a clipboard line looks like (MCR-SEC-003). */
function commentHeaderLines(res,entry,blast){
  var lines=[APP_NAME+" "+APP_VERSION+" — RHEL "+res.version];
  if(entry&&entry.intent) lines.push("intent: "+entry.intent);
  var stig=entry?stigRowsFor(entry):[];
  for(var i=0;i<stig.length;i++){
    lines.push("STIG: "+stig[i].stig_id+" (CAT "+catFor(stig[i])+")  NIST: "+((stig[i].nist||[]).join(", ")||"n/a"));
  }
  lines.push("blast: "+blast);
  return lines;
}

/* Attach both clipboard payloads to the result, and re-evaluate blast over the
   LONGER of the two. The destructive-pattern table has to see everything the
   clipboard can receive, not just the command line (MCR-SEC-003); the banner
   then fires before the operator clicks Copy, not after.

   Two passes, because the header carries the blast value itself: compose with
   the command-level blast, scan the whole payload, then recompose with the
   final blast so the header never states a blast the banner contradicts. */
function withCopyPayloads(res,entry){
  var probe=commentPayload(commentHeaderLines(res,entry,res.blast),res.command);
  var b=blastFor(probe===null?res.command:probe,res.blast,PATTERNS);
  res.blast=b.blast;
  res.blast_reasons=b.reasons;
  res.copy_plain=res.command;
  res.copy_comment=commentPayload(commentHeaderLines(res,entry,res.blast),res.command);
  /* CR-T-25. The generated file is a THIRD clipboard payload, and it is the one
     the operator actually saves to disk. It is not passed through
     commentPayload(): that function's job is to make every line of a SHELL
     paste inert by prefixing "# ", and a '#'-prefixed playbook is not a
     playbook. The file's own containment is composeDoc()'s quoting, proved by
     parsing in tests/hostile_harness.js -- and assembleCommand() already ran
     blastFor() over the file's text as well as the command, so the banner the
     operator acknowledged covers this payload too. */
  res.copy_doc=res.doc?res.doc.text:null;
  return res;
}

/* ============ theme — prefers-color-scheme default, explicit choice persists ============ */
var THEME=(function(){
  function current(){ return document.documentElement.getAttribute("data-theme"); }
  function apply(mode){
    if(mode==="dark"||mode==="light") document.documentElement.setAttribute("data-theme",mode);
    else document.documentElement.removeAttribute("data-theme");
  }
  function resolved(){
    var m=current();
    if(m) return m;
    try{
      if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    }catch(e){}
    return "light";
  }
  return {
    init:function(){ apply(STORE.getSession("theme",null)); },
    resolved:resolved,
    explicit:current,
    toggle:function(){
      var next=resolved()==="dark"?"light":"dark";
      apply(next);
      STORE.setSession("theme",next);
      renderStatusBar();
    }
  };
})();

/* ============ clipboard — air-gapped: a selection and execCommand, nothing else ============ */
function copyText(text){
  var ta=document.createElement("textarea");
  ta.value=String(text);
  ta.setAttribute("readonly","readonly");
  ta.style.position="fixed";
  ta.style.top="-1000px";
  document.body.appendChild(ta);
  ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy")===true; }catch(e){ ok=false; }
  document.body.removeChild(ta);
  return ok;
}
function toast(msg){
  STATE.toast=msg;
  renderStatusBar();
}
function doCopy(withComment){
  var res=currentResult();
  if(!res){ toast("Nothing to copy — no complete command is assembled."); return; }
  var payload=withComment?res.copy_comment:res.copy_plain;
  if(payload===null||payload===undefined){
    toast("Copy refused — the comment header could not be rendered as single-line text.");
    return;
  }
  /* res.blast was already computed over this payload (withCopyPayloads), so the
     acknowledgement the operator gave is an acknowledgement of the whole
     clipboard contents, header included — not of the command line alone. */
  if(res.blast==="red" && !STATE.acked){ toast("Destructive command — tick the review box first."); return; }
  var ok=copyText(payload);
  toast(ok?("Copied to clipboard — RHEL "+res.version):"Copy failed — select the text in the editor and use your browser's copy.");
}

/* CR-T-25. Copying the generated FILE. Separate from doCopy() on purpose: the
   payloads are different things in different grammars, and a single function
   with a mode flag is how one of them would eventually get the other's
   treatment. Same red-blast gate -- res.blast was computed over the command AND
   the file's text (assembleCommand), so this is the same acknowledgement. */
function doCopyDoc(){
  var res=currentResult();
  if(!res||!res.doc||res.copy_doc===null||res.copy_doc===undefined){
    toast("Nothing to copy — this command generates no file.");
    return;
  }
  if(res.blast==="red" && !STATE.acked){ toast("Destructive command — tick the review box first."); return; }
  var ok=copyText(res.copy_doc);
  toast(ok?("Copied "+res.doc.filename+" to clipboard"):"Copy failed — select the text in the file preview and use your browser's copy.");
}

/* ============ CR-T-28: Export as Evidence ============
   exportEvidence() gathers exactly the data formatEvidenceText() (the pure
   MCR-EVIDENCE block above) needs and hands it over — `res` is currentResult(),
   the SAME rendered-state object the screen and the clipboard already read
   (MCR-SEC-012), never recomputed here. renderEvidenceModal() then previews the
   formatted text in an escaped <pre>, and stashes the exact string in
   STATE._evidenceText so the Copy button on the modal copies precisely what
   is shown — the same rule doCopy() already applies to the clipboard preview
   (threat-model-v1 §9, MCR-SEC-003). */
function evidenceContext(){
  var res=currentResult();
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  var version=STATE.version,stigRow=null,rule=null;
  if(entry){
    var rows=stigRowsFor(entry);
    if(rows.length) stigRow=rows[0];
  }else if(STATE.stigRuleId){
    version=STATE.stigRuleVersion||STATE.version;
    stigRow={stig_id:STATE.stigRuleId,rhel_version:version,cci:null,nist:null};
  }
  if(stigRow) rule=ruleFor(stigRow.stig_id,version);
  return {res:res,entry:entry,stigRow:stigRow,rule:rule,version:version};
}
function exportEvidence(){
  var ctx=evidenceContext();
  if(!ctx.res && !ctx.stigRow){
    toast("Nothing to export — select a command or a STIG rule first.");
    return;
  }
  STATE.evidenceOpen=true;
  renderEvidenceModal();
}
function renderEvidenceModal(){
  if(!STATE.evidenceOpen){
    el("evidence-modal").hidden=true;
    return;
  }
  var ctx=evidenceContext();
  var stigMeta=((DATASETS.RULES||{})[ctx.version]||{})._meta||{};
  var src=(ctx.entry&&ctx.entry.source)?ctx.entry.source:((ctx.rule&&ctx.rule.source)?ctx.rule.source:null);
  var today=new Date();
  var mm=String(today.getMonth()+1);
  var dd=String(today.getDate());
  if(mm.length<2) mm="0"+mm;
  if(dd.length<2) dd="0"+dd;
  var operatorDate=today.getFullYear()+"-"+mm+"-"+dd;
  /* verification status for THE EXPORTED VERSION ONLY (task item 4) —
     computed here, at the render call site, exactly like stigMeta/src above,
     so formatEvidenceText() stays pure over values it is handed. */
  var vstatus=ctx.entry?verificationStatusForVersion(ctx.entry,ctx.version):null;
  var text=formatEvidenceText({
    res:ctx.res,entry:ctx.entry,stigRow:ctx.stigRow,rule:ctx.rule,version:ctx.version,
    appVersion:APP_VERSION,appBuildDate:APP_BUILD_DATE,contentFingerprint:CONTENT_FINGERPRINT,
    stigVersion:stigMeta.version||"",benchmarkDate:stigMeta.benchmark_date||"",
    source:src,operatorDate:operatorDate,vstatus:vstatus
  });
  STATE._evidenceText=text;
  var html="<p class=\"region-label\">Export as Evidence — SCTM-ready, plain text</p>";
  html+="<pre class=\"evidencepre\" aria-label=\"Evidence export preview — exactly what Copy copies\">"+
        esc(text)+"</pre>";
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"evidence-copy\">Copy evidence text</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"evidence-close\">Close</button>";
  html+="</div>";
  el("evidence-modal-body").innerHTML=html;
  el("evidence-modal").hidden=false;
}
function closeEvidenceModal(){
  STATE.evidenceOpen=false;
  STATE._evidenceText=null;
  el("evidence-modal").hidden=true;
  el("evidence-modal-body").innerHTML="";
}
function doCopyEvidence(){
  if(!STATE._evidenceText){ toast("Nothing to copy."); return; }
  var ok=copyText(STATE._evidenceText);
  toast(ok?"Evidence copied to clipboard.":
           "Copy failed — select the text in the preview and use your browser's copy.");
}

/* ============ STIG helpers ============ */
function stigRowsFor(entry){
  var rows=(entry&&entry.stig)||[],out=[];
  for(var i=0;i<rows.length;i++){ if(rows[i].rhel_version===STATE.version) out.push(rows[i]); }
  return out;
}
function catFor(row){
  var rules=((DATASETS.RULES||{})[STATE.version]||{}).rules||[];
  for(var i=0;i<rules.length;i++){ if(rules[i].i===row.stig_id) return rules[i].c||"?"; }
  return "?";
}
/* rule lookup by STIG ID on a GIVEN version (not always STATE.version — a
   standalone rule opened from search carries its own version). Returns a data
   object, never markup, so it is safe to read from inside a render
   accumulator: only fields of what it returns that are passed through esc()
   ever reach a sink. */
function ruleFor(stigId,version){
  var rules=((DATASETS.RULES||{})[version]||{}).rules||[],i;
  for(i=0;i<rules.length;i++){ if(rules[i].i===stigId) return rules[i]; }
  return null;
}
/* CCI -> NIST SP 800-53 crosswalk (CR-T-26: "CCIs -> NIST controls via
   cci_nist"). Data only, deduplicated, order-preserving. */
function nistForCci(cciList){
  var map=(DATASETS.CCI_NIST&&DATASETS.CCI_NIST.cci)||{},out=[],i,j;
  cciList=cciList||[];
  for(i=0;i<cciList.length;i++){
    var rec=map[cciList[i]];
    var nist=(rec&&rec.nist)||[];
    for(j=0;j<nist.length;j++){ if(out.indexOf(nist[j])<0) out.push(nist[j]); }
  }
  return out;
}

/* ============ per-version verification status ============
   CEO ruling closing Riley Park's first capture review (capture-review-run1-
   2026-09-18.md RILEY-F1): `verified` is an object keyed by RHEL version, each
   value false or a {by, on, host, capture} receipt — never a single
   whole-entry claim. This is the ONE place that turns entry.verified[version]
   (plus, where one exists, a joined STIG capture) into the three states the
   UI ever shows for a version:

     "verified"   — a real receipt sits on THIS version. Never propagated from
                    a same_as TARGET's receipt (extract/schema.py's
                    verified_errors() refuses a receipt on a same_as/unavailable
                    row in the first place, so if this version's own row IS one
                    of those, it can never reach the "verified" branch below).
     "captured"   — no receipt yet, but a capture exists for this exact
                    (entry, version) — visible here only when the entry carries
                    a stig[] row for this version with expected_output joined
                    (build.py's assemble()); a captured-but-unindexed
                    non-STIG capture (extract/import_captures.py's own
                    INDEXING note) has no channel into the shipped data island,
                    so it falls through to "unverified" honestly rather than
                    guessing.
     "unverified" — neither. Includes same_as/unavailable rows: those were
                    never independently run on this version, so "not
                    host-verified" is the true statement even though the
                    command TEXT may be identical to a version that was.

   Pure: reads only its own arguments plus the content island, returns data,
   never markup (Q17's audit rule — every field a caller reads off this
   crosses esc()/escapeAttr() at the call site, same as ruleFor()/
   nistForCci() above). */
function verificationStatusForVersion(entry, version){
  var ver=(entry&&entry.verified)||{};
  var receipt=ver[version];
  if(receipt&&typeof receipt==="object"){
    return {state:"verified", label:"Verified",
            text:"verified by "+receipt.by+" on "+receipt.on+" ("+receipt.host+")"};
  }
  var rows=(entry&&entry.stig)||[],i;
  for(i=0;i<rows.length;i++){
    if(rows[i].rhel_version===version&&rows[i].expected_output){
      return {state:"captured", label:"Captured", text:"captured, awaiting QA"};
    }
  }
  return {state:"unverified", label:"Not host-verified", text:"not host-verified"};
}

/* ============ CR-T-26: the STIG panel ============
   Writes #stig-panel (inspector, screen) and #print-stig-panel (editor,
   print-only) from the SAME accumulator, in two separate statements — the
   idiom every other multi-sink renderer in this file already uses (see
   renderBlastBanner()'s comment). Nothing here is a bare call spliced into the
   accumulator: ruleFor()/nistForCci() return DATA, and every field they
   return crosses the sink through esc() at the call site, exactly like every
   other renderer (Q17, MCR-SEC-004/014).

   Badge appears ONLY when the current selection carries at least one STIG row
   for the selected release (CR-P0-03) — an entry with no stig[], or a version
   with no row for it, renders an empty panel, not an empty card. */
function renderStigPanel(){
  var html="";
  var rows=[],version=STATE.version,standalone=false;
  if(STATE.entryId){
    var entry=entryById(STATE.entryId);
    rows=entry?stigRowsFor(entry):[];
    if(entry){
      var slot=(entry.rhel_versions||{})[STATE.version]||{};
      if(slot.changed_in_note){
        html+="<p class=\"changednote\">Changed in RHEL "+esc(STATE.version)+": "+
              esc(slot.changed_in_note)+"</p>";
      }
    }
  }else if(STATE.stigRuleId&&STATE.stigRuleVersion){
    version=STATE.stigRuleVersion;
    rows=[{stig_id:STATE.stigRuleId,rhel_version:STATE.stigRuleVersion,cci:null,nist:null}];
    standalone=true;
  }
  if(!rows.length){
    el("stig-panel").innerHTML=html;
    el("print-stig-panel").innerHTML=html;
    return;
  }
  var sunsetMeta=((DATASETS.RULES||{})[version]||{})._meta;
  if(sunsetMeta&&sunsetMeta.sunset){
    html+="<div class=\"sunsetbanner\" role=\"note\">RHEL "+esc(version)+
          " STIG "+esc(sunsetMeta.version||"?")+" is SUNSET at DISA — a terminal release, no "+
          "further updates expected.</div>";
  }
  var i;
  for(i=0;i<rows.length;i++){
    var row=rows[i];
    var rule=ruleFor(row.stig_id,version);
    var cat=(rule&&rule.c)||"?";
    var cls=(cat==="I"?"badge cat1":(cat==="II"?"badge cat2":(cat==="III"?"badge cat3":"badge")));
    var cci=(row.cci&&row.cci.length)?row.cci:((rule&&rule.cci)||[]);
    var nist=(row.nist&&row.nist.length)?row.nist:nistForCci(cci);
    html+="<div class=\"stigcard\">";
    html+="<span class=\""+escapeAttr(cls)+"\">STIG "+esc(row.stig_id)+", Category "+esc(cat)+"</span>";
    var ci;
    for(ci=0;ci<cci.length;ci++){ html+="<span class=\"badge\">"+esc(cci[ci])+"</span>"; }
    if(nist.length){ html+="<span class=\"badge\">NIST "+esc(nist.join(", "))+"</span>"; }
    html+="<h3>"+esc(rule&&rule.t?rule.t:"(no rule text embedded for this build)")+"</h3>";
    if(rule&&rule.chk){
      html+="<details><summary>Check text</summary><pre class=\"stigtext\">"+esc(rule.chk)+"</pre></details>";
    }
    if(rule&&rule.fix){
      html+="<details><summary>Fix text</summary><pre class=\"stigtext\">"+esc(rule.fix)+"</pre></details>";
    }
    var cap=row.expected_output;
    if(cap&&(cap.stdout!==undefined||cap.text!==undefined)){
      html+="<details open><summary>Expected compliant output (captured)</summary>"+
            "<pre class=\"stigtext\">"+esc(cap.stdout!==undefined?cap.stdout:cap.text)+"</pre></details>";
    }else{
      html+="<p class=\"nocaptureyet\">No capture yet — expected output has not been recorded for "+
            esc(row.stig_id)+" on RHEL "+esc(version)+".</p>";
    }
    if(standalone&&rule&&(!rule.cmds||!rule.cmds.length)){
      html+="<p class=\"muted\">No command in this build's catalog is linked to this rule yet.</p>";
    }
    html+="</div>";
  }
  el("stig-panel").innerHTML=html;
  el("print-stig-panel").innerHTML=html;
}

/* ============ renderers — every value crosses innerHTML through esc()/escapeAttr() ============ */
function renderVersionSelector(){

/* The tool list is gated, never filtered: a tool that RHEL N does not ship stays
   on screen, disabled, carrying the reason and the alternative (CR-P0-01 AC2). */
/* Is this catalog entry offered on the selected release, and why not if it
   isn't — the same question, answered the same way, for a static curated
   entry (gated by rhel_versions[v].unavailable) and a generator spec (gated
   by spec.versions, CR-T-17+). Neither branch ever hides the row; both return
   a reason the sidebar renders (CR-P0-01 AC2). */
function entryGateInfo(e){
  if(isGeneratorEntry(e)){
    var gated=!!(e.versions && !inList(e.versions,STATE.version));
    return {gated:gated,
            reason:gated?"This generator is not offered on RHEL "+STATE.version+".":""};
  }
  var slot=(e.rhel_versions||{})[STATE.version]||{};
  var gated2=!!slot.unavailable;
  return {gated:gated2, reason:gated2?((slot.unavailable&&slot.unavailable.reason)||""):""};
}

/* CR-T-30: the favorites/recent sidebar. Rows reuse the existing data-tool
   and data-entry click-router hooks — selecting one lands back in the
   Command Builder rail (selectEntry()/selectTool() do that already) — so
   nothing new has to be wired into the router for this list to work.
   Favorites and recent both render from STATE.favorites/STATE.recent, which
   are id lists ONLY (sanitizeIdList()); the label shown for each id is
   resolved fresh from the live content island every render, never from
   anything that was stored (threat-model-v1 §7 — stored text is never
   trusted, let alone rendered). An id that no longer resolves — an older
   build's favorite — is silently skipped rather than shown blank. */
function renderFavoritesSidebar(){
  var html="<p class=\"region-label\">Favorites</p>";

  if(!STATE.favorites.length){

  }else{

        continue;

function renderToolList(){
  var all=(DATASETS.TOOLS&&DATASETS.TOOLS.tools)||[];
  var html="";
  if(STATE.rail==="favorites"){ renderFavoritesSidebar(); return; }
  if(STATE.rail==="reference"){ renderReferenceSidebar(); return; }
  if(STATE.rail==="about"){
    html+="<p class=\"region-label\">About</p>";
    html+="<p class=\"muted\">Tool identity, content fingerprint, STIG versions and the required "+
          "attribution block are in the main panel.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  if(STATE.rail!=="builder"&&STATE.rail!=="ansible"){
    html+="<p class=\"region-label\">"+esc(STATE.rail)+"</p>";
    html+="<p class=\"muted\">This rail lands with its own task: STIG search over the whole catalog "+
          "(CR-T-26 put the STIG panel and search-by-STIG-ID in the Inspector and the command "+
          "palette instead; a dedicated browse view here is still open). The Command Builder, "+
          "Ansible, Favorites and About rails are live now.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  /* The Ansible rail renders the SAME tool list as the Command Builder, over a
     different slice of tools.json: the seven ansible-* control-node binaries,
     which the builder rail correspondingly does not show. One renderer, one
     escaping idiom, one keyboard contract -- a second hand-written list here
     would be a second place for Q17's audit rule to be got wrong.

     Until this tranche the rail rendered a "lands with its own task" placeholder,
     which is exactly what the Founder opened v1.0.0-alpha.1 and saw. The tools
     it lists carry no RHEL-version gating of their own: an ansible-playbook
     invocation is governed by the control node's ansible-core version, not by
     the release of the hosts it reaches, and each tool record says so. */
  var ansibleRail=(STATE.rail==="ansible");
  var tools=[],ti;
  for(ti=0;ti<all.length;ti++){
    if((all[ti].category==="ansible")===ansibleRail) tools.push(all[ti]);
  }
  html+="<p class=\"region-label\">"+esc(ansibleRail?"Ansible":"Tools")+"</p>";
  if(!tools.length){
    html+="<p class=\"muted\">No tools in this build's content island.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  var overallCaveat=versionOverallCaveat(STATE.version);
  if(overallCaveat){
    html+="<p class=\"muted\">Most tools on RHEL "+esc(STATE.version)+": "+esc(overallCaveat)+"</p>";
  }
  html+="<ul class=\"list\" data-listnav=\"tools\">";
  for(var i=0;i<tools.length;i++){
    var t=tools[i];
    var av=toolAvailability(t);
    var open=(t.id===STATE.toolId);
    if(av.available){
      html+="<li><button type=\"button\" class=\"row\" data-tool=\""+escapeAttr(t.id)+"\" aria-current=\""+
            (open?"true":"false")+"\">"+esc(t.label||t.id);
      /* Show the per-tool caveat only when it says something the line above
         (the version's own overall caveat, printed once) does not already
         say -- the honest text itself is never hidden, only its repeat. */
      if(av.note && av.note!==overallCaveat){ html+="<span class=\"why\">"+esc(av.note)+"</span>"; }
      html+="</button></li>";
    }else{
      html+="<li><button type=\"button\" class=\"row\" aria-disabled=\"true\" disabled title=\""+
            escapeAttr(GATED_COPY+STATE.version+(av.reason?" — "+av.reason:""))+"\">"+esc(t.label||t.id)+
            "<span class=\"why\">"+esc(GATED_COPY+STATE.version)+(av.alternative?esc(" — use "+av.alternative):"")+"</span></button></li>";
    }
    if(!open) continue;
    var entries=entriesForTool(t.id);
    html+="<li><ul class=\"list\" data-listnav=\"entries\">";
    if(!entries.length){
      html+="<li><p class=\"muted\">No catalogued command for this tool yet — the catalog is authored in CR-T-33.</p></li>";
    }
    for(var j=0;j<entries.length;j++){
      var e=entries[j];
      var gate=entryGateInfo(e);
      if(gate.gated){
        html+="<li><button type=\"button\" class=\"row\" aria-disabled=\"true\" disabled title=\""+
              escapeAttr(GATED_COPY+STATE.version+(gate.reason?" — "+gate.reason:""))+"\">"+
              esc(e.intent||e.id)+"<span class=\"why\">"+esc(GATED_COPY+STATE.version)+"</span></button></li>";
      }else{
        html+="<li><button type=\"button\" class=\"row\" data-entry=\""+escapeAttr(e.id)+"\" aria-current=\""+
              (e.id===STATE.entryId?"true":"false")+"\">"+esc(e.intent||e.id)+
              (isGeneratorEntry(e)?"<span class=\"why\">guided form</span>":"")+"</button></li>";
      }
    }
    var refs=refCommandsForTool(t.id);
    if(refs.length){
      html+="<li><p class=\"region-label reftier\">Reference commands ("+
            esc(String(refs.length))+") &mdash; vendor text, not host-verified</p>";
      html+="<ul class=\"list reflist\" data-listnav=\"refs\">";
      var shown=0,r2;
      for(r2=0;r2<refs.length&&shown<REF_SIDEBAR_CAP;r2++){
        var rr=refs[r2];
        if(!refOnVersion(rr)) continue;
        shown++;
        html+="<li><button type=\"button\" class=\"row ref\" data-ref=\""+escapeAttr(rr.id)+
              "\" aria-current=\""+(rr.id===STATE.refId?"true":"false")+"\">"+esc(rr.c)+
              "<span class=\"why\">"+esc(rr.authority==="governing"?"DISA reference":"vendor doc")+
              (rr.trunc?esc(" \u00b7 incomplete line"):"")+"</span></button></li>";
      }
      if(!shown){
        html+="<li><p class=\"muted\">No reference command for this tool on RHEL "+
              esc(STATE.version)+".</p></li>";
      }else if(refs.length>shown){
        html+="<li><p class=\"muted\">Showing "+esc(String(shown))+" of "+esc(String(refs.length))+
              ". Press / and search to reach the rest.</p></li>";
      }
      html+="</ul></li>";
    }
    html+="</ul></li>";
  }
  html+="</ul>";
  el("sidebar-body").innerHTML=html;
}

/* How many reference commands one tool shows in the sidebar before the palette
   takes over. A tool with 500 mined lines is a scroll nobody reads; the search
   index is the way through that, and the count above the list says how many are
   there so the cap is never a silent truncation. */
var REF_SIDEBAR_CAP=40;

/* The Reference rail: every tool the mined tier knows, including the 800-odd
   this product does not catalogue and therefore does not list in the builder.
   Without it those records would be reachable only by search. */
/* The family names an operator sees, and the one-line statement of what each
   family IS. Spelled out rather than derived from the slug: "stig_rules" is a
   build-time identifier and "DISA STIG check and fix text" is what the operator
   is actually being offered. */
var REF_FAMILY_LABELS={
  stig_rules:{label:"DISA STIG check and fix text",
              note:"governing — a requirement, attributable to DISA"},
  raw_captures:{label:"Staged man pages and --help output",
                note:"documentary — how a binary documents itself"},
  redhat_guides:{label:"Red Hat product documentation",
                 note:"documentary — (c) Red Hat, Inc., CC BY-SA 3.0 Unported"}
};
function renderReferenceSidebar(){
  var html="<p class=\"region-label\">Reference commands</p>";
  html+="<p class=\"muted reftier\">Vendor reference text, mined from the DISA STIG check and fix "+
        "text, the staged man pages and the Red Hat product documentation. Not curated, not "+
        "host-verified, not assembled by this tool. No verify step, no undo step, no blast "+
        "rating.</p>";
  /* THE FAMILY LIST, and it is drawn before anything is hydrated. Al's ruling
     is lazy per-family hydration; this is the part of it the operator can
     actually see. Each family shows its name, its authority and its record
     count -- all of which live in the main island's manifest -- and loads only
     when it is asked for. A jump box that only wants the DISA family parses
     0.5 MB and never touches the 4.3 MB of Red Hat documentation. */
  var fams=refFamilyNames(),fi,anyRecords=false;
  html+="<p class=\"region-label\">Source families</p><ul class=\"list\" data-listnav=\"reffams\">";
  for(fi=0;fi<fams.length;fi++){
    var fname=fams[fi],meta=REF_FAMILY_LABELS[fname]||{label:fname,note:""};
    var count=refFamilyCount(fname),loaded=refFamilyIsHydrated(fname);
    if(count) anyRecords=true;
    html+="<li><button type=\"button\" class=\"row\" data-reffam=\""+escapeAttr(fname)+
          "\" aria-current=\""+(loaded?"true":"false")+"\">"+esc(meta.label)+
          "<span class=\"why\">"+esc(String(count))+" record"+(count===1?"":"s")+" · "+
          esc(meta.note)+" · "+esc(loaded?"loaded":"select to load")+"</span></button></li>";
  }
  html+="</ul>";
  if(!anyRecords){
    html+="<p class=\"muted\">This build embeds no reference commands.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  var tools=refToolNames(),i;
  if(!tools.length){
    html+="<p class=\"muted\">No source family is loaded yet. Choose one above to browse it by "+
          "tool — or press / and search, which loads only the families your terms reach.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  html+="<p class=\"region-label\">Tools in the loaded families</p>";
  html+="<ul class=\"list\" data-listnav=\"reftools\">";
  for(i=0;i<tools.length;i++){
    var tid=tools[i];
    var recs=refCommandsForTool(tid);
    var open=(tid===STATE.refToolId);
    html+="<li><button type=\"button\" class=\"row\" data-reftool=\""+escapeAttr(tid)+
          "\" aria-current=\""+(open?"true":"false")+"\">"+esc(tid)+
          "<span class=\"why\">"+esc(String(recs.length))+"</span></button></li>";
    if(!open) continue;
    html+="<li><ul class=\"list reflist\" data-listnav=\"refs\">";
    var shown=0,j;
    for(j=0;j<recs.length&&shown<REF_SIDEBAR_CAP;j++){
      var rr=recs[j];
      if(!refOnVersion(rr)) continue;
      shown++;
      html+="<li><button type=\"button\" class=\"row ref\" data-ref=\""+escapeAttr(rr.id)+
            "\" aria-current=\""+(rr.id===STATE.refId?"true":"false")+"\">"+esc(rr.c)+
            "<span class=\"why\">"+esc(rr.authority==="governing"?"DISA reference":"vendor doc")+
            (rr.trunc?esc(" \u00b7 incomplete line"):"")+"</span></button></li>";
    }
    if(!shown){
      html+="<li><p class=\"muted\">Nothing for RHEL "+esc(STATE.version)+" under this tool.</p></li>";
    }else if(recs.length>shown){
      html+="<li><p class=\"muted\">Showing "+esc(String(shown))+" of "+esc(String(recs.length))+
            ". Press / and search to reach the rest.</p></li>";
    }
    html+="</ul></li>";
  }
  html+="</ul>";
  el("sidebar-body").innerHTML=html;
}

/* The banner owns its own region so no other renderer ever concatenates a
   function's return value into an innerHTML expression — the Q17 audit only
   has to look at string literals and esc() calls, in every renderer, forever. */
function renderBlastBanner(res){
  var html="";
  if(!res||res.blast!=="red"){ el("blast-banner").innerHTML=html; return; }
  html+="<div class=\"blast\" role=\"alert\"><h2>Destructive operation — review before running</h2>";
  var reasons=res.blast_reasons||[];
  if(!reasons.length){
    html+="<p>This entry is catalogued as blast radius red by its content reviewer.</p>";
  }
  for(var i=0;i<reasons.length;i++){
    html+="<p><strong>"+esc(reasons[i].label||reasons[i].id)+"</strong> — "+esc(reasons[i].why||"")+"</p>";
  }
  html+="<label><input type=\"checkbox\" data-action=\"ack\""+(STATE.acked?" checked":"")+
        "> I have reviewed this command</label></div>";
  el("blast-banner").innerHTML=html;
}

/* The reference-tier editor pane. READ ONLY, by construction rather than by
   discipline: there is no form, no field, no template, no assembler call and no
   `res` object anywhere below. What is rendered is rec.c, escaped, and its
   citation. The one control is Copy, and it is held behind an acknowledgement
   (TM2-F5 -- see referenceCopyBlocked).

   The label is deliberately unmissable and deliberately repeated: this panel
   looks like the curated command panel, and the whole risk of the reference tier
   is an operator reading a mined line as though a human signed for it. */
function renderReferenceEditor(rec){
  var meta=refMeta();
  var rb=referenceBlast(rec.c,PATTERNS);
  var html="<div class=\"reftier-banner\" role=\"note\">";
  html+="<h2>Vendor reference &mdash; not host-verified, not assembled by this tool</h2>";
  html+="<p>This command was mined from vendor documentation. Nobody in this shop ran it, rated "+
        "it, wrote a verify step for it or wrote an undo step for it. It is shown because the "+
        "vendor published it, and for no other reason.</p>";
  html+="</div>";
  html+="<h2>"+esc(rec.t)+"</h2>";
  html+="<p class=\"muted\">tier "+esc(rec.tier)+" \u00b7 authority "+esc(rec.authority)+
        " \u00b7 licence "+esc(rec.license_class)+" \u00b7 blast "+esc(rb.blast)+
        " \u00b7 RHEL "+esc((rec.v||[]).join(", "))+"</p>";
  if(rb.blast==="unrated"){
    html+="<p class=\"muted\">Blast <strong>unrated</strong>: this command matches no pattern in "+
          "the destructive table, and that is not a finding that it is safe. Nobody rated it. A "+
          "curated entry says green only when a reviewer signed for it.</p>";
  }
  if(rec.trunc){
    html+="<p class=\"warn\">INCOMPLETE LINE. The vendor's own page wrapped and cut this "+
          "command, and this tool will not guess the rest. What is below is the beginning of a "+
          "command, not a command.</p>";
  }
  var lines=String(rec.c).split("\n");
  html+="<div class=\"codeblock reftier\" aria-label=\"Vendor reference command, read only\">";
  for(var i=0;i<lines.length;i++){
    html+="<div class=\"codeline\"><span class=\"ln\">"+esc(String(i+1))+
          "</span><span class=\"lc\">"+esc(lines[i])+"</span></div>";
  }
  html+="</div>";
  html+="<div class=\"blast\" role=\"alert\"><label><input type=\"checkbox\" data-action=\"ref-ack\""+
        (STATE.refAck?" checked":"")+"> I understand this is unverified vendor reference text</label>";
  var reasons=rb.reasons||[];
  for(var k=0;k<reasons.length;k++){
    html+="<p><strong>"+esc(reasons[k].label||reasons[k].id)+"</strong> &mdash; "+
          esc(reasons[k].why||"")+"</p>";
  }
  html+="</div>";
  var blocked=referenceCopyBlocked(STATE.refAck);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"ref-copy\""+
        (blocked?" aria-disabled=\"true\" disabled title=\"Tick the box to unlock copy\"":"")+
        ">Copy</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"ref-copy-comment\""+
        (blocked?" aria-disabled=\"true\" disabled title=\"Tick the box to unlock copy\"":"")+
        ">Copy with citation</button>";
  html+="</div>";
  html+="<p class=\"region-label\">Source</p><ul class=\"list\">";
  var occ=rec.o||[],m;
  for(m=0;m<occ.length;m++){
    html+="<li><p class=\"muted\">"+esc(refCitationLine(occ[m],meta))+"</p></li>";
  }
  html+="</ul>";
  if(rec.n&&rec.n>occ.length){
    html+="<p class=\"muted\">Cited "+esc(String(rec.n))+" times across the sources; the "+
          esc(String(occ.length))+" citations above are the ones this build carries.</p>";
  }
  if(rec.license_class==="cc-by-sa-3.0"){
    html+="<p class=\"muted\">"+esc(meta.guide_attribution||"")+". Reproduced under the Creative "+
          "Commons Attribution-Share Alike 3.0 Unported licence. See the About panel for the full "+
          "notice.</p>";
  }
  html+="<p class=\"muted\">Nothing on this panel is assembled. There is no verify step, no undo "+
        "step and no capture receipt, because this tier has none to give.</p>";
  el("editor-card").innerHTML=html;
}

function renderEditor(){
  var html="";
  if(STATE.rail==="about"){
    renderAbout();
    return;
  }
  if(STATE.refId){
    var refrec=refCommandById(STATE.refId);
    if(refrec){
      renderBlastBanner(null);
      renderReferenceEditor(refrec);
      return;
    }
  }
  renderBlastBanner(currentResult());
  if(!STATE.entryId){
    if(STATE.stigRuleId){
      html+="<div class=\"card\"><h2>"+esc(STATE.stigRuleId)+"</h2>"+
            "<p class=\"muted\">Opened from search. The check text, fix text and control mapping "+
            "are in the Inspector panel on the right — this rule has no command in this build's "+
            "catalog to assemble.</p></div>";
      el("editor-card").innerHTML=html;
      return;
    }
    html+="<div class=\"card\"><h2>No command selected</h2><p class=\"muted\">Pick a tool from the sidebar, or press <code>/</code> to search. Copy is not rendered at all until a command is assembled — there is no dead control to tab through.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  var entry=entryById(STATE.entryId);
  if(!entry){
    html+="<div class=\"card\"><h2>Entry not found</h2><p class=\"muted\">This build's content island has no entry with that id. Nothing is guessed and nothing is rendered from raw text.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  if(isGeneratorEntry(entry)){
    renderGeneratorEditor(entry);
    return;
  }
  var res=currentResult();
  if(!res){
    var slot=(entry.rhel_versions||{})[STATE.version]||{};
    var why=(slot.unavailable&&slot.unavailable.reason)||"";
    var alt=(slot.unavailable&&slot.unavailable.alternative)||"";
    html+="<div class=\"card\"><h2>"+esc(GATED_COPY+STATE.version)+"</h2>";
    html+="<p class=\"muted\">"+esc(why||"This entry has no command for the selected release, so no command is assembled and nothing can be copied.")+"</p>";
    if(alt) html+="<p class=\"muted\">Alternative: "+esc(alt)+"</p>";
    html+="</div>";
    el("editor-card").innerHTML=html;
    return;
  }
  html+="<h2>"+esc(entry.intent||entry.id)+"</h2>";
  html+="<p class=\"muted\">"+esc(entry.tool)+" · RHEL "+esc(res.version)+" · blast "+esc(res.blast)+
        (res.resolved_from?esc(" · same as RHEL "+res.resolved_from):"")+
        (entry.privilege?"<span class=\"badge privilege\">requires ":"")+(entry.privilege?esc(entry.privilege):"")+(entry.privilege?"</span>":"")+"</p>";
  var lines=String(res.command).split("\n");
  html+="<div class=\"codeblock\" aria-label=\"Assembled command\">";
  for(var i=0;i<lines.length;i++){
    html+="<div class=\"codeline\" role=\"button\" tabindex=\"0\" data-line=\""+escapeAttr(String(i))+
          "\" aria-current=\""+(i===STATE.line?"true":"false")+
          "\" aria-label=\"Line "+escapeAttr(String(i+1))+"\"><span class=\"ln\">"+esc(String(i+1))+
          "</span><span class=\"lc\">"+esc(lines[i])+"</span></div>";
  }
  html+="</div>";
  var blocked=(res.blast==="red"&&!STATE.acked);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy-comment\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy with comment</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"export-evidence\">Export as Evidence</button>";
  html+="<button type=\"button\" class=\"favbtn\" data-action=\"fav-toggle\" data-favid=\""+
        escapeAttr(entry.id)+"\" aria-pressed=\""+(isFavorite(entry.id)?"true":"false")+"\">"+
        (isFavorite(entry.id)?"Favorited":"Favorite")+"</button>";
  html+="</div>";
  /* threat-model-v1 §9: what is in the preview is exactly and only what gets
     copied. The comment header used to be built at click time and never shown;
     it is rendered here, escaped, from the same res.copy_comment string that
     doCopy() puts on the clipboard (MCR-SEC-003). */
  if(res.copy_comment){
    html+="<p class=\"region-label\">Copy with comment — exactly what reaches the clipboard</p>";
    html+="<pre class=\"copypreview\" aria-label=\"Clipboard preview for Copy with comment\">"+
          esc(res.copy_comment)+"</pre>";
  }
  if(res.notes) html+="<p class=\"muted\">"+esc(res.notes)+"</p>";
  html+="<p class=\"muted\">Verify: "+esc(entry.verify||"")+"</p>";
  html+="<p class=\"muted\">Undo: "+esc(entry.undo||"")+"</p>";
  el("editor-card").innerHTML=html;
}

/* ============ generator form renderer (CR-T-17..25, ADR-001 §8 module 5) ====
   Builds the SIDEBAR-of-the-editor form from a generator's fields[] — marks
   required fields per UI spec §4 (*, "(required)" in the label text, never
   colour alone, aria-required), and renders a version-gated field disabled +
   aria-disabled + aria-describedby pointing at the reason, exactly like a
   gated tool or entry row. The form frame (this function) is rebuilt only on
   entry selection and on a RHEL version change — never on a keystroke, so
   typing never loses focus; renderGeneratorResult() below is the part that
   redraws on every keystroke, into its own #gen-result sink. */
/* One accumulator, inline, exactly like every other renderer in this file —
   deliberately NOT split into a per-field helper that RETURNS an HTML string:
   Q17's audit only trusts a segment reaching a sink if it is a string
   literal, one of esc()/escapeAttr()/escapeRegex(), or an accumulator this
   gate derived from assignments in THIS file — a bare call to a helper
   function is none of those, so the helper's returned markup would be an
   unaudited segment no matter how carefully the helper itself escapes it. */
function renderGeneratorForm(entry){
  var html="<p class=\"region-label\">Fields</p>";
  var fields=entry.fields||[];
  for(var i=0;i<fields.length;i++){
    var field=fields[i];
    var name=field.name;
    var val=STATE.formValues[name]!==undefined?STATE.formValues[name]:"";
    var gated=!fieldAvailable(field,STATE.version);
    var id="genf-"+entry.id+"-"+name;
    html+="<div class=\"field\"><label for=\""+escapeAttr(id)+"\">"+esc(name);
    if(field.required){ html+=" <span class=\"req\">*</span> (required)"; }
    else{ html+=" (optional)"; }
    html+="</label>";
    if(gated){
      html+="<input type=\"text\" id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
            "\" disabled aria-disabled=\"true\" aria-describedby=\""+escapeAttr(id)+"-why\" value=\"\">";
      html+="<p class=\"why\" id=\""+escapeAttr(id)+"-why\">"+esc(GATED_COPY+STATE.version)+"</p>";
      html+="</div>";
      continue;
    }
    /* type "enum" is the author-curated closed set (field.options); a handful
       of built-in FIELD_TYPES are ALSO closed sets (protocol/family/action)
       with their enum baked into the type itself — both render a <select>,
       neither makes the operator type a value the assembler would just as
       happily have offered as a choice. */
    var builtinEnum=(FIELD_TYPES[field.type]||{}).enums;
    if(field.type==="enum"||builtinEnum){
      html+="<select id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+

/* Fills #gen-result — the assembled command, the toolbar, the clipboard

  if(res.doc){

function renderGeneratorEditor(entry){

function renderInspector(){
  /* renderStigPanel() owns #stig-panel/#print-stig-panel exclusively, as its
     own statement — same composition rule renderEditor() already applies to
     renderBlastBanner() (Q17: no bare call's return is spliced into this
     function's own accumulator). It renders for BOTH an entry's stig[] and a
     standalone rule reached via search (CR-T-26), so it runs whether or not a
     command result exists below. */
  renderStigPanel();
  var html="";
  var res=currentResult();
  if(!res){
    html+=(STATE.stigRuleId?
      "<p class=\"muted\">This STIG rule has no command in this build's catalog. The check, fix and control mapping are in the panel above.</p>":
      "<p class=\"muted\">Flag-by-flag explanations render here once a command is assembled.</p>");
    el("inspector-body").innerHTML=html;
    return;
  }
  var entry=entryById(res.id);
  var vstatus=verificationStatusForVersion(entry,res.version);
  html+="<p class=\"region-label\">Verification</p>";
  html+="<p class=\"vline\"><span class=\"vbadge v-"+escapeAttr(vstatus.state)+"\">"+
        esc(vstatus.label)+"</span> <span class=\"muted\">"+esc(vstatus.text)+"</span></p>";
  html+="<p class=\"region-label\">Flag by flag</p>";
  /* PANEL-001/G1: entry.tool is the subject the sidebar rail groups this entry
     under (firewalld-service-active stays findable under "firewall-cmd"), but
     when the assembled command actually invokes a different binary, the flag
     dictionary that binary owns is the one that can answer this panel.
     explain_tool names that binary; entry.tool never changes. */
  var explainTool=(entry&&entry.explain_tool)||res.tool;
  var flags=decodeCmd(explainTool,res.version,res.flags||[]);
  if(!flags.length) html+="<p class=\"muted\">This command takes no flags.</p>";
  for(var j=0;j<flags.length;j++){

    if(explain){
      html+="<span class=\"mean\">"+esc(explain)+"</span>";
    }else{

         means the panel says so, in the selected version only */
      html+="<span class=\"mean unverified\">"+esc(UNVERIFIED_FLAG_COPY)+"</span>";
    }
    html+="</div>";
  }
  var srcObj=entry&&entry.source?entry.source:null;
  if(srcObj){
    html+="<p class=\"region-label\">Source</p>";

          " (retrieved "+esc(srcObj.retrieved_on||"")+")</p>";

  el("inspector-body").innerHTML=html;
}

/* ============ CR-T-29: palette over the lazy typed search index ============
   SEARCH_INDEX is built ONCE, on the first keystroke that reaches the
   palette — "lazy" — by buildIndex() (the MCR-INDEX block above, lifted
   verbatim by tests/test_search_index.js and timed against this exact
   dataset). Every later keystroke only calls queryIndex(), which is cheap:
   the index is already built. */
var SEARCH_INDEX=null;
function ensureSearchIndex(){
  if(!SEARCH_INDEX) SEARCH_INDEX=buildIndex(DATASETS);
  return SEARCH_INDEX;
}
function paletteMatches(q){
  var result=queryIndex(ensureSearchIndex(),q);
  /* Splice the reference tier in at the position INDEX_KIND_ORDER already
     names for it. queryIndex() built the curated groups; the corpus answers
     separately, through the inverted index, and gets inserted rather than
     concatenated so "Reference sits below Command" stays one statement in one
     array instead of an ordering rule repeated here. */
  var refGroup=queryReference(refIndex(),q,INDEX_GROUP_CAP);
  if(refGroup.hits.length){
    var want=indexOfIn(INDEX_KIND_ORDER,"Reference"),at=result.groups.length,g;
    for(g=0;g<result.groups.length;g++){
      if(indexOfIn(INDEX_KIND_ORDER,result.groups[g].kind)>want){ at=g; break; }
    }
    result.groups.splice(at,0,{kind:"Reference",hits:refGroup.hits});
    result.total+=refGroup.total;
  }
  var flat=[],gi,hi;
  for(gi=0;gi<result.groups.length;gi++){
    for(hi=0;hi<result.groups[gi].hits.length;hi++) flat.push(result.groups[gi].hits[hi]);
  }
  STATE.paletteGroups=result.groups;
  return flat;
}
function renderPalette(){
  var html="";
  var q=el("palette-input").value;
  STATE.paletteHits=paletteMatches(q);
  if(!q){
    html+="<p class=\"muted\">Type a tool name, a command intent, a flag, a STIG ID, a CCI, or a NIST control number (e.g. AC-6).</p>";
    el("palette-results").innerHTML=html;
    return;
  }
  if(!STATE.paletteHits.length){
    html+="<p class=\"muted\">No matches for "+esc(q)+". Try a tool name such as "+
          esc(nearestToolNames(q))+".</p>";
    el("palette-results").innerHTML=html;
    return;
  }
  if(STATE.paletteSel>=STATE.paletteHits.length) STATE.paletteSel=0;
  html+="<ul class=\"list\" data-listnav=\"palette\" id=\"palette-list\" role=\"listbox\">";
  var flatIndex=0,gi,hi;
  for(gi=0;gi<STATE.paletteGroups.length;gi++){
    var group=STATE.paletteGroups[gi];
    html+="<li class=\"palettegroup\" role=\"presentation\">"+esc(group.kind)+"</li>";
    for(hi=0;hi<group.hits.length;hi++){
      var h=group.hits[hi];
      var atIndex=flatIndex;
      html+="<li><button type=\"button\" class=\"row\" role=\"option\" aria-selected=\""+
            (atIndex===STATE.paletteSel?"true":"false")+"\" aria-current=\""+
            (atIndex===STATE.paletteSel?"true":"false")+
            "\" data-hit=\""+escapeAttr(String(atIndex))+"\">"+esc(h.label)+
            "<span class=\"why\">"+esc(h.kind)+(h.version?esc(" · RHEL "+h.version):"")+
            (h.tool?esc(" · "+h.tool):"")+"</span></button></li>";
      flatIndex++;
    }
  }
  html+="</ul>";
  html+="<p class=\"palettetiming\">"+esc(String(STATE.paletteHits.length))+" match(es)</p>";
  el("palette-results").innerHTML=html;
}
function nearestToolNames(q){
  var tools=(DATASETS.TOOLS&&DATASETS.TOOLS.tools)||[],scored=[];
  var s=String(q).toLowerCase();
  for(var i=0;i<tools.length;i++){
    var label=String(tools[i].label||tools[i].id).toLowerCase();
    var shared=0;
    for(var j=0;j<s.length;j++){ if(label.indexOf(s.charAt(j))>=0) shared++; }
    scored.push({label:tools[i].label||tools[i].id,score:shared});
  }
  scored.sort(function(a,b){return b.score-a.score;});
  var out=[];
  for(var k=0;k<scored.length&&k<3;k++) out.push(scored[k].label);
  return out.join(", ")||"none in this build";
}
function openPalette(){
  STATE.paletteOpen=true;
  STATE.paletteSel=0;
  el("palette").hidden=false;
  el("palette-input").value="";
  renderPalette();
  el("palette-input").focus();
}
function closePalette(){
  if(!STATE.paletteOpen) return;
  STATE.paletteOpen=false;
  el("palette").hidden=true;
  var back=el("editor-card").querySelector("button");
  if(back) back.focus();
}
/* A search-index hit for a CCI or a NIST control has no command of its own —
   it resolves to the first embedded STIG rule that cites it, current release
   first, so activating one behaves like activating the rule directly. */
function activateCrosswalkHit(id,field){
  var order=[STATE.version],i;
  for(i=0;i<RHEL_VERSIONS.length;i++){ if(RHEL_VERSIONS[i]!==STATE.version) order.push(RHEL_VERSIONS[i]); }
  for(i=0;i<order.length;i++){
    var ruleset=((DATASETS.RULES||{})[order[i]]&&DATASETS.RULES[order[i]].rules)||[],j;
    for(j=0;j<ruleset.length;j++){
      var r=ruleset[j];
      var hay=field==="cci"?(r.cci||[]):(r.n||[]);
      if(hay.indexOf(id)>=0){ selectStigRule(r.i,order[i]); return; }
    }
  }
  toast("No embedded STIG rule cites "+id+" in this build.");
}
function activateHit(i){
  var h=STATE.paletteHits[i];
  if(!h) return;
  if(h.kind==="Reference"){ selectRefCommand(h.id); }
  else if(h.kind==="Tool"){ selectTool(h.id); }
  else if(h.kind==="STIG"){ selectStigRule(h.id,h.version||STATE.version); }
  else if(h.kind==="CCI"){ activateCrosswalkHit(h.id,"cci"); }
  else if(h.kind==="NIST"){ activateCrosswalkHit(h.id,"nist"); }
  else if(h.kind==="Flag" && h.version && !entryById(h.id)){
    /* a dictionary flag, not a curated entry's own flags[] — the closest real
       thing to open is the tool it belongs to. */
    if(h.tool) selectTool(h.tool);
  }
  else{ if(h.tool) STATE.toolId=h.tool; selectEntry(h.id); }
  closePalette();
}

/* ============ selection ============ */
function selectTool(id,toggle){
  var tool=toolById(id);
  if(!tool) return;
  if(!toolAvailability(tool).available) return;   /* gated: cannot be selected at all */
  STATE.toolId=(toggle&&STATE.toolId===id)?null:id;
  STATE.entryId=null;
  STATE.acked=false;
  STORE.set("lasttool",STATE.toolId);
  renderAll();
}
/* Selecting a reference record CLEARS entryId, and selecting an entry clears
   refId. The two slots are never both set, so no renderer has to decide which
   one wins and no code path can carry a 'ref-' id into an entry slot. */
function selectRefCommand(id){
  var rec=refCommandById(id);
  if(!rec) return;
  STATE.refId=id;
  STATE.refAck=false;
  STATE.entryId=null;
  STATE.stigRuleId=null;
  STATE.line=0;
  renderAll();
}
function selectRefTool(id,toggle){
  STATE.refToolId=(toggle&&STATE.refToolId===id)?null:id;
  renderAll();
}
/* Hydrate one family, on the operator's own instruction. There is no unload:
   a parsed family stays parsed for the life of the page, which is the same
   contract SEARCH_INDEX has had since CR-T-29 -- the cost is paid once and the
   page never gets slower again. */
function selectRefFamily(name){
  if(!name) return;
  hydrateFamily(name);
  renderAll();
}
function doRefCopy(withComment){
  var rec=STATE.refId?refCommandById(STATE.refId):null;
  if(!rec){ toast("Nothing to copy."); return; }
  if(referenceCopyBlocked(STATE.refAck)){
    toast("Unrated vendor text \u2014 tick the acknowledgement box first.");
    return;
  }
  var payload=refCopyPayload(rec,refMeta(),withComment);
  if(payload===null||payload===undefined){ toast("Copy refused."); return; }
  var ok=copyText(payload);
  toast(ok?"Copied \u2014 vendor reference text, not host-verified":"Copy failed \u2014 select the text and use your browser's copy.");
}
function selectEntry(id){
  var entry=entryById(id);
  if(!entry) return;
  if(entryGateInfo(entry).gated) return;            /* gated: cannot be selected at all */
  STATE.entryId=id;
  STATE.refId=null;                                 /* an entry selection replaces a reference record */
  STATE.stigRuleId=null;                            /* an entry selection replaces a standalone rule */
  STATE.line=0;
  STATE.acked=false;
  STATE.formValues={};                              /* a new entry starts with a blank form */
  STATE.rail="builder";
  pushRecent(id);
  renderAll();
}
/* CR-T-26: open a STIG rule reached via search with no command attached to
   it. If the rule has linked commands (build.py's reverse link, rules[].cmds),
   the first is opened as a real entry instead — same panel, more useful — and
   this path is only for a rule with no command in this build's catalog yet. */
function selectStigRule(ruleId,version){
  if(!ruleId||!version) return;
  var ruleset=((DATASETS.RULES||{})[version]&&DATASETS.RULES[version].rules)||[],rule=null,i;
  for(i=0;i<ruleset.length;i++){ if(ruleset[i].i===ruleId){ rule=ruleset[i]; break; } }
  if(!rule) return;
  if(rule.cmds&&rule.cmds.length&&entryById(rule.cmds[0])){
    setVersion(version);
    selectEntry(rule.cmds[0]);
    return;
  }
  STATE.entryId=null;
  STATE.stigRuleId=ruleId;
  STATE.stigRuleVersion=version;
  STATE.rail="builder";
  setVersion(version);
}
function setRail(name){
  STATE.rail=name;
  renderAll();
}
function togglePanel(which){
  /* Both attribute names are string literals at the call site rather than one
     variable, so Q17's setAttribute inventory can prove by reading that neither
     is href/src/style/on* — a gate cannot audit a name it has to guess at
     (MCR-SEC-004). */
  if(which==="sidebar"){
    document.body.setAttribute("data-sidebar",
      document.body.getAttribute("data-sidebar")==="off"?"on":"off");
  }else{
    document.body.setAttribute("data-inspector",
      document.body.getAttribute("data-inspector")==="off"?"on":"off");
  }
}

function renderAll(){
  invalidateResult();          /* one interaction, one assembly (MCR-SEC-012) */
  renderRail();
  renderVersionSelector();
  renderToolList();
  renderEditor();
  renderInspector();
  renderStatusBar();
  renderEvidenceModal();       /* CR-T-28: a no-op hide when the modal is not open */
}

/* ============ one delegated click router — zero inline handlers ============ */
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(!t||!t.closest) return;
  var v=t.closest("[data-version]");
  if(v){ setVersion(v.getAttribute("data-version")); return; }
  var r=t.closest("[data-rail]");
  if(r){ setRail(r.getAttribute("data-rail")); return; }
  var tool=t.closest("[data-tool]");
  if(tool){ selectTool(tool.getAttribute("data-tool"),true); return; }
  var entry=t.closest("[data-entry]");
  if(entry){ selectEntry(entry.getAttribute("data-entry")); return; }
  var refrow=t.closest("[data-ref]");
  if(refrow){ selectRefCommand(refrow.getAttribute("data-ref")); return; }
  var reftool=t.closest("[data-reftool]");
  if(reftool){ selectRefTool(reftool.getAttribute("data-reftool"),true); return; }
  var reffam=t.closest("[data-reffam]");
  if(reffam){ selectRefFamily(reffam.getAttribute("data-reffam")); return; }
  var hit=t.closest("[data-hit]");
  if(hit){ activateHit(parseInt(hit.getAttribute("data-hit"),10)); return; }
  var line=t.closest("[data-line]");
  if(line){
    STATE.line=parseInt(line.getAttribute("data-line"),10);
    reRenderEditorAndInspector();
    return;
  }
  if(t===el("palette")){ closePalette(); return; }
  if(t===el("evidence-modal")){ closeEvidenceModal(); return; }
  var a=t.closest("[data-action]");
  if(!a) return;
  var action=a.getAttribute("data-action");
  if(action==="theme"){ THEME.toggle(); return; }
  if(action==="ack"){ STATE.acked=!!a.checked; reRenderEditorAndInspector(); return; }
  if(action==="ref-ack"){ STATE.refAck=!!a.checked; renderEditor(); return; }
  if(action==="ref-copy"){ doRefCopy(false); return; }
  if(action==="ref-copy-comment"){ doRefCopy(true); return; }
  if(action==="copy"){ doCopy(false); return; }
  if(action==="copy-comment"){ doCopy(true); return; }
  if(action==="copy-doc"){ doCopyDoc(); return; }
  if(action==="export-evidence"){ exportEvidence(); return; }
  if(action==="evidence-copy"){ doCopyEvidence(); return; }
  if(action==="evidence-close"){ closeEvidenceModal(); return; }
  if(action==="fav-toggle"){
    toggleFavorite(a.getAttribute("data-favid"));
    reRenderEditorAndInspector();
    if(STATE.rail==="favorites") renderToolList();
    return;
  }
});

/* A line click or the red-blast ack checkbox only needs the RESULT re-drawn,
   not the whole region: for a generator entry a full renderEditor() would
   rebuild the field inputs from scratch (safe — they re-read STATE.formValues
   — but pointless and a needless focus reset), so this redraws only
   #gen-result for a generator and falls back to the ordinary full render for
   a static entry, which has no separate form to preserve. */
function reRenderEditorAndInspector(){
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  if(entry && isGeneratorEntry(entry)){ renderGeneratorResult(); }
  else{ renderEditor(); }
  renderInspector();
}

/* ============ generator field input -> STATE.formValues, no full re-render ============
   Only #gen-result (the assembled command, banner, toolbar, inspector) redraws
   on a keystroke; the field inputs above it are untouched, so a text input
   never loses focus or cursor position mid-word. Both "input" (fires on every
   keystroke, and on most engines on a <select>) and "change" (the reliable
   event for <select>/checkbox on older engines) route through the same
   handler; re-running it twice for one edit is idempotent. */
function onFieldChange(ev){
  var f=ev.target&&ev.target.closest?ev.target.closest("[data-field]"):null;
  if(!f) return;
  var name=f.getAttribute("data-field");
  var val=f.value;
  if(val===""){ delete STATE.formValues[name]; }else{ STATE.formValues[name]=val; }
  renderGeneratorResult();
  renderInspector();
}
document.addEventListener("input",function(ev){
  if(ev.target && ev.target.id==="palette-input"){ STATE.paletteSel=0; renderPalette(); return; }
  onFieldChange(ev);
});
document.addEventListener("change",onFieldChange);

/* ============ keyboard controller — ONE delegated keydown, ONE binding table ============ */
/* UI spec §5. Every binding lives in KEYMAP; nothing in this file attaches a
   second keydown listener, so the map is the whole truth about what a key does
   and docs/USER_GUIDE.md can be checked against it by reading one array. */
function isTypingTarget(node){
  if(!node||!node.tagName) return false;
  var tag=node.tagName.toLowerCase();
  return tag==="input"||tag==="textarea"||tag==="select"||node.isContentEditable===true;
}
function railAt(n){
  var btns=document.querySelectorAll("#rail .railbtn");
  if(n<1||n>btns.length) return;
  setRail(btns[n-1].getAttribute("data-rail"));
  btns[n-1].focus();
}
function moveWithinList(node,delta){
  var list=node.closest?node.closest("[data-listnav]"):null;
  if(!list) return false;
  var items=list.querySelectorAll("button.row");
  for(var i=0;i<items.length;i++){
    if(items[i]!==node) continue;
    var next=items[i+delta];
    if(next){ next.focus(); }
    return true;
  }
  return false;
}
var KEYMAP=[
  {id:"palette-slash",keys:["/"],mods:"none",whenTyping:false,
   doc:"Open the command palette",run:function(){ openPalette(); }},
  {id:"palette-k",keys:["k","K"],mods:"ctrlOrMeta",whenTyping:true,
   doc:"Open the command palette from anywhere",run:function(){ openPalette(); }},
  {id:"escape",keys:["Escape","Esc"],mods:"any",whenTyping:true,
   doc:"Close the palette or the evidence export panel",
   run:function(){ if(STATE.evidenceOpen){ closeEvidenceModal(); } else { closePalette(); } }},
  {id:"sidebar",keys:["b","B"],mods:"ctrl",whenTyping:true,
   doc:"Toggle the sidebar",run:function(){ togglePanel("sidebar"); }},
  {id:"inspector",keys:["i","I"],mods:"ctrl",whenTyping:true,
   doc:"Toggle the inspector",run:function(){ togglePanel("inspector"); }},
  {id:"theme",keys:["l","L"],mods:"ctrlShift",whenTyping:true,
   doc:"Toggle dark and light theme",run:function(){ THEME.toggle(); }},
  {id:"copy-comment",keys:["c","C"],mods:"ctrlShift",whenTyping:false,
   doc:"Copy the command with its comment header",run:function(){ doCopy(true); }},
  {id:"export-evidence",keys:["e","E"],mods:"ctrl",whenTyping:false,
   doc:"Export as Evidence",run:function(){ exportEvidence(); }},
  {id:"rail-jump",keys:["1","2","3","4","5"],mods:"ctrlAlt",whenTyping:true,
   doc:"Jump to rail 1-5",run:function(ev){ railAt(parseInt(ev.key,10)); }}
];
function modsMatch(rule,ev){
  var ctrl=!!ev.ctrlKey,meta=!!ev.metaKey,shift=!!ev.shiftKey,alt=!!ev.altKey;
  if(rule==="any") return true;
  if(rule==="none") return !ctrl&&!meta&&!alt;
  if(rule==="ctrl") return ctrl&&!alt&&!shift;
  if(rule==="ctrlOrMeta") return (ctrl||meta)&&!alt&&!shift;
  if(rule==="ctrlShift") return ctrl&&shift&&!alt;
  if(rule==="ctrlAlt") return ctrl&&alt&&!shift;
  return false;
}
document.addEventListener("keydown",function(ev){
  var typing=isTypingTarget(ev.target);
  var key=ev.key;
  /* palette-local navigation first: arrows move the selection, Enter opens it */
  if(STATE.paletteOpen){
    if(key==="ArrowDown"||key==="ArrowUp"){
      var delta=(key==="ArrowDown")?1:-1;
      var n=STATE.paletteHits.length;
      if(n){ STATE.paletteSel=(STATE.paletteSel+delta+n)%n; renderPalette(); el("palette-input").focus(); }
      ev.preventDefault();
      return;
    }
    if(key==="Enter"){ activateHit(STATE.paletteSel); ev.preventDefault(); return; }
    if(key==="Tab"){                              /* focus trap: the panel keeps focus */
      var focusables=el("palette").querySelectorAll("input,button");
      if(focusables.length){
        var first=focusables[0],last=focusables[focusables.length-1];
        if(ev.shiftKey && ev.target===first){ last.focus(); ev.preventDefault(); }
        else if(!ev.shiftKey && ev.target===last){ first.focus(); ev.preventDefault(); }
      }
      return;
    }
  }
  /* arrow navigation inside any list of rows, and Enter/Space on a gutter line */
  if((key==="ArrowDown"||key==="ArrowUp") && !typing && ev.target.closest){
    if(moveWithinList(ev.target,key==="ArrowDown"?1:-1)){ ev.preventDefault(); return; }
  }
  if((key==="Enter"||key===" ") && ev.target.closest && ev.target.closest("[data-line]")){
    STATE.line=parseInt(ev.target.closest("[data-line]").getAttribute("data-line"),10);
    renderEditor();
    renderInspector();
    ev.preventDefault();
    return;
  }
  for(var i=0;i<KEYMAP.length;i++){
    var b=KEYMAP[i];
    if(b.keys.indexOf(key)<0) continue;
    if(!modsMatch(b.mods,ev)) continue;
    if(typing && !b.whenTyping) continue;
    b.run(ev);
    ev.preventDefault();
    return;
  }
});

/* ============ boot ============ */
THEME.init();
renderAll();
})();
</script>
</body>
</html>
