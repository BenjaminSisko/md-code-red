<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>__APP_NAME__ __VERSION__</title>
<style>
/* ---- theme tokens: UI spec v1 §6. Light on :root, dark re-declared twice so
       an explicit choice wins in both directions and prefers-color-scheme
       resolves the default at first paint with no flash of the wrong theme. -- */
:root{
  --bg-app:#fafafa; --bg-surface:#ffffff; --bg-editor:#f6f8fa; --bg-gutter:#eef1f6;
  --text-primary:#27272a; --text-secondary:#51607a; --text-muted:#53657d;
  --accent:#b45309; --success:#047857; --warning:#b45309; --danger:#dc2626;
  --primary-action-text:#ffffff; --danger-heading:#b91c1c; --pressed-text:#92400e;
  --brand:#991b1b; --selected-fill:rgba(180,83,9,.10);
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.06);
  --badge-info:#3730a3; --border-primary:#d4d4d8; --focus-ring:#a16207;
  --font-ui:"Trebuchet MS","Liberation Sans",sans-serif;
  --font-display:"DejaVu Serif","Liberation Serif",Georgia,serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* --rail-w was 48px (icon-only, label revealed on hover/focus). Problem 3
     (2026-09-17): the rail now shows its label text unconditionally, so the
     column needs to be wide enough for "Command Builder" at 12px, not just
     one glyph — see .railbtn/.railbtn .lbl. */
  --rail-w:160px; --sidebar-w:240px; --inspector-w:320px; --statusbar-h:28px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
    --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#a1a1aa;
    --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
    --primary-action-text:#18181b; --danger-heading:#f87171; --pressed-text:#fbbf24;
    --brand:#f87171; --selected-fill:rgba(245,158,11,.14);
    --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
    --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
  }
}
:root[data-theme="dark"]{
  --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
  --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#a1a1aa;
  --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
  --primary-action-text:#18181b; --danger-heading:#f87171; --pressed-text:#fbbf24;
  --brand:#f87171; --selected-fill:rgba(245,158,11,.14);
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
  --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
}
*{box-sizing:border-box;}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
  margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg-app); color:var(--text-primary);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  display:grid; grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) var(--inspector-w);
  grid-template-rows:minmax(0,1fr) var(--statusbar-h);
  grid-template-areas:"rail sidebar editor inspector" "status status status status";
}
body[data-sidebar="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) var(--inspector-w);}
body[data-inspector="off"]{grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) 0;}
body[data-sidebar="off"][data-inspector="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) 0;}
body[data-sidebar="off"] #sidebar,body[data-inspector="off"] #inspector{display:none;}
@media (max-width:1024px){
  body{
    grid-template-columns:var(--rail-w) 200px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 220px var(--statusbar-h);
    grid-template-areas:"rail sidebar editor" "rail sidebar inspector" "status status status";
  }
  body[data-sidebar="off"]{
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    grid-template-areas:"rail editor" "rail inspector" "status status";
  }
  body[data-inspector="off"]{
    grid-template-columns:var(--rail-w) 200px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) var(--statusbar-h);
    grid-template-areas:"rail sidebar editor" "status status status";
  }
  body[data-sidebar="off"][data-inspector="off"]{
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) var(--statusbar-h);
    grid-template-areas:"rail editor" "status status";
  }
}
/* Never outline:none without a replacement (UI spec §6) — :focus is the ESR
   fallback for engines that predate :focus-visible. */
:focus{outline:2px solid var(--focus-ring); outline-offset:1px;}
:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
#rail{grid-area:rail; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  display:flex; flex-direction:column; align-items:stretch; gap:3px; padding:8px 7px;}
#sidebar{grid-area:sidebar; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#editor{grid-area:editor; background:var(--bg-editor); overflow:auto; padding:14px 16px; min-width:0;}
#inspector{grid-area:inspector; background:var(--bg-surface); border-left:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#statusbar{grid-area:status; background:var(--bg-surface); border-top:1px solid var(--border-primary);
  display:flex; align-items:center; gap:10px; padding:0 10px; font-size:12px;
  color:var(--text-secondary); overflow:hidden; white-space:nowrap;}
.skiplink{position:fixed; left:12px; top:8px; z-index:100; padding:8px 12px;
  border:2px solid var(--focus-ring); border-radius:5px; background:var(--bg-surface);
  color:var(--text-primary); transform:translateY(-160%);}
.skiplink:focus{transform:translateY(0);}
.railbrand{padding:4px 8px 12px; margin:0 0 5px; border-bottom:1px solid var(--border-primary);}
.railbrand h1{display:block; margin:0; font-family:var(--font-display); font-size:17px; line-height:1;
  letter-spacing:.025em;}
.railbrand h1 span{color:var(--brand);}
.railbrand small{display:block; margin-top:6px; color:var(--text-secondary); font-family:var(--font-mono);
  font-size:11px; line-height:1.2; letter-spacing:.08em; text-transform:uppercase;}
.quicksearch{width:100%; min-height:34px; margin:0 0 5px; border:1px solid var(--border-primary);
  border-radius:6px; background:var(--bg-editor); color:var(--text-secondary); font:inherit;
  font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
  padding:0 8px; text-align:left;}
.quicksearch:hover{border-color:var(--accent); color:var(--text-primary);}
.quicksearch kbd{font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);}
#palette[hidden]{display:none;}
#palette{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
  align-items:flex-start; justify-content:center; padding-top:12vh; z-index:50;}
#palette>.panel{background:var(--bg-surface); border:1px solid var(--border-primary);
  border-radius:8px; width:min(640px,92vw); padding:12px;}
#palette input{width:100%; padding:7px 9px; font:inherit; color:var(--text-primary);
  background:var(--bg-editor); border:1px solid var(--border-primary); border-radius:5px;}
input::placeholder,textarea::placeholder{color:var(--text-muted);opacity:1}
.region-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px;}
.railbtn{position:relative; width:100%; height:34px; border:1px solid transparent; border-radius:6px;
  background:transparent; color:var(--text-secondary); font-family:var(--font-mono);
  font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; padding:0 8px;
  text-align:left;}
.railbtn:hover{border-color:var(--border-primary); color:var(--text-primary);}
.railbtn[aria-current="true"]{border-color:var(--accent); color:var(--accent);
  background:linear-gradient(90deg,var(--selected-fill),transparent 75%);}
/* Founder alpha feedback (2026-09-17), problem 3: "the left rail's icons [...]
   read as bare symbols with no meaning." The glyph (">", "$", etc.) and the
   aria-label/title always named each rail item, but .lbl used to sit
   absolutely positioned with opacity:0, shown only on :hover/:focus — so a
   sighted mouse user saw nothing but the bare glyph until they happened to
   point at it. The label is now ordinary, always-visible button content,
   laid out next to the glyph instead of overlaid on hover; the glyph keeps
   its fixed width so every row's label still lines up in a column. */
.railbtn .glyph{display:inline-block; width:16px; text-align:center; flex:none;}
.railbtn .lbl{font-family:var(--font-ui); font-size:12px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;}
.seg{display:flex; gap:4px; margin:0 0 10px;}
.seg button{flex:1; padding:4px 0; border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; cursor:pointer;}
.seg button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600;}
.card{border:1px solid var(--border-primary); border-radius:8px; background:var(--bg-surface);
  padding:14px 16px; margin:0 0 12px; box-shadow:0 1px 0 rgba(0,0,0,.03);}
.card h2{margin:0 0 7px; font-family:var(--font-display); font-size:18px; line-height:1.25;}
.muted{color:var(--text-muted);}
code,pre{font-family:var(--font-mono);}
.statusitem{display:inline-flex; align-items:center; gap:5px;}
.statusitem+.statusitem::before{content:"\00b7"; color:var(--text-muted); margin-right:5px;}
.statusactions{margin-left:auto; display:flex; align-items:center; gap:5px;}
.themebtn,.panelbtn{border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; font-size:12px;
  padding:1px 8px; cursor:pointer;}
.panelbtn[aria-pressed="true"]{border-color:var(--accent); color:var(--pressed-text);
  background:var(--selected-fill); font-weight:600;}
.themebtn:hover,.panelbtn:hover{border-color:var(--accent); color:var(--text-primary);}
.toast{color:var(--accent); font-weight:600;}
/* list rows — tools, entries, palette results. Arrow keys move between them. */
.list{list-style:none; margin:0 0 12px; padding:0;}
.list li{margin:0 0 2px;}
.row{display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:5px;
  background:transparent; color:var(--text-primary); font:inherit; padding:4px 7px; cursor:pointer;}
.row:hover{border-color:var(--border-primary);}
.row[aria-current="true"]{border-color:var(--accent); color:var(--accent);}
.row[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed; border-style:dashed;
  border-color:var(--border-primary);}
.row .why{display:block; font-size:11px; color:var(--text-muted);}
/* editor code block: gutter column + monospace lines */
.codeblock{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  overflow-x:auto; margin:0 0 12px;}
.codeline{display:flex; align-items:flex-start; font-family:var(--font-mono); font-size:13px;}
.codeline:focus{outline-offset:-2px;}
.codeline .ln{flex:0 0 42px; text-align:right; padding:2px 8px 2px 0; color:var(--text-muted);
  background:var(--bg-gutter); border-right:1px solid var(--border-primary);
  user-select:none; -webkit-user-select:none;}
.codeline .lc{padding:2px 10px; white-space:pre; color:var(--text-primary);}
.codeline[aria-current="true"] .lc{color:var(--accent);}
/* read-only preview of the clipboard payload — threat-model-v1 §9: what is in
   the preview is exactly and only what gets copied (MCR-SEC-003) */
.copypreview{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  color:var(--text-muted); font-family:var(--font-mono); font-size:12px; line-height:1.5;
  padding:8px 10px; margin:0 0 12px; overflow-x:auto; white-space:pre;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px;}
.btn{border:1px solid var(--border-primary); border-radius:5px; background:var(--bg-surface);
  color:var(--text-primary); font:inherit; font-size:13px; padding:4px 11px; cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn[disabled],.btn[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
/* red blast banner — role="alert", never colour alone, holds Copy until acked */
.blast{border:2px solid var(--danger); border-radius:6px; padding:10px 12px; margin:0 0 12px;
  background:var(--badge-critical-fill);}
.blast h2{color:var(--danger-heading); font-size:14px; margin:0 0 4px;}
.blast label{display:block; margin-top:8px; font-size:13px;}
.badge{display:inline-block; border:1px solid var(--badge-info); border-radius:999px;
  padding:0 8px; font-size:11px; margin:0 5px 5px 0; color:var(--text-primary);}
.badge.cat1{border-color:var(--badge-critical); background:var(--badge-critical-fill); color:var(--danger);}
.badge.cat2{border-color:var(--danger); color:var(--danger);}
.badge.cat3{border-color:var(--warning); color:var(--warning);}
.badge.privilege{border-color:var(--warning); color:var(--warning); margin-left:6px;}
/* Per-version verification status (CEO ruling: verified is per-version, not
   per-entry — capture-review-run1-2026-09-18.md RILEY-F1). Three states only,
   never a free color: a real {by,on,host,capture} receipt (verified), a
   capture with no receipt yet (captured, awaiting QA), or neither
   (not host-verified). See verificationStatusForVersion(). */
.vbadge{display:inline-block; border-radius:999px; padding:0 8px; font-size:11px;
  margin-left:6px; border:1px solid var(--border-primary); color:var(--text-secondary);}
.vbadge.v-verified{border-color:var(--success); color:var(--success);}
.vbadge.v-captured{border-color:var(--warning); color:var(--warning);}
.vbadge.v-unverified{color:var(--text-muted);}
.stagelist{margin:0 0 12px;}
.stagerow{border:1px solid var(--border-primary); border-radius:6px; padding:8px 10px;
  margin:0 0 8px; background:var(--bg-surface);}
.stagerow.bad{border-color:var(--danger);}
.stagerow .stagehead{display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
  justify-content:space-between;}
.stagerow .stageno{font-size:11px; color:var(--text-muted); text-transform:uppercase;
  letter-spacing:.06em;}
.stagerow .stagecmd{font-family:var(--font-mono); font-size:12px; color:var(--text-secondary);
  overflow-x:auto; white-space:pre; display:block; margin:4px 0 0;}
.stagerow .stagewhy{margin:4px 0 0; font-size:12px; color:var(--danger);}
.stagerow .stageops{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0; align-items:center;}
.stagerow select,.stagerow input{font:inherit; font-size:12px; padding:3px 6px;
  border:1px solid var(--border-primary); border-radius:5px; background:var(--bg-editor);
  color:var(--text-primary);}
.sbadge{display:inline-block; border:1px solid var(--border-primary); border-radius:999px;
  padding:0 8px; font-size:11px; color:var(--text-muted);}
.sbadge.b-green{border-color:var(--success); color:var(--success);}
.sbadge.b-yellow{border-color:var(--warning); color:var(--warning);}
.sbadge.b-red{border-color:var(--danger); color:var(--danger);}
.sbadge.b-unrated{border-color:var(--text-muted); color:var(--text-muted);}
.flagrow{border-top:1px solid var(--border-primary); padding:6px 0;}
.flagrow .tok{font-family:var(--font-mono); font-size:12px; color:var(--accent);}
.flagrow .source{display:block; font-size:11px; color:var(--text-muted);}
.flagrow .mean{display:block; font-size:12px; color:var(--text-secondary);}
.unverified{color:var(--text-muted); font-style:italic;}
/* generator guided-form fields (CR-T-17..25) — required/optional/version-gated
   states per UI spec v1 §4: required carries a coloured mark and "(required)"
   in the label text (never colour alone), a gated field is disabled with its
   reason in a .why line, exactly like a gated tool/entry row above. */
.field{display:flex; flex-direction:column; gap:3px; margin:0 0 10px;}
.field label{font-size:12px; color:var(--text-secondary);}
.field .req{color:var(--danger);}
.field input,.field select{font:inherit; font-size:13px; padding:4px 7px;
  border:1px solid var(--border-primary); border-radius:5px;
  background:var(--bg-app); color:var(--text-primary);}
.field input[type="checkbox"]{align-self:flex-start; width:auto; padding:0;}
.field input[disabled],.field select[disabled]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
.field .why{margin:0; font-size:11px; color:var(--text-muted);}
/* ---- CR-T-26 STIG panel ---- */
#stig-panel:empty{display:none;}
.stigcard{border:1px solid var(--border-primary); border-radius:8px; margin:0 0 12px; padding:10px 12px;}
.stigcard h3{margin:0 0 6px; font-size:13px;}
.stigtext{white-space:pre-wrap; word-break:break-word; background:var(--bg-editor);
  border:1px solid var(--border-primary); border-radius:5px; padding:6px 8px;
  margin:4px 0 0; font-size:12px; max-height:260px; overflow:auto;}
.stigcard summary{cursor:pointer; font-size:12px; color:var(--accent); margin:6px 0 0;}
.sunsetbanner{border:1px solid var(--warning); border-radius:6px; padding:6px 8px;
  margin:0 0 8px; font-size:12px; color:var(--warning);}
.changednote{border-left:3px solid var(--badge-info); padding:2px 0 2px 8px;
  margin:6px 0 0; font-size:12px; color:var(--text-secondary);}
.nocaptureyet{font-size:12px; font-style:italic; color:var(--text-muted); margin:6px 0 0;}
/* ---- CR-T-29 palette result groups ---- */
.palettegroup{font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); margin:8px 0 2px; padding:0 2px;}
.palettegroup:first-child{margin-top:0;}
.palettetiming{font-size:11px; color:var(--text-muted); margin:6px 0 0;}
/* ---- CR-T-28 evidence exporter ---- */
#evidence-modal[hidden]{display:none;}
#evidence-modal{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
  align-items:flex-start; justify-content:center; padding-top:6vh; z-index:60;}
#evidence-modal>.panel{background:var(--bg-surface); border:1px solid var(--border-primary);
  border-radius:8px; width:min(760px,94vw); max-height:86vh; overflow:auto; padding:14px;}
.evidencepre{white-space:pre-wrap; word-break:break-word; background:var(--bg-editor);
  border:1px solid var(--border-primary); border-radius:6px; padding:10px 12px;
  font-size:12px; margin:8px 0;}
/* ---- CR-T-30 favorites, recent, about ---- */
.favbtn{border:1px solid var(--border-primary); border-radius:5px; background:transparent;
  color:var(--text-secondary); font:inherit; font-size:12px; padding:1px 8px; cursor:pointer;}
.favbtn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent);}
.aboutblock{border-left:3px solid var(--border-primary); padding:2px 0 2px 10px;
  margin:0 0 12px; font-size:12px; white-space:pre-wrap;}
.fieldhelp{margin:4px 0 8px;padding:7px 9px;border-left:3px solid var(--accent);background:var(--bg-editor);font-size:12px;line-height:1.45;}
.fieldhelp p{margin:2px 0}.fieldhelp>p:first-child{color:var(--text-secondary)}
.fieldhelp details{margin-top:5px}.fieldhelp summary{cursor:pointer;color:var(--accent);font-weight:600}
.fieldhelp details p{margin:5px 0 0}
.opplan{margin:14px 0;border:1px solid var(--border-primary);border-radius:6px;overflow:hidden}
.planstep{padding:10px 12px;border-top:1px solid var(--border-primary)}.planstep:first-child{border-top:0}
.planstep h3{margin:0 0 5px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.planstep pre{white-space:pre-wrap;margin:5px 0}
.compare{width:100%;border-collapse:collapse;font-size:12px}.compare th,.compare td{text-align:left;vertical-align:top;padding:6px;border:1px solid var(--border-primary)}
.learncard{border-left:3px solid var(--accent);padding:8px 10px;margin:8px 0;background:var(--bg-editor)}
.risknote{padding:7px 9px;border:1px solid var(--border-primary);border-radius:5px;margin:8px 0}
/* Task-first home and selected-command workspace. These are presentation
   surfaces over the existing curated IDs and currentResult(); they do not
   change assembly, validation, evidence, or clipboard behavior. */
.homehero{padding:24px;max-width:1040px;margin:0 auto;background:linear-gradient(135deg,var(--bg-surface),var(--bg-editor));}
.homehero h2{font-size:28px;margin-bottom:8px}.homehero>p{max-width:68ch;font-size:15px;color:var(--text-secondary)}
.homeactions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}.homeactions .btn{min-height:44px;font-weight:700}
.homegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1040px;margin:0 auto 12px}
.homepanel{border:1px solid var(--border-primary);border-radius:8px;background:var(--bg-surface);padding:16px}
.homepanel h3{font:700 16px var(--font-display);margin:0 0 5px}.homepanel p{color:var(--text-secondary);margin:0 0 10px}

<body data-sidebar="on" data-inspector="off" data-selection-open="false">
<a class="skiplink" href="#editor">Skip to command workspace</a>

     label is now always visible, not revealed only on hover/focus (UI spec §2
     as amended, problem 3) -- see .railbtn/.railbtn .lbl in the stylesheet. -->

  </div>

  <button type="button" class="railbtn" data-rail="stig" aria-label="Compliance search" title="Compliance search (Ctrl+Alt+3)"><span class="glyph" aria-hidden="true">C</span><span class="lbl">Compliance</span></button>
  <button type="button" class="railbtn" data-rail="ansible" aria-label="Build Ansible automation" title="Build Ansible automation (Ctrl+Alt+4)"><span class="glyph" aria-hidden="true">Y</span><span class="lbl">Ansible</span></button>

<!-- SIDEBAR — context panel for the active rail tool -->
<aside id="sidebar" role="complementary" aria-label="Command navigator">
  <p class="region-label">RHEL version</p>
  <div class="seg" id="version-seg" role="group" aria-label="RHEL version selector"></div>
  <div id="sidebar-body"><p class="muted">Reading the embedded content island.</p></div>
</aside>

<!-- EDITOR — the generated command, with gutter -->
<main id="editor" role="main" aria-label="Command workspace" tabindex="-1">
  <div id="blast-banner"></div>
  <div class="card" id="editor-card">
    <h2>Loading</h2>
    <p class="muted" id="editor-empty">Reading the embedded content island.</p>
  </div>
  <!-- CR-T-31: renderPipelinePanel() owns this sink exclusively, as its own
       statement, the same composition rule every other multi-sink renderer in
       this file follows (Q17: a bare call's return is never spliced into
       another function's accumulator). -->
  <div id="pipeline-panel"></div>
  <!-- print view (CR-T-30, UI spec §4): the screen's STIG panel lives in
       #inspector, which @media print hides along with the rest of the chrome.
       renderStigPanel() writes the SAME content here, in a separate statement,
       as its own audited sink (Q17), so what prints is the current entry plus
       its STIG panel and nothing else — no external resources, no chrome. -->
  <div id="print-stig-panel" class="print-only"></div>
</main>

<!-- INSPECTOR — flag explanations, badges, provenance -->
<aside id="inspector" role="complementary" aria-label="Command safety and evidence">
  <p class="region-label">Inspector</p>
  <!-- CR-T-26: renderStigPanel() owns this sink exclusively. -->
  <div id="stig-panel"></div>
  <div id="inspector-body"><p class="muted">Flag-by-flag explanations render here.</p></div>
</aside>

<!-- STATUSBAR — version state, pinned STIG releases, tool version -->
<footer id="statusbar" role="contentinfo" aria-label="Application status and controls"></footer>

<!-- PALETTE — command palette overlay (/ or Ctrl/Cmd+K) -->

  <div class="panel">
    <label class="region-label" for="palette-input">Search tools and commands</label>

           aria-autocomplete="list" aria-expanded="false" aria-controls="palette-list" aria-describedby="palette-help"
           placeholder="Tool name or command intent">

    <div id="palette-results"></div>
  </div>
</div>

<!-- EVIDENCE MODAL — CR-T-28. exportEvidence() owns this sink exclusively; the
     <pre> here is the SAME string doCopy()'s clipboard rule requires: what is
     previewed is exactly and only what a Copy button on this panel copies
     (threat-model-v1 §9, MCR-SEC-003's rule applied to the exporter). -->
<div id="evidence-modal" role="dialog" aria-modal="true" aria-label="Export command and control reference" hidden>
  <div class="panel" id="evidence-modal-body"></div>
</div>

<script id="mcr-data" type="application/json">/*__DATA__*/</script>
<!-- THE REFERENCE CORPUS. Four more JSON islands, and NOT ONE of them is parsed
     at boot (Al Kowalski's ruling: lazy per-family, per-tier hydration is
     mandatory past 5,000 corpus records, and the inverted index lands before the
     second family does; this tranche is 14,439 records across three families).

     mcr-ref-index is the build-time inverted index: token -> posting list. The
     palette parses it on the first keystroke and uses it to decide which
     families a query can possibly hit. Each mcr-ref-FAMILY island holds that
     family's records alone, and is parsed the first time something actually
     needs one -- so a search that only matches DISA text never pays for the
     4.1 MB of Red Hat documentation, and an operator who never opens the
     Reference rail never pays for any of it.

     They are separate ELEMENTS rather than strings inside mcr-data on purpose:
     JSON-escaping the families into the main island measured 32.8% larger, and
     it would hide them from qa.py, the test harnesses and anyone reading the
     shipped file. build.py's ISLANDS list is the one declaration of this set,
     and qa.py Q1 names the same set and proves each one parses.

     No element name is spelled out anywhere in this comment: Q1 counts script
     elements with a regular expression over the raw file, which cannot tell
     markup from a comment describing markup, and a comment that mentions the
     tag by name adds a phantom element to that count. -->

<script id="mcr-ref-index" type="application/json">/*__REF_INDEX__*/</script>
<script id="mcr-ref-stig_rules" type="application/json">/*__REF_STIG_RULES__*/</script>
<script id="mcr-ref-raw_captures" type="application/json">/*__REF_RAW_CAPTURES__*/</script>
<script id="mcr-ref-redhat_guides" type="application/json">/*__REF_REDHAT_GUIDES__*/</script>
<script>
"use strict";
(function(){
/* ============ old-browser polyfills (ESR-era Firefox on air-gapped boxes) ============ */
if(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach=Array.prototype.forEach;
if(!Element.prototype.matches) Element.prototype.matches=Element.prototype.msMatchesSelector||Element.prototype.webkitMatchesSelector;

/* ============ identity constants (qa.py checks these against build.py) ============ */
var APP_NAME="__APP_NAME__";
var APP_VERSION="__VERSION__";
var APP_BUILD_DATE="__BUILT_DATE__";
var APP_CLASSIFICATION="__CLASSIFICATION__";
/* CR-T-28/CR-T-30. sha256 of the data island, computed by build.py BEFORE the
   island is substituted into this file (never a hash of a string containing
   itself) and embedded here as a plain constant, exactly like the four above
   it. qa.py Q1 re-hashes the shipped island and checks it against this
   constant independently. */
var CONTENT_FINGERPRINT="__CONTENT_FINGERPRINT__";
var RHEL_VERSIONS=["7","8","9","10"];
/* Founder alpha feedback (2026-09-17): the version selector opened on RHEL 9,
   the one release with no host captures and no extraction, so the first
   screen was a column of "Documented, not host-verified" notes under every
   tool. build.py's compute_default_version() derives this from the SAME
   per-version verified receipts the inspector and status bar already read
   (extract/schema.py's entry_has_any_receipt shape) -- the release with the
   most real receipts wins, ties broken toward the lower RHEL version number
   for a stable, explainable result -- and writes it here as a plain
   constant, the same as the four identity constants above. Never a literal
   "8": if a future capture run shifts the lead to RHEL 9 or 10, this token
   follows the data on the next build with no line to remember to change. */
var DEFAULT_VERSION="__DEFAULT_VERSION__";
/* CR-T-30. The About panel's attribution block, verbatim from
   05_Compliance_Legal/MD_CODE_RED/content-licensing-ruling-v1.md, "Attribution
   Block (Required in MD CODE RED About Panel)". Content and source list are
   unchanged from that ruling; the source em dashes are written here as a
   plain hyphen so this file never carries a hand-typed non-ASCII glyph
   (Q21 scans every tracked file for exactly that class of character). */
/* Licensing ruling v1 Ruling 2 (Alex Okafor, 2026-09-18), condition 4: a full
   CC BY-SA notice ships in the About panel alongside the existing attribution
   block, and per-command attribution ships on each reference record's own panel.
   The last paragraph is not hedging for its own sake -- the ruling says in terms
   that attribution alone may not discharge share-alike if counsel later
   disagrees, and a product that wrote this up as settled would be overclaiming
   on a legal question in exactly the way it refuses to overclaim on a technical
   one. */
var CCBYSA_NOTICE=[
"Command lines mined from Red Hat Enterprise Linux product documentation are",
"(c) Red Hat, Inc., and are licensed under the Creative Commons",
"Attribution-Share Alike 3.0 Unported licence (CC BY-SA 3.0).",
"",
"    https://creativecommons.org/licenses/by-sa/3.0/",
"",
"Each such command carries its own attribution on its panel: the guide title,",
"the URL of the original version, and this copyright line. No prose from those",
"guides is reproduced anywhere in this artifact -- only command lines, which are",
"the invocation syntax a program's own argument parser defines.",
"",
"Red Hat, as the licensor of that documentation, waives the right to enforce,",
"and agrees not to assert, Section 4d of CC-BY-SA to the fullest extent",
"permitted by applicable law.",
"",
"This reproduction rests on a judgment call recorded in SALM Content Licensing",
"Ruling v1, Ruling 2, dated 2026-09-18: that a bare command line is a functional",
"fact rather than expressive prose. That ruling states plainly that attribution",
"alone may not discharge share-alike if counsel later disagrees. It is therefore",
"necessary and not sufficient, and nothing here should be read as settling the",
"question."
].join("\n");

var ATTRIBUTION_BLOCK=[
  "Content Sources & Licensing:",
  "",
  "This toolkit embeds content derived from the following sources under their respective terms:",
  "",
  "- DISA STIG & CCI Lists (Public Domain, US Government work) - https://www.cyber.mil/stigs/",
  "- NIST SP 800-53 Rev 5 / OSCAL (CC0 1.0, Public Domain) - https://github.com/usnistgov/oscal-content",
  "- ComplianceAsCode Project (BSD-3-Clause License) - https://github.com/ComplianceAsCode/content",
  "- Red Hat Enterprise Linux Documentation (CC-BY-SA 3.0) - https://docs.redhat.com/",
  "- Linux man-pages & GNU Utilities (GPL-2.0-or-later) - https://www.kernel.org/doc/man-pages/",
  "- Ansible Project (GPLv3) - https://github.com/ansible/ansible",
  "",
  "Paraphrased content, remediation code, and identifiers are integrated to provide a unified "+
  "toolkit for RHEL 9 compliance. Full compliance details: [link to detailed licensing document]."
].join("\n");
/* The no-guess law: a flag with no curated explanation says so, it never invents one. */
var UNVERIFIED_FLAG_COPY="unverified — see man page";

/* ============ escaping — every value that reaches innerHTML goes through one ============ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function escapeAttr(s){
  /* attribute context: same entity set, plus backtick and equals, which some
     legacy engines treat as attribute delimiters in unquoted contexts. */
  return esc(s).replace(/`/g,"&#96;").replace(/=/g,"&#61;");
}
function escapeRegex(s){
  return String(s==null?"":s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}
function el(id){return document.getElementById(id);}

/* ============ storage guard — schema-versioned, try/catch on every access ============ */
/* Every storage identifier below sits inside its own try/catch, on purpose: the
   guard has to survive a mechanical audit (Q7), so no helper is allowed to
   receive a storage object as an argument and hide the access behind a name. */
var STORE=(function(){
  var NS="mdcr.v1.";
  var SCHEMA=1;
  function unwrap(raw,fb){
    if(!raw) return fb;
    var rec=null;
    try{ rec=JSON.parse(raw); }catch(e){ return fb; }
    if(!rec||rec.schema!==SCHEMA) return fb;     /* unknown schema: discard silently */
    return rec.data;
  }
  function wrap(value){ return JSON.stringify({schema:SCHEMA,data:value}); }
  return {
    ns:NS, schema:SCHEMA,
    get:function(k,fb){
      try{ return unwrap(localStorage.getItem(NS+k),fb); }catch(e){ return fb; }
    },
    set:function(k,v){
      try{ localStorage.setItem(NS+k,wrap(v)); return true; }catch(e){ return false; }
    },
    getSession:function(k,fb){
      try{ return unwrap(sessionStorage.getItem(NS+k),fb); }catch(e){ return fb; }
    },
    setSession:function(k,v){
      try{ sessionStorage.setItem(NS+k,wrap(v)); return true; }catch(e){ return false; }
    }
  };                                              /* file:// storage may be blocked */
})();

/* ===== MCR-ASSEMBLER-BEGIN =================================================
   CR-T-15, the command assembler. Everything between this marker and
   MCR-ASSEMBLER-END is PURE: no document, no window, no storage, no data
   island, no clock. tests/hostile_harness.js lifts this block verbatim out of
   template.html (and qa.py Q18 lifts it out of the SHIPPED artifact) and runs
   it under Node against tests/fixtures/hostile-inputs.json, so the code proved
   safe by CI is the same code the jump box runs. Adding a DOM or DATA
   reference in here silently turns that gate into a test of nothing.

   Escaping domains are never interchanged (threat-model-v1 §3.2):
   esc()/escapeAttr() render to the DOM, shQuote() quotes for a POSIX shell,
   yamlQuote() quotes a YAML single-quoted scalar. qa.py Q18 fails the build if
   any one is ever nested inside any other, in either direction.

   MCR-SEC-010, and how it is closed. A YAML quoter existed here once, was
   correct, and had NO CALL SITE: assembleCommand() had no YAML output path, so
   Q18's quoting-domain gate passed on a domain that did not exist and the
   harness's YAML invariant only asserted the function's behaviour to itself. A
   dead escaper reads as "Ansible YAML output is proven safe", which was not
   true. It was deleted, and the gate was narrowed to SHELL-ONLY with one
   standing condition attached (Marcus Reed's D3): the sink, the quoter and a
   YAML-PARSING ORACLE ship in the same commit or not at all.

   This is that commit. composeDoc() below is the sink — the Ansible playbook,
   inventory and ansible.cfg generators emit a FILE alongside their command —
   yamlQuote() is the quoter, and tests/hostile_harness.js carries
   parseYamlSubset()/parseIniSubset(), which parse every emitted document and
   assert every operator value comes back out of the parser exactly as it went
   in. Containment proven by parsing, the way parseRichRule() proves rich rules,
   and not by looking for the value inside quotation marks.

   THE TWO DOMAINS ARE NEVER SHARED. shQuote() wraps in single quotes and ends
   the quoted run to emit an escaped quote ('it'\''s'); yamlQuote() wraps in
   single quotes and DOUBLES the quote (''), because a YAML single-quoted scalar
   has exactly one escape and it is not a backslash. Substituting either for the
   other produces a string that is syntactically wrong in the other's grammar,
   which is precisely what the harness's domain-swap control asserts. Neither
   function is ever applied to the other's output, and no value takes both
   paths: template[] tokens go to shQuote(), doc lines go to yamlQuote(), and
   the INI kind takes neither (see composeDoc()).
   ========================================================================== */

/* The version-gating sentence lives inside the block so the block is entirely
   self-contained: the harness runs it with no other scope in sight. */
var GATED_COPY="Not available in RHEL ";


/* POSIX single-quote quoting, applied UNIFORMLY to every user-supplied value.
   There is deliberately no "this value looks harmless, leave it bare" branch:
   per-field author discretion is exactly the hole threat-model-v1 §3.2 closes.
   The cosmetic cost is --zone='public' instead of --zone=public. */
function shQuote(s){
  return "'"+String(s).replace(/'/g,"'\\''")+"'";
}

/* YAML single-quoted scalar quoting, applied UNIFORMLY to every operator-supplied
   value that reaches a YAML file. Its own escaping domain, sharing no code
   and no idiom with shQuote() above.

   A YAML single-quoted scalar has exactly ONE escape sequence: '' for a literal
   apostrophe. There is no backslash escape inside single quotes — a backslash is
   an ordinary character there — which is why shQuote()'s '\'' idiom is not
   merely cosmetically wrong in this domain but produces a DIFFERENT VALUE:
   yamlQuote("it's") is 'it''s' and parses back as "it's", while shQuote("it's")
   is 'it'\''s' and parses, in YAML, as the scalar "it" followed by junk the
   parser rejects. That asymmetry is the whole reason these are two functions and
   not one with a flag.

   Like shQuote() there is deliberately no "this value looks harmless, leave it
   bare" branch. The only bare scalars a file can contain come from a `bool`
   line, whose value is a JSON boolean in the curated spec — there is no path
   from a form field to an unquoted YAML scalar. */
function yamlQuote(s){
  return "'"+String(s).replace(/'/g,"''")+"'";
}

/* Characters that never belong in ANY field, checked before the per-type
   allow-list so the rejection reason names the real problem. */
var CTRL_RE=/[\u0000-\u001F\u007F-\u009F]/;

   the one unassigned code point inside the invisible-format block — were the
   gap. They are inert inside a POSIX single-quoted token, but .codeline .lc
   renders white-space:pre, so a rendered command could show a line break the
   copied one-line string does not have: render/copy divergence in the same

function isIpv4(s){
  return /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(s);

function isIpv6(s){

      if(parts[j]==="") return false;
      groups.push(parts[j]);

      count+=2;

function isPort(s){

function isRemotePath(s){

    if(at>=0){
      if(authority.indexOf("@",at+1)>=0) return false;
      user=authority.slice(0,at); authority=authority.slice(at+1);

/* The field TYPE system (threat-model-v1 §3.1). Allow-list, full match, capped.
   'comment' is the ONLY free-text type in the product, it is the only type that

   shell. Everything else is a closed grammar or an enum. */
var FIELD_TYPES={
  hostname:{cap:253,label:"hostname (RFC 1123)",re:HOSTNAME_RE},
  ipv4:{cap:15,label:"IPv4 address",fn:isIpv4},
  ipv6:{cap:45,label:"IPv6 address",fn:isIpv6},
  ipaddr:{cap:45,label:"IP address",fn:isIpAddr},
  cidr:{cap:49,label:"IP address or CIDR block",fn:isCidr},
  port:{cap:5,label:"port number 1-65535",fn:isPort},
  portrange:{cap:11,label:"port or port range",fn:isPortRange},
  protocol:{cap:4,label:"protocol",enums:["tcp","udp","sctp","dccp"]},
  family:{cap:4,label:"address family",enums:["ipv4","ipv6"]},
  action:{cap:6,label:"rich-rule action",enums:["accept","reject","drop"]},
  /* No backslash in the class: systemd's own \x2d device escapes are legal unit
     syntax but nothing in this product's P0 tool set needs them, and a backslash
     is the one character that changes meaning between the shell, YAML, and a
     unit name. The hostile-input harness caught it here; keep it out. */

  username:{cap:32,label:"POSIX user name",re:USERNAME_RE},
  groupname:{cap:32,label:"POSIX group name",re:/^[a-z_][a-z0-9_-]{0,31}$/},
  path:{cap:255,label:"absolute path",fn:isPath},
  remote_path:{cap:509,label:"remote path in [user@]host:/absolute/path form",fn:isRemotePath},
  http_url:{cap:1024,label:"HTTP or HTTPS URL",fn:isHttpUrl},
  git_repository:{cap:1024,label:"Git repository (https://, ssh://, user@host:path, or absolute local path)",fn:isGitRepository},
  git_path:{cap:255,label:"literal repository-relative Git path",fn:isGitPath},
  shell_variable:{cap:128,label:"shell variable name",re:/^[A-Za-z_][A-Za-z0-9_]*$/},
  pid:{cap:10,label:"process ID greater than zero",fn:isPid},
  zone:{cap:17,label:"firewalld zone",re:/^[A-Za-z0-9_-]{1,17}$/},

  connection_name:{cap:128,label:"ASCII NetworkManager connection name or UUID",re:/^[A-Za-z0-9][A-Za-z0-9_. -]{0,127}$/},
  lvm_name:{cap:128,label:"LVM volume name",re:/^[A-Za-z0-9][A-Za-z0-9+_.-]{0,127}$/},
  container_name:{cap:128,label:"container name",re:/^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$/},
  directory_name:{cap:128,label:"directory name",re:/^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/},
  unit_description:{cap:128,label:"systemd unit description",re:/^[A-Za-z0-9][A-Za-z0-9 .,:_()\/-]{0,127}$/},
  chrony_directive:{cap:256,label:"chronyd server or pool directive",fn:isChronyDirective},
  package:{cap:128,label:"package name",re:/^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$/},

  audit_key:{cap:31,label:"audit rule key",re:/^[A-Za-z0-9_-]{1,31}$/},
  interface:{cap:15,label:"network interface",re:/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$/},
  integer:{cap:10,label:"whole number",re:/^(0|[1-9]\d{0,9})$/},

/* validateField() answers one question — may this exact string be used as this
   field type — and never repairs, trims, or transliterates the input. A value
   that is wrong is rejected with a reason a human can read, not silently
   cleaned up into something the user did not type. */
function validateField(type,raw,field){
  var def=FIELD_TYPES[type];
  if(!def) return {ok:false,reason:"unknown field type '"+String(type)+"'"};
  if(raw===null||raw===undefined) return {ok:false,reason:"no value"};
  if(typeof raw==="number") raw=String(raw);
  if(typeof raw!=="string") return {ok:false,reason:"value is not text"};
  if(raw==="") return {ok:false,reason:"no value"};
  if(raw.length>def.cap) return {ok:false,reason:"longer than the "+def.cap+"-character cap for a "+def.label};
  if(CTRL_RE.test(raw)) return {ok:false,reason:"contains a control character (NUL, newline, carriage return or tab)"};
  if(INVISIBLE_RE.test(raw)) return {ok:false,reason:"contains an invisible or bidirectional-override character"};
  if(!def.unicode && !ASCII_RE.test(raw)) return {ok:false,reason:"contains a non-ASCII character, which can be a look-alike for a shell metacharacter"};
  if(raw.charAt(0)==="-") return {ok:false,reason:"starts with a dash, which the target tool would read as an option"};
  if(def.enums && !inList(def.enums,raw)) return {ok:false,reason:"is not one of: "+def.enums.join(", ")};
  if(def.optionsFromField){
    var opts=(field&&field.options)||[];
    var hit=null;
    for(var i=0;i<opts.length;i++){
      var o=opts[i];
      var val=(typeof o==="string")?o:o.value;
      if(val===raw){ hit=o; break; }
    }
    if(hit===null) return {ok:false,reason:"is not one of the offered choices"};
    if(typeof hit!=="string" && hit.versions && field && field._version && !inList(hit.versions,field._version)){
      return {ok:false,reason:GATED_COPY+field._version};
    }
  }
  if(def.fn && !def.fn(raw)) return {ok:false,reason:"is not a valid "+def.label};
  if(def.re && !def.re.test(raw)) return {ok:false,reason:"is not a valid "+def.label};
  return {ok:true,value:raw};
}

function fieldFor(spec,name){
  var fields=(spec&&spec.fields)||[];
  for(var i=0;i<fields.length;i++){ if(fields[i].name===name) return fields[i]; }
  return null;
}
/* field name -> declared type, so a composer can refuse a slot by the SPEC's
   declaration rather than by what the value happens to look like (MCR-SEC-001). */
function fieldTypeMap(spec){
  var fields=(spec&&spec.fields)||[],out={};
  for(var i=0;i<fields.length;i++){ if(fields[i]&&fields[i].name) out[fields[i].name]=fields[i].type; }
  return out;
}
function fieldAvailable(field,version){
  return !field.versions || inList(field.versions,version);
}
/* Is this token's field going to contribute a value on this release? A token
   with no field and no `requires` (a plain lit, a rich rule) is always
   "present"; a field token is present only if the field exists, is available on
   this release, and validated into a resolved value. MCR-SEC-002 turns on this
   one answer.

   MCR-SEC-013: a token carrying `requires` is present only if the field it
   names is. For a lit that is the whole answer — the lit has no field of its
   own — and it is what lets the shift rule below ask the same question of a
   conditional literal that it asks of a field token. */
function tokenPresent(spec,version,resolved,tok){
  if(!tok) return true;
  if(tok.requires!==undefined && tok.requires!==null){
    var owner=fieldFor(spec,tok.requires);
    if(!owner) return false;
    if(!fieldAvailable(owner,version)) return false;
    if(!Object.prototype.hasOwnProperty.call(resolved,tok.requires)) return false;
  }
  if(tok.field===undefined||tok.field===null) return true;
  var field=fieldFor(spec,tok.field);
  if(!field) return false;
  if(!fieldAvailable(field,version)) return false;
  return Object.prototype.hasOwnProperty.call(resolved,tok.field);
}
/* A token that occupies an ARGUMENT slot: one whose disappearance promotes the
   next argument into its place. Flag tokens carry their own name, so they are
   position-independent and never positional.

   MCR-SEC-013. This used to be `tok.field && !tok.flag`, which made a `lit`
   never positional — and a lit made conditional with `requires` can vanish,
   so `[{lit:"chmod"},{lit:"0644",requires:"mode"},{field:"p"}]` assembled to
   `chmod '/etc/foo'` with the path sitting in the mode slot. An UNCONDITIONAL
   lit stays out of this set on purpose: it can never vanish, so it can never
   shift anything, and counting it would refuse templates that are correct. */
/* MCR-SEC-018 / MCR-SEC-022 (conditions E3 and E7). The rule above counted ANY
   conditional literal as an argument slot, which over-refused two real specs
   whose conditional literal is an OPTION — `setsebool -P` and `lvextend -r`.
   Dropping either shifts nothing: `setsebool boolean state` and
   `lvextend -L +10G /dev/vg0/lv0` are both correct. The dangerous part was the
   obvious workaround: an author clearing that build error by deleting
   `requires` makes `-P` unconditional, so every SELinux boolean change becomes
   PERSISTENT when the operator asked for runtime-only.

   The first answer here was a DECLARED discriminator — a `flag` key alongside
   `lit` saying "treat me as an option". Nothing checked that the declaration was
   true, so `{lit:"0644", flag:"-P", requires:"m"}` was accepted and reopened
   MCR-SEC-013 through the very key meant to close it. A rule that a sibling key
   silently disables is not a rule.

   This is the DERIVED discriminator, and it is derived from the word the token
   actually EMITS: a `lit` matching FLAG_TOKEN_RE is an option and never occupies
   an argument slot. `-P` and `-r` match; `0644` and `/etc/shadow` do not, and
   stay refused by construction. There is no second key to disagree with the
   first — assembleCommand() refuses a token carrying both `lit` and `flag`
   outright — so the smuggle cannot be expressed rather than being policed.

   A field token with a flag is still position-independent: it carries its own
   name, and the dual-key refusal means `tok.flag` here can only belong to a
   field or a rich rule. */
function isPositionalToken(tok){
  if(!tok || tok.flag) return false;
  if(tok.field!==undefined && tok.field!==null) return true;
  if(tok.lit===undefined || tok.lit===null) return false;
  if(FLAG_TOKEN_RE.test(String(tok.lit))) return false;    /* option-shaped lit: an OPTION */
  return tok.requires!==undefined && tok.requires!==null;
}
/* The shift rule, stated once. A positional token at index `at` is about to
   vanish: does any positional token AFTER it survive? If one does, argument n+1
   is promoted into slot n and the only honest answer is null. Both callers — the
   conditional lit (MCR-SEC-013) and the droppable field token (MCR-SEC-002) —
   ask this same question, because it is the same question. */
function laterPositionalSurvives(spec,version,resolved,at){
  for(var j=at+1;j<spec.template.length;j++){
    if(!isPositionalToken(spec.template[j])) continue;
    if(tokenPresent(spec,version,resolved,spec.template[j])) return true;
  }
  return false;
}

/* validateSpec() is the UI's window into the same decision assembleCommand()
   makes, so the form can say WHICH field is wrong without the assembler ever
   returning a partially built command to explain itself with. */
function validateSpec(spec,version,values){
  var out={ok:true,missing:[],invalid:[],gated:[],resolved:{}};
  var fields=(spec&&spec.fields)||[];
  values=values||{};
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    if(!fieldAvailable(f,version)){
      out.gated.push(f.name);
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;                                   /* gated out: cannot contribute */
    }
    var raw=values[f.name];
    var supplied=!(raw===null||raw===undefined||raw==="");
    if(!supplied){
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;
    }
    var probe=f;
    if(f.type==="enum"){ probe={name:f.name,type:f.type,options:f.options,_version:version}; }
    var r=validateField(f.type,raw,probe);
    if(!r.ok){
      out.ok=false;
      out.invalid.push({name:f.name,reason:r.reason});
      continue;                                   /* an invalid OPTIONAL value is still
                                                     a refusal: never silently dropped */
    }
    out.resolved[f.name]=r.value;
  }
  return out;
}

   assembled command in the gutter — so a newline in `intent` put a SECOND,
   unrendered line on the clipboard, which on the shipped reproduction was
   `rm -rf /var/log/audit`. The destructive-pattern table never saw it either,
   because blastFor() only ever looked at res.command.

        is silently deleted and nothing can end a line.

        There is no "# label: " + value concatenation anywhere.

    if(!tok) return null;
    if(tok.flag!==undefined && tok.flag!==null && !FLAG_TOKEN_RE.test(String(tok.flag))) return null;
    if(tok.lit!==undefined && tok.lit!==null){
      if(!LIT_TOKEN_RE.test(String(tok.lit))) return null;
      /* MCR-SEC-022 (E7). A lit token emits its `lit` and nothing else, so a
         `flag` beside it emits nothing — its only effect was to switch the D1
         positional rule off, unchecked, for whatever literal it was attached to.
         Whether a literal is an option is DERIVED from the literal (see
         isPositionalToken()), so the key is unnecessary for a real option and a
         bypass for anything else. Refused either way, including when it tells
         the truth: a rule with an off-switch is not a rule, and the shipped
         content carried two exemplars of the shape for the next author to copy.
         extract/schema.py refuses it at build time; this is the backstop. */
      if(tok.flag!==undefined && tok.flag!==null) return null;
      /* A literal may belong to a field — '--add-forward-port=...toaddr=' belongs
         to the toaddr value that follows it. requires: names that field, so the
         literal disappears WITH it and can never be left dangling. */
      if(tok.requires!==undefined && tok.requires!==null){
        var owner=fieldFor(spec,tok.requires);
        if(!owner) return null;                   /* lit binds to a field that does not exist */
        if(!tokenPresent(spec,version,v.resolved,tok)){
          /* MCR-SEC-013. `requires` is this literal's declaration that it may
             vanish — the lit's equivalent of optional:true. It is still an
             argument slot, so it may only vanish under the same rule a field
             token obeys: every later positional token has to vanish with it.
             The legal shape is the one MCR-SEC-002 shipped — the literal and
             the value after it gated on the SAME field, so they leave together
             and nothing is promoted. */
          if(isPositionalToken(tok) && laterPositionalSurvives(spec,version,v.resolved,i)) return null;
          continue;
        }
      }
      words.push(String(tok.lit));
      /* MCR-SEC-023. The lit branch used to push the word and return, so an
         option the command SHOWS — `sshd -T`, `setsebool -P`, `lvextend -r`,
         `journalctl --no-pager --boot` — was absent from the flag-by-flag panel
         entirely. A panel silent about a flag that is present is a smaller
         version of threat-model §4's Explainer row, a panel that describes one
         that is not. The same derived test decides it: an option-shaped literal
         is an option, so it belongs in the flag list, in command order. With no
         curated explain and no dictionary hit, `explain:null` renders
         "unverified — see man page" — the no-guess law, not a guess. */
      if(FLAG_TOKEN_RE.test(String(tok.lit))){
        flags.push({flag:String(tok.lit),explain:tok.explain||null});
      }
      continue;
    }
    if(tok.richRule){
      var composed=composeRichRule(v.resolved,tok.richRule,types);
      if(composed===null) return null;
      if(tok.flag){
        var rjoin=flagJoin(tok);                  /* MCR-SEC-015: one join rule, not two */
        if(rjoin===null) return null;
        words.push(String(tok.flag)+rjoin+shQuote(composed));
        flags.push({flag:String(tok.flag),explain:tok.explain||null});
      }else{
        words.push(shQuote(composed));
      }
      continue;
    }
    var field=fieldFor(spec,tok.field);
    if(!field) return null;                       /* template cites a field that does not exist */
    if(!tokenPresent(spec,version,v.resolved,tok)){
      /* MCR-SEC-002. This token is about to vanish — because the value was not
         supplied, or because the field is gated out of this release. Dropping a
         token is a decision about the TEMPLATE, not about one field, so it is
         only legal when the template declared it:

           - optional:true is mandatory. Without it the template is not complete
             on this release and the only honest answer is null. A shortened
             command with Copy enabled and no banner is worse than a blocked
             button (threat-model-v1 §3.4).
           - a POSITIONAL token may additionally only vanish if every later
             positional token vanishes too. Otherwise argument n+1 is promoted
             into slot n — `chown 'apache' '/var/www'` silently becoming
             `chown '/var/www'` — and the command still assembles.

         A version-gated field takes the same path as an unsupplied one: the same
         template must not be well-formed on RHEL 9 and mis-positioned on RHEL 8. */
      if(tok.optional!==true) return null;
      if(isPositionalToken(tok) && laterPositionalSurvives(spec,version,v.resolved,i)) return null;
      continue;
    }
    var q=shQuote(v.resolved[tok.field]);
    if(tok.flag){
      var join=flagJoin(tok);                     /* MCR-SEC-015: derived from the flag's shape */
      if(join===null) return null;                /* the token declares a join its shape derives */
      words.push(String(tok.flag)+join+q);
      flags.push({flag:String(tok.flag),explain:field.explain||null});
    }else{
      words.push(q);
    }
  }
  var command=words.join(" ");
  if(command==="") return null;
  /* MCR-SEC-010. A generator that declares a `doc` emits a FILE as well as a
     command, and the two stand or fall together: a spec with a doc that will
     not compose returns null rather than handing back the command line with the
     file silently missing. The operator would run `ansible-playbook site.yml`
     against whatever site.yml happened to be there. */
  var doc=null;
  if(spec.doc){
    doc=composeDoc(spec,version,v.resolved);
    if(doc===null) return null;
  }
  /* The destructive table sees the file too. blastFor() over the command alone
     would rate `ansible-playbook site.yml --check` on the command, while the
     playbook it runs is the thing that changes hosts -- the same gap
     MCR-SEC-003 found between the command line and the clipboard header. */
  var b=blastFor(command+(doc?"\n"+doc.text:""),spec.blast,patterns);
  /* A path used as an output operand is a write even when no shell redirect is
     present. Apply the same target rules as the pipeline composer: execution
     sinks are refused, protected system paths are red, and every other write
     remains at least yellow. */
  var specFields=spec.fields||[];
  for(i=0;i<specFields.length;i++){
    var writeField=specFields[i];
    if(!writeField||writeField.write_target!==true) continue;
    var writeValue=v.resolved[writeField.name];
    if(writeValue===undefined||writeValue===null) continue;
    var writePath=writeField.type==="path"?writeValue:
                  (writeField.type==="remote_path"?remoteWritePath(writeValue):null);
    if(writePath===null||isExecutionSink(writePath)) return null;
    var writeClass=redirectTargetBlast(writePath);
    var writeWhy="The command writes to "+writeValue+" ("+writeClass+" target class).";
    if(writeField.type==="remote_path"){
      var sourceValue=v.resolved.source,sourceBase="",candidateClass="unrated";
      /* A remote destination may already be a directory even without a final
         slash. Classify the possible destination/basename path as well as the
         literal operand. A directory rsync source writes a set of names whose
         final targets cannot be reviewed here, so it receives the red floor. */
      if(typeof sourceValue==="string"&&sourceValue!==""){
        var sourceParts=lexicalPath(sourceValue).split("/");
        sourceBase=sourceParts[sourceParts.length-1]||"";
        if(sourceBase!==""){
          var possiblePath=lexicalPath(writePath+"/"+sourceBase);
          if(isExecutionSink(possiblePath)) return null;
          candidateClass=redirectTargetBlast(possiblePath);
          if(PIPE_TARGET_RANK[candidateClass]>PIPE_TARGET_RANK[writeClass]) writeClass=candidateClass;
        }
      }
      if(spec.id==="rsync-sync-files"){
        writeClass="red";
        writeWhy="Rsync can treat the source as a directory even without a trailing slash, so the exact files written below "+writeValue+" cannot be classified in advance.";
      }else if((typeof sourceValue==="string"&&/\/$/.test(sourceValue))||/\/$/.test(writePath)){
        writeClass="red";
        writeWhy="The remote operand can name a directory, so the exact files written below "+writeValue+" cannot be classified in advance.";
      }else if(candidateClass==="red"){
        writeWhy="The remote destination may be a directory; joining it with source name "+sourceBase+" reaches a sensitive target.";
      }
    }
    var writeFloor=writeClass==="red"?"red":"yellow";
    if(BLAST_RANK[writeFloor]>BLAST_RANK[b.blast]) b.blast=writeFloor;
    b.reasons.push({id:"WRITE-TARGET",label:"File write target",
                    why:writeWhy,
                    floor:writeFloor});
  }
  return {id:spec.id,tool:spec.tool,command:command,flags:flags,blast:b.blast,
          blast_reasons:b.reasons,notes:spec.notes||null,resolved_from:null,version:version,
          doc:doc};
}

/* ---- the pipeline composer (CR-T-31) -------------------------------------
   Founder requirement, verbatim: "I need to be able to pipe commands
   together as well."

   THE DESIGN CONSTRAINT, and the reason this code is shaped the way it is:

     A PIPELINE IS STRUCTURE THE TOOL OWNS, NEVER A VALUE THE USER SUPPLIES.

   `|` is precisely the metacharacter the hostile harness rejects tens of
   thousands of times over -- 80,525 rejections in the single-command sweep on
   the day this was written, and the pipeline sweeps below add their own.
   The moment an operator can be TYPED, every allow-list in this block is
   void: a `comment` field carrying "| sh" would be perfectly shQuote'd, pass
   every containment check, and still be a pipe the instant the quoting is
   stripped by any future sink. So the user never supplies an operator. The user
   supplies a KEY, the key is looked up in a closed table, and the table's own
   string literal is what is emitted.

   What that makes UNEXPRESSIBLE (as opposed to merely policed):

     - There is no code path that copies operator text out of a stage. Every
       operator word in the output came from PIPE_OPERATORS, which is a literal
       in this file. A stage object has no field whose contents reach the
       command as an operator; `op` is consumed by hasOwnProperty lookup and
       then discarded.
     - A command stage must carry a TEMPLATE -- a token list this assembler
       emits word by word. A spec whose command is a STRING it was handed
       (`rhel_versions[v].command`, which is how every static entry and every
       mined REFERENCE record carries its command) cannot be a stage at all.
       Two things follow from one rule, which is why it is the rule:
         (a) PROVENANCE. ADR-002: joining two vendor strings produces a command
             the vendor never published while the citation still claims they
             did. That false attribution would travel into an accreditation
             package through Export command and control reference, which prints every stage's
             source. A mined record is structurally incapable of being a stage
             -- not filtered out of the picker, which a future picker could
             forget to do.
         (b) OPERATORS FROM DATA. A handed string is text this assembler did
             not compose, so it cannot know the string contains no `|`. DISA's
             own check text is full of them: 625 top-level pipes across the
             1,492 embedded rules. A mined record reaching a stage would carry
             an operator the user never composed, straight past the closed set.
             Requiring a template means every word of every stage came from a
             LIT_TOKEN_RE/FLAG_TOKEN_RE token or a shQuote'd validated value,
             and neither admits a shell metacharacter.
     - A redirect TARGET is a `path`-typed field run through validateField() and
       shQuote()d like every other value, so it is a quoted word and not a
       filename fragment concatenated into a redirection.
     - The xargs replace string is emitted by this function, never typed:
       `{}` is not admitted by ANY field type's allow-list or by LIT_TOKEN_RE,
       so it could not be authored even in curated content.

   What is merely POLICED, honestly labelled:

     - pipeOperator() re-checks the table's own `emit` against a closed list of
       the ten legal emissions. Today that check is unreachable, exactly like
       composeRichRule()'s character rule: the table is the control. It is what
       still holds if a future author adds a row saying {emit:"| sh"}.
     - stageCommandClean() re-checks that a stage's OWN assembled text carries
       no bare operator word and no unquoted shell metacharacter. Unreachable
       today for the same reason -- a template cannot emit one -- and it is the
       check that still holds if a future token type is added to the assembler
       without this file being read.
     - The shell-stage refusal and the blast composition rules below are
       policy over an assembled command's first bare word. A tool set that
       one day ships /bin/sh as an entry would be caught by the refusal, not
       made impossible by it.

   assemblePipeline() is PURE and lives inside MCR-ASSEMBLER on purpose: the
   hostile harness lifts this block verbatim and drives the pipeline oracle
   through it, so the pipe composer is proved by the same gate as the command
   assembler, on the shipped artifact.

   A PIPELINE OF ONE STAGE EQUALS assembleCommand() BYTE FOR BYTE. That is not
   a coincidence to be maintained: every command stage IS an assembleCommand()
   call, and a one-stage pipeline pushes exactly that string and joins nothing
   to it. The harness asserts it anyway, on every generator and every release,
   because "structurally guaranteed" is a claim and a gate is a proof. */

/* Eight is a shell command line an operator can still read on one screen and
   still reason about before running it as root. There is no technical limit
   being approximated here; it is a refusal to render something nobody reviews. */
var MAX_PIPELINE_STAGES=8;

/* The closed operator set. `emit` is the ONLY source of an operator word in an
   assembled pipeline. `takes` says what the stage carrying this operator may
   also carry, and is the whole of the stage-shape rule:
     "stage" - a command (or an xargs stage) follows
     "path"  - a validated absolute path follows, and nothing else
     "none"  - nothing follows; the operator is the entire stage */
var PIPE_OPERATORS={
  pipe:        {emit:"|",         takes:"stage",label:"pipe stdout into the next command"},
  and:         {emit:"&&",        takes:"stage",label:"run the next command only if this one succeeds"},
  or:          {emit:"||",        takes:"stage",label:"run the next command only if this one fails"},
  seq:         {emit:";",         takes:"stage",label:"run the next command either way"},
  redirect:    {emit:">",         takes:"path", label:"write stdout to a file, replacing it"},
  append:      {emit:">>",        takes:"path", label:"append stdout to a file"},
  redirect_err:{emit:"2>",        takes:"path", label:"write stderr to a file, replacing it"},
  err_to_out:  {emit:"2>&1",      takes:"none", label:"send stderr wherever stdout is going"},
  tee:         {emit:"| tee",     takes:"path", label:"write stdout to a file and keep it flowing"},
  tee_append:  {emit:"| tee -a",  takes:"path", label:"append stdout to a file and keep it flowing"}
};
/* The key order the UI offers, stated once so a <select> never has to iterate
   an object and inherit whatever the engine's key order happens to be. The
   harness asserts this list and the table's own keys are the same set: a key
   in one and not the other is either an operator nobody can pick or a picker
   for an operator that does not exist. */
var PIPE_OPERATOR_KEYS=["pipe","and","or","seq","redirect","append","redirect_err",
                        "err_to_out","tee","tee_append"];
/* Rule 2 (see the block comment): the emissions this product will ever write,
   as a closed list, re-checked at emit time. RICHRULE_VALUE_RE's sibling. */
var PIPE_OPERATOR_EMITS=["|","&&","||",";",">",">>","2>","2>&1","| tee","| tee -a"];

function pipeOperator(key){
  if(typeof key!=="string") return null;
  if(!Object.prototype.hasOwnProperty.call(PIPE_OPERATORS,key)) return null;  /* own keys only:
      "constructor", "toString" and "__proto__" are not operators */
  var op=PIPE_OPERATORS[key];
  if(!op||typeof op.emit!=="string") return null;
  if(!inList(PIPE_OPERATOR_EMITS,op.emit)) return null;   /* fail closed on a bad table row */
  if(!inList(["stage","path","none"],op.takes)) return null;
  return op;
}

/* The words of an assembled command, split the way a POSIX shell would, each
   carrying whether ANY part of it was single-quoted. Used for exactly two
   questions, both of which must be asked of BARE text only: "what binary does
   this stage invoke" and "does this stage emit NUL-delimited output". A value
   is always a quoted word, so neither question can ever be answered by one. */
function commandWords(s){
  var str=String(s),words=[],cur="",quoted=false,started=false,inQ=false,i=0;
  function flush(){ if(started) words.push({text:cur,quoted:quoted}); cur="";quoted=false;started=false; }
  while(i<str.length){
    var c=str.charAt(i);
    if(inQ){
      if(c==="'") inQ=false; else cur+=c;
      i++; started=true; continue;
    }
    if(c==="'"){ inQ=true; quoted=true; started=true; i++; continue; }
    /* shQuote()'s embedded-quote idiom is 'a'\''b': the backslash-escaped quote
       sits OUTSIDE the single quotes and is one escaped, inert character. It is
       protected text, not bare text, so it marks the word quoted -- exactly the
       rule tests/hostile_harness.js's own tokeniser applies. Reading it as bare
       would make every value containing an apostrophe unreadable. */
    if(c==="\\"&&i+1<str.length){ cur+=str.charAt(i+1); quoted=true; started=true; i+=2; continue; }
    if(c==="\\") return null;                     /* a trailing backslash is malformed */
    if(c===" "){ flush(); i++; continue; }
    cur+=c; i++; started=true;
  }
  if(inQ) return null;                          /* unbalanced quoting: unreadable, refuse */
  flush();
  return words;
}
/* The binary a command invokes, as a bare basename, or null if the command does
   not start with a bare word (which no assembleCommand() output ever does -- the
   first token of every template is a `lit`). */
function invokedBinary(command){
  var words=commandWords(command);
  if(words===null||!words.length) return null;
  if(words[0].quoted) return null;
  var base=words[0].text,cut=base.lastIndexOf("/");
  if(cut>=0) base=base.slice(cut+1);
  return base===""?null:base;
}

/* ---- rule 4, stated as a CLASS (threat model v2, condition PL2) ----------
   The class is "AN INTERPRETER IS THE FINAL CONSUMER", not "the command is
   spelled sh". A name list catches the obvious shape and misses two that matter
   just as much, so all three are named here and all three are REFUSED:

     (1) a stage whose binary reads a PROGRAM from standard input
         (`| sh`, `| bash`, `| python`, `| perl`, ...),
     (2) an xargs stage whose CHILD is one of those -- the interpreter is one
         level down and the pipe operator in front of it says `xargs`, which is
         why a name check on the stage's own binary misses it, and
     (3) an EXECUTION SINK reached by REDIRECT rather than by pipe: a write into
         a directory whose contents the system later executes is arbitrary
         execution with a delay on it. `> /etc/cron.d/x` and `| tee
         /etc/profile.d/x.sh` are `| sh` with a timer.

   REFUSED, not rated, and here is the choice stated plainly: the product's
   promise is that every command it emits can be explained flag by flag, rated,
   cited and undone. A command whose text will only exist at run time keeps none
   of those. A red banner over an unreviewable command is theatre -- it trains
   the operator to click through red -- so the composer will not build one.

   sed and awk are deliberately NOT interpreters for this purpose. They take
   their program as an ARGUMENT, which is a validated field like any other; they
   do not execute standard input. The line is "does stdin or a written file
   become code", not "is it powerful". */
var SHELL_TOOLS=["sh","bash","dash","zsh","ksh","ksh93","csh","tcsh","ash","busybox",
                 "python","python2","python3","perl","ruby","php","node","lua","tclsh",
                 "expect","source","eval"];

/* ---- TM2-F8: nested quoting domains --------------------------------------
   `su -c '...'`, `sh -c '...'`, `find ... -exec ... {} \;` and every wrapper
   that takes another command as its argument RE-PARSE that argument with their
   own rules. A value correctly single-quoted for the outer shell is then
   re-interpreted by an inner one, and shQuote() -- which is a POSIX SHELL
   quoter and nothing else -- is the wrong escaper for that second domain.

   This is exactly the shape the dead YAML quoter was deleted to stop
   pretending about (MCR-SEC-010): a second escaping domain with no sink, no
   oracle and a comment claiming it was safe. A second domain gets its own quoter AND its own
   parsing oracle in the same commit, or it does not exist.

   It does not exist in this tranche. Every wrapper below is REFUSED as a stage
   binary, and find's -exec family is refused as a bare token, so this composer
   cannot emit a stage whose argument a child re-parses. Refusing is the
   acceptable answer; a half-closed second domain is not.

   xargs is the one re-parser that is here on purpose, and the reason it is safe
   is worth writing down: xargs re-parses its INPUT STREAM, not its argv, and
   that stream is the producing stage's output -- filenames on a disk -- never a
   value from a form. Nothing this composer emits enters that domain. The `-0`
   rule below is what keeps the domain honest for the data that DOES enter it. */
var WRAPPER_TOOLS=["su","runuser","sudo","env","nohup","setsid","timeout","nice","ionice",
                   "chroot","stdbuf","systemd-run","watch","script","strace","ltrace",
                   "unshare","nsenter","flock","setpriv","doas","xargs"];
var EXEC_OPTION_TOKENS=["-exec","-execdir","-ok","-okdir"];

function isShellInvocation(tool,command){
  if(tool!==undefined&&tool!==null&&inList(SHELL_TOOLS,String(tool))) return true;
  var base=invokedBinary(command);
  if(base===null) return true;                  /* unreadable first word: refuse, never guess */
  return inList(SHELL_TOOLS,base);
}
/* TM2-F8's predicate: does this stage hand its argument to a child parser? */
function reparsesItsArgument(tool,command){
  if(tool!==undefined&&tool!==null&&inList(WRAPPER_TOOLS,String(tool))) return true;
  var base=invokedBinary(command);
  if(base===null) return true;
  if(inList(WRAPPER_TOOLS,base)) return true;
  var words=commandWords(command);
  if(words===null) return true;
  for(var i=1;i<words.length;i++){
    if(!words[i].quoted && inList(EXEC_OPTION_TOKENS,words[i].text)) return true;
  }
  return false;
}
/* One question for every stage, asked once, so rule 4 is a class and not a
   list: may this assembled command stand as a stage at all? */
function stageRefused(tool,command){
  if(isShellInvocation(tool,command)) return true;
  if(reparsesItsArgument(tool,command)) return true;
  return false;
}

/* ---- PIPE-001: the stage binary ALLOW-LIST (Marcus Reed, D4) --------------
   The two predicates above are DENY lists keyed on word one, and a deny list
   keyed on word one is a list wearing a class's clothes: `runcon <ctx> bash`,
   `setarch x86_64 bash`, `systemd-inhibit --no-pager bash` -- thirteen of the
   nineteen exec wrappers tried in review composed, because the wrapper is the
   word that gets checked and the shell is the word that runs. Worse, a stage
   binary was not required to be a DECLARED TOOL at all: a spec naming a binary
   that exists in no tool table composed today.

   Enumerating wrappers loses that race for ever; there is always one more
   binary that execs its argument. So this is closed the way MCR-SEC-001 closed
   the token grammar -- by ALLOW-LIST:

       A STAGE'S COMMAND MUST INVOKE THE BINARY THAT ITS DECLARED TOOL
       RESOLVES TO IN THE TOOL TABLE.

   What that makes UNEXPRESSIBLE, rather than merely caught: any stage whose
   first word is not a curated tool's binary. Every exec wrapper, every
   interpreter this product does not ship as a tool, every misspelling, and
   every future wrapper nobody has heard of yet -- all one refusal, none of them
   named anywhere. The deny lists above stay: they refuse `sh`, `env` and `sudo`
   even though those ARE declared tools, and one of them being reachable through
   a curated entry is exactly the case an allow-list alone would wave through.
   Two rules, both applied, neither standing in for the other.

   The tool table arrives through opts, the way the destructive-pattern table
   already does -- this block is PURE and reads no dataset (the harness lifts it
   verbatim and would either crash or test a stub otherwise). NO TABLE MEANS
   NOTHING COMPOSES. A composer that falls back to "allow" when the caller
   forgets to hand it the allow-list does not have one. */
function toolBinaryIndex(tools){
  if(!tools||typeof tools.length!=="number"||!tools.length) return null;
  var out={},i,rec,id,bin;
  for(i=0;i<tools.length;i++){
    rec=tools[i];
    if(!rec||typeof rec!=="object") continue;
    id=(rec.id===undefined||rec.id===null)?"":String(rec.id);
    bin=(rec.binary===undefined||rec.binary===null)?"":String(rec.binary);
    if(id===""||bin==="") continue;
    /* first row wins: a duplicate id cannot redefine a binary out from under a
       curated entry, and hasOwnProperty is why "constructor" is not a tool */
    if(!Object.prototype.hasOwnProperty.call(out,id)) out[id]=bin;
  }
  for(var k in out){ if(Object.prototype.hasOwnProperty.call(out,k)) return out; }
  return null;                                  /* a table of nothing usable is no table */
}
function stageBinaryDeclared(spec,command,index){
  if(index===null) return false;                /* fail closed: no table, no stage */
  var declared=(spec&&spec.explain_tool)||(spec&&spec.tool);
  if(declared===undefined||declared===null) return false;
  declared=String(declared);
  if(!Object.prototype.hasOwnProperty.call(index,declared)) return false;
  var base=invokedBinary(command);
  if(base===null) return false;                 /* unreadable first word: refuse, never guess */
  /* Both halves, and both matter. The id must be curated, AND the word that
     actually runs must be that id's binary -- otherwise the allow-list is a
     spelling check on a field nobody executes, and `tool:"grep"` with a
     template that emits `runcon bash` sails through it. */
  return base===index[declared];
}
var STAGE_BINARY_COPY="every stage runs a binary this build curates, and the first word of this "+
                      "one is not the binary its declared tool names";

/* Rule 2 for the stage text itself (see the block comment). Every word of an
   assembleCommand() output is a LIT_TOKEN_RE/FLAG_TOKEN_RE token or a
   shQuote'd value, so no bare operator and no unquoted metacharacter can occur

        flags.push({flag:child.flags[j].flag,explain:child.flags[j].explain||null,

     spans an operator ("rm -rf /" reached through `| xargs rm -rf '/etc/pki'`)
     still fires. blastFor() already matches both forms; what changes here is
     that it is handed the entire line. */
  /* PL3: the second, independent road to the same rule. Every redirect target

     redirectTargetBlast() again, whether or not it came through a validated
     `path` field. Raises only. */

  for(pi=0;pi<projected.length;pi++){

    for(si=0;si<stageRecords.length;si++){

                  why:"The composed command writes to "+projected[pi]+" ("+ptb+" target class).",

  for(i=0;i<stageRecords.length;i++){ if(stageRecords[i].op!==null) ops.push(stageRecords[i].op); }

          blast:b.blast,blast_reasons:mergeBlastReasons(reasons,b.reasons),notes:null,resolved_from:null,

/* ---- validatePipeline() -- condition PL6 ---------------------------------
