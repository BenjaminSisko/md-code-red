<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>__APP_NAME__ __VERSION__</title>
<style>
/* ---- theme tokens: UI spec v1 §6. Light on :root, dark re-declared twice so
       an explicit choice wins in both directions and prefers-color-scheme
       resolves the default at first paint with no flash of the wrong theme. -- */
:root{
  --bg-app:#fafafa; --bg-surface:#ffffff; --bg-editor:#f6f8fa; --bg-gutter:#eef1f6;
  --text-primary:#27272a; --text-secondary:#51607a; --text-muted:#8494ab;
  --accent:#b45309; --success:#059669; --warning:#b45309; --danger:#dc2626;
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.06);
  --badge-info:#3730a3; --border-primary:#d4d4d8; --focus-ring:#f59e0b;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail-w:48px; --sidebar-w:240px; --inspector-w:320px; --statusbar-h:28px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
    --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#71717a;
    --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
    --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
    --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
  }
}
:root[data-theme="dark"]{
  --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
  --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#71717a;
  --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
  --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg-app); color:var(--text-primary);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  display:grid; grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) var(--inspector-w);
  grid-template-rows:minmax(0,1fr) var(--statusbar-h);
  grid-template-areas:"rail sidebar editor inspector" "status status status status";
}
body[data-sidebar="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) var(--inspector-w);}
body[data-inspector="off"]{grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) 0;}
body[data-sidebar="off"][data-inspector="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) 0;}
body[data-sidebar="off"] #sidebar,body[data-inspector="off"] #inspector{display:none;}
@media (max-width:1024px){
  body{
    grid-template-columns:var(--rail-w) 200px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 220px var(--statusbar-h);
    grid-template-areas:"rail sidebar editor" "rail sidebar inspector" "status status status";
  }
}
/* Never outline:none without a replacement (UI spec §6) — :focus is the ESR
   fallback for engines that predate :focus-visible. */
:focus{outline:2px solid var(--focus-ring); outline-offset:1px;}
:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
#rail{grid-area:rail; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;}
#sidebar{grid-area:sidebar; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#editor{grid-area:editor; background:var(--bg-editor); overflow:auto; padding:14px 16px; min-width:0;}
#inspector{grid-area:inspector; background:var(--bg-surface); border-left:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#statusbar{grid-area:status; background:var(--bg-surface); border-top:1px solid var(--border-primary);
  display:flex; align-items:center; gap:10px; padding:0 10px; font-size:12px;
  color:var(--text-secondary); overflow:hidden; white-space:nowrap;}
#palette[hidden]{display:none;}
#palette{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
  align-items:flex-start; justify-content:center; padding-top:12vh; z-index:50;}
#palette>.panel{background:var(--bg-surface); border:1px solid var(--border-primary);
  border-radius:8px; width:min(640px,92vw); padding:12px;}
#palette input{width:100%; padding:7px 9px; font:inherit; color:var(--text-primary);
  background:var(--bg-editor); border:1px solid var(--border-primary); border-radius:5px;}
.region-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px;}
.railbtn{position:relative; width:34px; height:34px; border:1px solid transparent; border-radius:6px;
  background:transparent; color:var(--text-secondary); font-family:var(--font-mono);
  font-size:13px; cursor:pointer;}
.railbtn:hover{border-color:var(--border-primary); color:var(--text-primary);}
.railbtn[aria-current="true"]{border-color:var(--accent); color:var(--accent);}
/* icon-only rail, but the text label is never absent — it is revealed on focus
   and on hover so a keyboard user reads the same word a mouse user does. */
.railbtn .lbl{position:absolute; left:38px; top:4px; white-space:nowrap; z-index:60;
  background:var(--bg-surface); border:1px solid var(--border-primary); border-radius:4px;
  padding:2px 7px; font-family:var(--font-ui); font-size:12px; color:var(--text-primary);
  opacity:0; pointer-events:none;}
.railbtn:focus .lbl,.railbtn:hover .lbl{opacity:1;}
.seg{display:flex; gap:4px; margin:0 0 10px;}
.seg button{flex:1; padding:4px 0; border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; cursor:pointer;}
.seg button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600;}
.card{border:1px solid var(--border-primary); border-radius:8px; background:var(--bg-surface);
  padding:12px 14px; margin:0 0 12px;}
.card h2{margin:0 0 6px; font-size:15px;}
.muted{color:var(--text-muted);}
code,pre{font-family:var(--font-mono);}
.statusitem{display:inline-flex; align-items:center; gap:5px;}
.statusitem+.statusitem::before{content:"\00b7"; color:var(--text-muted); margin-right:5px;}
.themebtn{margin-left:auto; border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; font-size:12px;
  padding:1px 8px; cursor:pointer;}
.toast{color:var(--accent); font-weight:600;}
/* list rows — tools, entries, palette results. Arrow keys move between them. */
.list{list-style:none; margin:0 0 12px; padding:0;}
.list li{margin:0 0 2px;}
.row{display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:5px;
  background:transparent; color:var(--text-primary); font:inherit; padding:4px 7px; cursor:pointer;}
.row:hover{border-color:var(--border-primary);}
.row[aria-current="true"]{border-color:var(--accent); color:var(--accent);}
.row[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed; border-style:dashed;
  border-color:var(--border-primary);}
.row .why{display:block; font-size:11px; color:var(--text-muted);}
/* editor code block: gutter column + monospace lines */
.codeblock{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  overflow-x:auto; margin:0 0 12px;}
.codeline{display:flex; align-items:flex-start; font-family:var(--font-mono); font-size:13px;}
.codeline:focus{outline-offset:-2px;}
.codeline .ln{flex:0 0 42px; text-align:right; padding:2px 8px 2px 0; color:var(--text-muted);
  background:var(--bg-gutter); border-right:1px solid var(--border-primary);
  user-select:none; -webkit-user-select:none;}
.codeline .lc{padding:2px 10px; white-space:pre; color:var(--text-primary);}
.codeline[aria-current="true"] .lc{color:var(--accent);}
/* read-only preview of the clipboard payload — threat-model-v1 §9: what is in
   the preview is exactly and only what gets copied (MCR-SEC-003) */
.copypreview{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  color:var(--text-muted); font-family:var(--font-mono); font-size:12px; line-height:1.5;
  padding:8px 10px; margin:0 0 12px; overflow-x:auto; white-space:pre;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px;}
.btn{border:1px solid var(--border-primary); border-radius:5px; background:var(--bg-surface);
  color:var(--text-primary); font:inherit; font-size:13px; padding:4px 11px; cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn[disabled],.btn[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
/* red blast banner — role="alert", never colour alone, holds Copy until acked */
.blast{border:2px solid var(--danger); border-radius:6px; padding:10px 12px; margin:0 0 12px;
  background:var(--badge-critical-fill);}
.blast h2{color:var(--danger); font-size:14px; margin:0 0 4px;}
.blast label{display:block; margin-top:8px; font-size:13px;}
.badge{display:inline-block; border:1px solid var(--badge-info); border-radius:999px;
  padding:0 8px; font-size:11px; margin:0 5px 5px 0; color:var(--text-primary);}
.badge.cat1{border-color:var(--badge-critical); background:var(--badge-critical-fill); color:var(--danger);}
.badge.cat2{border-color:var(--danger); color:var(--danger);}
.badge.cat3{border-color:var(--warning); color:var(--warning);}
.flagrow{border-top:1px solid var(--border-primary); padding:6px 0;}
.flagrow .tok{font-family:var(--font-mono); font-size:12px; color:var(--accent);}
.flagrow .mean{display:block; font-size:12px; color:var(--text-secondary);}
.unverified{color:var(--text-muted); font-style:italic;}
/* generator guided-form fields (CR-T-17..25) — required/optional/version-gated
   states per UI spec v1 §4: required carries a coloured mark and "(required)"
   in the label text (never colour alone), a gated field is disabled with its
   reason in a .why line, exactly like a gated tool/entry row above. */
.field{display:flex; flex-direction:column; gap:3px; margin:0 0 10px;}
.field label{font-size:12px; color:var(--text-secondary);}
.field .req{color:var(--danger);}
.field input,.field select{font:inherit; font-size:13px; padding:4px 7px;
  border:1px solid var(--border-primary); border-radius:5px;
  background:var(--bg-app); color:var(--text-primary);}
.field input[disabled],.field select[disabled]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
.field .why{margin:0; font-size:11px; color:var(--text-muted);}
@media print{
  body{display:block;}
  #rail,#sidebar,#inspector,#statusbar,#palette{display:none;}
  #editor{background:none; color:#000;}
  .codeline .ln{background:none;}
}
</style>

  <div class="panel">

           aria-controls="palette-results" aria-describedby="palette-help"

    <div id="palette-results"></div>
  </div>
</div>

"use strict";

/* ============ old-browser polyfills (ESR-era Firefox on air-gapped boxes) ============ */

var APP_NAME="__APP_NAME__";
var APP_VERSION="__VERSION__";
var APP_BUILD_DATE="__BUILT_DATE__";
var APP_CLASSIFICATION="__CLASSIFICATION__";
var RHEL_VERSIONS=["7","8","9","10"];
/* The no-guess law: a flag with no curated explanation says so, it never invents one. */

/* ============ escaping — every value that reaches innerHTML goes through one ============ */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function escapeAttr(s){
  /* attribute context: same entity set, plus backtick and equals, which some
     legacy engines treat as attribute delimiters in unquoted contexts. */
  return esc(s).replace(/`/g,"&#96;").replace(/=/g,"&#61;");
}
function escapeRegex(s){
  return String(s==null?"":s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}
function el(id){return document.getElementById(id);}

/* ============ storage guard — schema-versioned, try/catch on every access ============ */
/* Every storage identifier below sits inside its own try/catch, on purpose: the
   guard has to survive a mechanical audit (Q7), so no helper is allowed to
   receive a storage object as an argument and hide the access behind a name. */
var STORE=(function(){
  var NS="mdcr.v1.";
  var SCHEMA=1;
  function unwrap(raw,fb){
    if(!raw) return fb;
    var rec=null;
    try{ rec=JSON.parse(raw); }catch(e){ return fb; }
    if(!rec||rec.schema!==SCHEMA) return fb;     /* unknown schema: discard silently */
    return rec.data;
  }
  function wrap(value){ return JSON.stringify({schema:SCHEMA,data:value}); }
  return {
    ns:NS, schema:SCHEMA,
    get:function(k,fb){
      try{ return unwrap(localStorage.getItem(NS+k),fb); }catch(e){ return fb; }
    },
    set:function(k,v){
      try{ localStorage.setItem(NS+k,wrap(v)); return true; }catch(e){ return false; }
    },
    getSession:function(k,fb){
      try{ return unwrap(sessionStorage.getItem(NS+k),fb); }catch(e){ return fb; }
    },
    setSession:function(k,v){
      try{ sessionStorage.setItem(NS+k,wrap(v)); return true; }catch(e){ return false; }
    }
  };                                              /* file:// storage may be blocked */
})();

/* ===== MCR-ASSEMBLER-BEGIN =================================================
   CR-T-15, the command assembler. Everything between this marker and
   MCR-ASSEMBLER-END is PURE: no document, no window, no storage, no data
   island, no clock. tests/hostile_harness.js lifts this block verbatim out of
   template.html (and qa.py Q18 lifts it out of the SHIPPED artifact) and runs
   it under Node against tests/fixtures/hostile-inputs.json, so the code proved
   safe by CI is the same code the jump box runs. Adding a DOM or DATA
   reference in here silently turns that gate into a test of nothing.

   Escaping domains are never interchanged (threat-model-v1 §3.2):
   esc()/escapeAttr() render to the DOM, shQuote() quotes for a POSIX shell.
   qa.py Q18 fails the build if one is ever nested inside another.

   There is deliberately NO YAML quoter here yet. One existed, was correct, and
   had no call site at all — assembleCommand() has no YAML output path, so Q18's
   quoting-domain gate was passing on a domain that did not exist and the
   harness's YAML invariant only asserted the function's behaviour to itself
   (MCR-SEC-010). A dead escaper reads as "Ansible YAML output is proven safe",
   which was not true and would have been inherited by the CR-T-25 review as a
   false clean bill. It is removed; the quoting-domain check is SHELL-ONLY until
   the Ansible generator lands. When the first YAML sink arrives (CR-T-17+), the
   quoter and a YAML-parsing oracle in tests/hostile_harness.js ship in the SAME
   commit — the harness refuses to run if a YAML quoter reappears without one.

/* The version-gating sentence lives inside the block so the block is entirely
   self-contained: the harness runs it with no other scope in sight. */
var GATED_COPY="Not available in RHEL ";

/* POSIX single-quote quoting, applied UNIFORMLY to every user-supplied value.
   There is deliberately no "this value looks harmless, leave it bare" branch:
   per-field author discretion is exactly the hole threat-model-v1 §3.2 closes.
   The cosmetic cost is --zone='public' instead of --zone=public. */

  return "'"+String(s).replace(/'/g,"'\\''")+"'";

/* Characters that never belong in ANY field, checked before the per-type
   allow-list so the rejection reason names the real problem. */

/* MCR-SEC-009. U+2028 LINE SEPARATOR, U+2029 PARAGRAPH SEPARATOR and U+2065 —
   the one unassigned code point inside the invisible-format block — were the
   gap. They are inert inside a POSIX single-quoted token, but .codeline .lc
   renders white-space:pre, so a rendered command could show a line break the
   copied one-line string does not have: render/copy divergence in the same
   family as MCR-SEC-003. The 2060-206F range is now closed end to end rather
   than in two pieces with 2065 sitting between them. */

var ASCII_RE=/^[\x20-\x7E]+$/;

function inList(arr,v){
  if(!arr) return false;
  for(var i=0;i<arr.length;i++){ if(arr[i]===v) return true; }
  return false;

function isIpv4(s){
  return /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(s);
}
function isIpv6(s){
  if(s.length>45 || !/^[0-9A-Fa-f:.]+$/.test(s)) return false;
  var halves=s.split("::");
  if(halves.length>2) return false;
  var compressed=halves.length===2;
  var groups=[],i;
  for(i=0;i<halves.length;i++){
    if(halves[i]==="") continue;
    var parts=halves[i].split(":");
    for(var j=0;j<parts.length;j++){
      if(parts[j]==="") return false;
      groups.push(parts[j]);
    }
  }
  var count=0;
  for(i=0;i<groups.length;i++){
    var g=groups[i];
    if(g.indexOf(".")>=0){
      if(i!==groups.length-1 || !isIpv4(g)) return false;
      count+=2;
    }else{
      if(!/^[0-9A-Fa-f]{1,4}$/.test(g)) return false;
      count+=1;
    }
  }
  return compressed?(count<8):(count===8);

function isIpAddr(s){ return isIpv4(s)||isIpv6(s); }
function isCidr(s){
  var at=s.indexOf("/");
  if(at<0) return isIpAddr(s);
  var addr=s.slice(0,at), pfx=s.slice(at+1);
  if(!/^(0|[1-9]\d{0,2})$/.test(pfx)) return false;
  var n=parseInt(pfx,10);
  if(isIpv4(addr)) return n<=32;
  if(isIpv6(addr)) return n<=128;
  return false;
}
function isPort(s){
  if(!/^[1-9]\d{0,4}$/.test(s)) return false;
  var n=parseInt(s,10);
  return n>=1 && n<=65535;
}
function isPortRange(s){
  var at=s.indexOf("-");
  if(at<0) return isPort(s);
  var lo=s.slice(0,at), hi=s.slice(at+1);
  if(!isPort(lo)||!isPort(hi)) return false;
  return parseInt(lo,10)<=parseInt(hi,10);
}
function isPath(s){
  if(s.charAt(0)!=="/") return false;                 /* absolute only */
  if(!/^[A-Za-z0-9_./-]+$/.test(s)) return false;     /* closed character set */
  if(s.indexOf("//")>=0) return false;
  var segs=s.split("/");
  for(var i=0;i<segs.length;i++){ if(segs[i]==="..") return false; }  /* no traversal */
  return true;
}

/* The field TYPE system (threat-model-v1 §3.1). Allow-list, full match, capped.
   'comment' is the ONLY free-text type in the product, it is the only type that
   accepts non-ASCII text, and it is still shQuote()d before it can reach a
   shell. Everything else is a closed grammar or an enum. */
var FIELD_TYPES={
  hostname:{cap:253,label:"hostname (RFC 1123)",re:/^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$/},
  ipv4:{cap:15,label:"IPv4 address",fn:isIpv4},
  ipv6:{cap:45,label:"IPv6 address",fn:isIpv6},
  ipaddr:{cap:45,label:"IP address",fn:isIpAddr},
  cidr:{cap:49,label:"IP address or CIDR block",fn:isCidr},
  port:{cap:5,label:"port number 1-65535",fn:isPort},
  portrange:{cap:11,label:"port or port range",fn:isPortRange},
  protocol:{cap:4,label:"protocol",enums:["tcp","udp","sctp","dccp"]},
  family:{cap:4,label:"address family",enums:["ipv4","ipv6"]},
  action:{cap:6,label:"rich-rule action",enums:["accept","reject","drop"]},
  /* No backslash in the class: systemd's own \x2d device escapes are legal unit
     syntax but nothing in this product's P0 tool set needs them, and a backslash
     is the one character that changes meaning between the shell, YAML, and a
     unit name. The hostile-input harness caught it here; keep it out. */
  unit:{cap:200,label:"systemd unit name",re:/^[A-Za-z0-9_.@:-]+(\.(service|socket|timer|target|mount|automount|path|slice|scope|swap|device))?$/},
  username:{cap:32,label:"POSIX user name",re:/^[a-z_][a-z0-9_-]{0,31}$/},
  groupname:{cap:32,label:"POSIX group name",re:/^[a-z_][a-z0-9_-]{0,31}$/},
  path:{cap:255,label:"absolute path",fn:isPath},
  zone:{cap:17,label:"firewalld zone",re:/^[A-Za-z0-9_-]{1,17}$/},
  service:{cap:64,label:"firewalld service name",re:/^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/},
  package:{cap:128,label:"package name",re:/^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$/},
  selinux_boolean:{cap:64,label:"SELinux boolean",re:/^[a-z][a-z0-9_]{0,63}$/},
  audit_key:{cap:31,label:"audit rule key",re:/^[A-Za-z0-9_-]{1,31}$/},
  interface:{cap:15,label:"network interface",re:/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,14}$/},
  integer:{cap:10,label:"whole number",re:/^(0|[1-9]\d{0,9})$/},
  /* MCR-SEC-016 (condition E4). Both of these were typed `comment` — the one
     free-text type — and both have a well-known closed grammar, which
     threat-model §3.1 requires wherever one exists. Nothing was injectable:
     every value is shQuote'd and every wrong one fails closed at the tool. The
     residual was a wrong-but-valid value reaching Copy on a yellow-blast
     storage command — `lvextend -L 'ticket RFC-1234'` assembled.

     The LVM label is doing real work. `10G` and `+10G` are both valid and mean
     different things — SET the volume to 10G, versus GROW it by 10G — and the
     placeholder is the only place in the UI that says so, because the field,
     the flag and the blast rating are identical either way. */
  lvm_size:{cap:16,label:"LVM size — 10G sets, +10G grows, 100%FREE fills",
            re:/^([+-]?\d+(\.\d+)?[bBsSkKmMgGtTpPeE]?|\d+%(FREE|VG|PVS|ORIGIN))$/},
  group_list:{cap:256,label:"group, or comma-separated group list",
              re:/^[a-z_][a-z0-9_-]{0,31}(,[a-z_][a-z0-9_-]{0,31})*$/},
  enum:{cap:64,label:"choice",optionsFromField:true},
  comment:{cap:200,label:"free-text comment",unicode:true,re:/^[^\u0000-\u001F\u007F]+$/}
};

/* validateField() answers one question — may this exact string be used as this
   field type — and never repairs, trims, or transliterates the input. A value
   that is wrong is rejected with a reason a human can read, not silently
   cleaned up into something the user did not type. */
function validateField(type,raw,field){
  var def=FIELD_TYPES[type];
  if(!def) return {ok:false,reason:"unknown field type '"+String(type)+"'"};
  if(raw===null||raw===undefined) return {ok:false,reason:"no value"};
  if(typeof raw==="number") raw=String(raw);
  if(typeof raw!=="string") return {ok:false,reason:"value is not text"};
  if(raw==="") return {ok:false,reason:"no value"};
  if(raw.length>def.cap) return {ok:false,reason:"longer than the "+def.cap+"-character cap for a "+def.label};
  if(CTRL_RE.test(raw)) return {ok:false,reason:"contains a control character (NUL, newline, carriage return or tab)"};
  if(INVISIBLE_RE.test(raw)) return {ok:false,reason:"contains an invisible or bidirectional-override character"};
  if(!def.unicode && !ASCII_RE.test(raw)) return {ok:false,reason:"contains a non-ASCII character, which can be a look-alike for a shell metacharacter"};
  if(raw.charAt(0)==="-") return {ok:false,reason:"starts with a dash, which the target tool would read as an option"};
  if(def.enums && !inList(def.enums,raw)) return {ok:false,reason:"is not one of: "+def.enums.join(", ")};
  if(def.optionsFromField){
    var opts=(field&&field.options)||[];
    var hit=null;
    for(var i=0;i<opts.length;i++){
      var o=opts[i];
      var val=(typeof o==="string")?o:o.value;
      if(val===raw){ hit=o; break; }
    }
    if(hit===null) return {ok:false,reason:"is not one of the offered choices"};
    if(typeof hit!=="string" && hit.versions && field && field._version && !inList(hit.versions,field._version)){
      return {ok:false,reason:GATED_COPY+field._version};
    }
  }
  if(def.fn && !def.fn(raw)) return {ok:false,reason:"is not a valid "+def.label};
  if(def.re && !def.re.test(raw)) return {ok:false,reason:"is not a valid "+def.label};
  return {ok:true,value:raw};
}

function fieldFor(spec,name){
  var fields=(spec&&spec.fields)||[];
  for(var i=0;i<fields.length;i++){ if(fields[i].name===name) return fields[i]; }
  return null;
}
/* field name -> declared type, so a composer can refuse a slot by the SPEC's
   declaration rather than by what the value happens to look like (MCR-SEC-001). */
function fieldTypeMap(spec){
  var fields=(spec&&spec.fields)||[],out={};
  for(var i=0;i<fields.length;i++){ if(fields[i]&&fields[i].name) out[fields[i].name]=fields[i].type; }
  return out;
}
function fieldAvailable(field,version){
  return !field.versions || inList(field.versions,version);
}
/* Is this token's field going to contribute a value on this release? A token
   with no field and no `requires` (a plain lit, a rich rule) is always
   "present"; a field token is present only if the field exists, is available on
   this release, and validated into a resolved value. MCR-SEC-002 turns on this
   one answer.

   MCR-SEC-013: a token carrying `requires` is present only if the field it
   names is. For a lit that is the whole answer — the lit has no field of its
   own — and it is what lets the shift rule below ask the same question of a
   conditional literal that it asks of a field token. */
function tokenPresent(spec,version,resolved,tok){
  if(!tok) return true;
  if(tok.requires!==undefined && tok.requires!==null){
    var owner=fieldFor(spec,tok.requires);
    if(!owner) return false;
    if(!fieldAvailable(owner,version)) return false;
    if(!Object.prototype.hasOwnProperty.call(resolved,tok.requires)) return false;
  }
  if(tok.field===undefined||tok.field===null) return true;
  var field=fieldFor(spec,tok.field);
  if(!field) return false;
  if(!fieldAvailable(field,version)) return false;
  return Object.prototype.hasOwnProperty.call(resolved,tok.field);
}
/* A token that occupies an ARGUMENT slot: one whose disappearance promotes the
   next argument into its place. Flag tokens carry their own name, so they are
   position-independent and never positional.

   MCR-SEC-013. This used to be `tok.field && !tok.flag`, which made a `lit`
   never positional — and a lit made conditional with `requires` can vanish,
   so `[{lit:"chmod"},{lit:"0644",requires:"mode"},{field:"p"}]` assembled to
   `chmod '/etc/foo'` with the path sitting in the mode slot. An UNCONDITIONAL
   lit stays out of this set on purpose: it can never vanish, so it can never
   shift anything, and counting it would refuse templates that are correct. */
/* MCR-SEC-018 / MCR-SEC-022 (conditions E3 and E7). The rule above counted ANY
   conditional literal as an argument slot, which over-refused two real specs
   whose conditional literal is an OPTION — `setsebool -P` and `lvextend -r`.
   Dropping either shifts nothing: `setsebool boolean state` and
   `lvextend -L +10G /dev/vg0/lv0` are both correct. The dangerous part was the
   obvious workaround: an author clearing that build error by deleting
   `requires` makes `-P` unconditional, so every SELinux boolean change becomes
   PERSISTENT when the operator asked for runtime-only.

   The first answer here was a DECLARED discriminator — a `flag` key alongside
   `lit` saying "treat me as an option". Nothing checked that the declaration was
   true, so `{lit:"0644", flag:"-P", requires:"m"}` was accepted and reopened
   MCR-SEC-013 through the very key meant to close it. A rule that a sibling key
   silently disables is not a rule.

   This is the DERIVED discriminator, and it is derived from the word the token
   actually EMITS: a `lit` matching FLAG_TOKEN_RE is an option and never occupies
   an argument slot. `-P` and `-r` match; `0644` and `/etc/shadow` do not, and
   stay refused by construction. There is no second key to disagree with the
   first — assembleCommand() refuses a token carrying both `lit` and `flag`
   outright — so the smuggle cannot be expressed rather than being policed.

   A field token with a flag is still position-independent: it carries its own
   name, and the dual-key refusal means `tok.flag` here can only belong to a
   field or a rich rule. */
function isPositionalToken(tok){
  if(!tok || tok.flag) return false;
  if(tok.field!==undefined && tok.field!==null) return true;
  if(tok.lit===undefined || tok.lit===null) return false;
  if(FLAG_TOKEN_RE.test(String(tok.lit))) return false;    /* option-shaped lit: an OPTION */
  return tok.requires!==undefined && tok.requires!==null;
}
/* The shift rule, stated once. A positional token at index `at` is about to
   vanish: does any positional token AFTER it survive? If one does, argument n+1
   is promoted into slot n and the only honest answer is null. Both callers — the
   conditional lit (MCR-SEC-013) and the droppable field token (MCR-SEC-002) —
   ask this same question, because it is the same question. */
function laterPositionalSurvives(spec,version,resolved,at){
  for(var j=at+1;j<spec.template.length;j++){
    if(!isPositionalToken(spec.template[j])) continue;
    if(tokenPresent(spec,version,resolved,spec.template[j])) return true;
  }
  return false;
}

/* validateSpec() is the UI's window into the same decision assembleCommand()
   makes, so the form can say WHICH field is wrong without the assembler ever
   returning a partially built command to explain itself with. */
function validateSpec(spec,version,values){
  var out={ok:true,missing:[],invalid:[],gated:[],resolved:{}};
  var fields=(spec&&spec.fields)||[];
  values=values||{};
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    if(!fieldAvailable(f,version)){
      out.gated.push(f.name);
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;                                   /* gated out: cannot contribute */
    }
    var raw=values[f.name];
    var supplied=!(raw===null||raw===undefined||raw==="");
    if(!supplied){
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;
    }
    var probe=f;
    if(f.type==="enum"){ probe={name:f.name,type:f.type,options:f.options,_version:version}; }
    var r=validateField(f.type,raw,probe);
    if(!r.ok){
      out.ok=false;
      out.invalid.push({name:f.name,reason:r.reason});
      continue;                                   /* an invalid OPTIONAL value is still
                                                     a refusal: never silently dropped */
    }
    out.resolved[f.name]=r.value;
  }
  return out;
}

/* firewalld rich rules are composed from independently validated sub-fields and
   trusted literal syntax — never by concatenating one free-text box into the
   command line (threat-model-v1 §3.1, highest-risk field class).

   MCR-SEC-001. The comment that used to stand here argued that no validated
   value can contain a double quote "because no field type's allow-list admits
   one". That was FALSE and a future author would have relied on it: `comment`
   admits every printable character and `enum` admits whatever a content author
   lists, so a value could close an attribute and open new rich-rule elements —
   a firewall-policy bypass (the installed rule's ACTION differs from the one on
   screen) that shell quoting cannot see, because the injected text never leaves
   its single-quoted shell token. Two rules replace that claim:

   1. STRUCTURAL — a rich-rule slot may only be filled by a field whose type is
      listed for that slot in RICHRULE_SLOT_TYPES, and every one of those is a
      closed grammar. `comment` and `enum` are deliberately NOT rich-rule
      sub-field types. Rich-rule attribute syntax has no escape sequence for a
      double quote inside an attribute value, so there is no encoding that makes
      free text safe there; the honest answer is no free-text path into a rich
      rule at all, rather than a fourth escaping domain that cannot be written
      correctly.
   2. CHARACTER — every mapped value is re-checked here, at composition time,
      against a closed value set, and the whole rule is refused (null) if any
      value carries a quote, a backslash, whitespace, or anything else that could
      open a new element. Rule 1 already makes rule 2 unreachable today; rule 2
      is what still holds if a future type is added to rule 1's table in error. */
var RICHRULE_SLOT_TYPES={
  family:["family"],
  source:["cidr","ipaddr","ipv4","ipv6"],
  destination:["cidr","ipaddr","ipv4","ipv6"],
  service:["service"],
  port:["port","portrange"],
  protocol:["protocol"],
  action:["action"]
};
var RICHRULE_SLOTS=["family","source","destination","service","port","protocol","action"];
/* No quote, no backslash, no whitespace, no '=', no '<' or '>': nothing that can
   terminate an attribute value or begin another rich-rule element. */
var RICHRULE_VALUE_RE=/^[A-Za-z0-9_.:\/-]+$/;

function richRuleSlotOk(slot,type){
  return inList(RICHRULE_SLOT_TYPES[slot]||null,type);
}

/* composeRichRule(resolvedValues, plan, fieldTypes) -> string | null
   `fieldTypes` maps field name -> declared type, so the structural rule above can
   be enforced on the SPEC, not merely on the value that happened to be typed. */
function composeRichRule(map,plan,types){
  if(!plan||!types) return null;
  var k,i;
  for(k in plan){
    if(!Object.prototype.hasOwnProperty.call(plan,k)) continue;
    if(!inList(RICHRULE_SLOTS,k)) return null;             /* unknown rich-rule slot */
    if(!richRuleSlotOk(k,types[plan[k]])) return null;     /* type not allowed in this slot */
  }
  for(i=0;i<RICHRULE_SLOTS.length;i++){
    var nm=plan[RICHRULE_SLOTS[i]];
    if(!nm) continue;
    var val=map[nm];
    if(val===undefined||val===null) continue;
    if(typeof val!=="string"||!RICHRULE_VALUE_RE.test(val)) return null;   /* fail closed */
  }
  var family=map[plan.family];
  if(!family) return null;
  var out='rule family="'+family+'"';
  if(plan.source && map[plan.source]) out+=' source address="'+map[plan.source]+'"';
  if(plan.destination && map[plan.destination]) out+=' destination address="'+map[plan.destination]+'"';
  if(plan.service && map[plan.service]) out+=' service name="'+map[plan.service]+'"';
  if(plan.port && map[plan.port]){
    if(!plan.protocol || !map[plan.protocol]) return null;   /* a port with no protocol is half-formed */
    out+=' port port="'+map[plan.port]+'" protocol="'+map[plan.protocol]+'"';
  }
  var action=plan.action?map[plan.action]:null;
  if(!action) return null;
  return out+" "+action;
}

/* ---- the clipboard payload (MCR-SEC-003) ---------------------------------
   "Copy with comment" used to build its header as "# label: " + raw content
   text. None of that header is rendered anywhere — the operator sees only the
   assembled command in the gutter — so a newline in `intent` put a SECOND,
   unrendered line on the clipboard, which on the shipped reproduction was
   `rm -rf /var/log/audit`. The destructive-pattern table never saw it either,
   because blastFor() only ever looked at res.command.

   Three rules, here in the pure assembler block so the harness can prove them:
     1. headerSafe() renders every interpolated value to single-line printable
        text. Control characters, NUL and U+2028/U+2029 become spaces; nothing
        is silently deleted and nothing can end a line.
     2. commentPayload() splits every line it is handed on CR/LF/CRLF anyway —
        belt to rule 1's braces — and prefixes EVERY resulting line with "# ".
        There is no "# label: " + value concatenation anywhere.
     3. The command is the only line in the payload that is not "# "-prefixed,
        and a command that is not single-line printable text refuses to compose
        a payload at all (null), rather than contributing an unprefixed line.
   The caller then runs blastFor() over the whole payload, header included. */
var HEADER_UNSAFE_G=/[\u0000-\u001F\u007F-\u009F\u2028\u2029]/g;
var HEADER_UNSAFE_RE=/[\u0000-\u001F\u007F-\u009F\u2028\u2029]/;
function headerSafe(s){
  return String(s).replace(HEADER_UNSAFE_G," ").replace(/ {2,}/g," ").replace(/^ +| +$/g,"");
}
function commentPayload(lines,command){
  var cmd=String(command);
  if(cmd===""||HEADER_UNSAFE_RE.test(cmd)) return null;
  var out=[],i,j;
  lines=lines||[];
  for(i=0;i<lines.length;i++){
    var parts=String(lines[i]).split(/\r\n|\r|\n/);
    for(j=0;j<parts.length;j++){
      var text=headerSafe(parts[j]);
      if(text==="") continue;
      out.push("# "+text);
    }
  }
  out.push(cmd);
  return out.join("\n");
}

var BLAST_RANK={green:0,yellow:1,red:2};

/* The semantic form of an assembled command: the same string with the quoting
   shQuote() added taken back off, token boundaries intact.

   MCR-SEC-008. The destructive-pattern table is matched against the fully
   assembled, post-quoting command (threat-model-v1 §3.3) — correct, and it
   interacts badly with uniform quoting: shQuote() inserts a ' at every
   literal->value boundary, so a pattern that spans one can never match.
   `rm -rf /` against `rm -rf '/etc/pki'` is the case, and the table is data
   precisely so a content reviewer can add exactly that row. Patterns are now
   matched against BOTH forms; a row that matched before still matches. */
function unquoteCommand(s){
  var out="",inQ=false,i=0,str=String(s);
  while(i<str.length){
    var c=str.charAt(i);
    if(inQ){
      if(c==="'") inQ=false; else out+=c;
      i++; continue;
    }
    if(c==="'"){ inQ=true; i++; continue; }
    if(c==="\\" && i+1<str.length){ out+=str.charAt(i+1); i+=2; continue; }
    out+=c; i++;
  }
  return out;
}

/* The destructive-pattern table is matched against the FULLY ASSEMBLED,
   post-quoting command AND its unquoted projection, and a content entry's own
   blast:"red" trips the banner independently — two ways in, in case the pattern
   table has a gap (threat-model-v1 §3.3). */
function blastFor(command,base,patterns){
  var blast=(base in BLAST_RANK)?base:"green";
  var rank=BLAST_RANK[blast], reasons=[];
  var hay=String(command).toLowerCase();
  var bare=unquoteCommand(command).toLowerCase();
  patterns=patterns||[];
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i];
    if(!p||!p.match) continue;
    var needle=String(p.match).toLowerCase();
    if(hay.indexOf(needle)<0 && bare.indexOf(needle)<0) continue;
    reasons.push({id:p.id,label:p.label,why:p.why,floor:p.blast_floor});
    var r=BLAST_RANK[p.blast_floor];
    if(r>rank){ rank=r; blast=p.blast_floor; }
  }
  return {blast:blast,reasons:reasons};
}

function assembleEntry(entry,version,patterns){
  var slot=entry.rhel_versions?entry.rhel_versions[version]:null;
  if(!slot||slot.unavailable) return null;
  var cmd=slot.command;
  if(typeof cmd!=="string"||cmd==="") return null;
  var flags=[],src=entry.flags||[];
  for(var i=0;i<src.length;i++){
    flags.push({flag:src[i].flag,explain:(src[i].explain===undefined?null:src[i].explain)});
  }
  var b=blastFor(cmd,entry.blast,patterns);
  return {id:entry.id,tool:entry.tool,command:cmd,flags:flags,blast:b.blast,
          blast_reasons:b.reasons,notes:slot.notes||null,
          resolved_from:slot.resolved_from||null,version:version};
}

/* MCR-SEC-006. `template[].flag` and `template[].lit` are emitted UNQUOTED —
   that is the design, they are curated content, not user input — but "trusted"
   and "unchecked" are not the same word. A template is content, content is a
   file, and a file can be wrong: `{flag:"--zone; rm -rf /etc; #"}` assembled
   into a working command line with nothing to stop it at build time or at run
   time. These two allow-lists are the run-time half (extract/schema.py's
   spec_errors() is the build-time half), and they admit no whitespace, no
   quote, and no shell metacharacter. A token that does not match makes the
   whole template null — never "emit the parts that are fine". */
var FLAG_TOKEN_RE=/^-{1,2}[A-Za-z0-9][A-Za-z0-9-]*$/;
var LIT_TOKEN_RE=/^[A-Za-z0-9_.\/=:,+-]+$/;

/* MCR-SEC-015 (condition E1). How a flag is joined to its value is a property of
   the FLAG'S SHAPE, not a per-token decision a content author gets to make and
   get wrong twenty times:

     --long   joins with '='  — getopt_long() accepts --name=value; this is the
                                form the man pages show and the product emits
     -X       joins with ' '  — getopt() takes '-X value'. It does NOT accept
                                '-X=value': the '=' is handed straight through as
                                the first character of optarg, so `chage -M=60`
                                sets max-days to the string "=60" and
                                `auditctl -w=/etc/motd` watches nothing while
                                looking, to the operator, like it worked.

   The assembler joined EVERY flag with '=' unless the token said eq:false, and
   eq:false was used nowhere in the 24 shipped generator specs — so 20 short-
   option tokens across 11 of them emitted a command that is wrong for its tool.
   No gate could see it, because every one of those commands is perfectly quoted
   (MCR-SEC-021: containment is not validity).

   Deriving the rule fixes all 20 at once and makes the defect unwritable rather
   than merely absent: the join is computed from the flag, so a new generator
   inherits it. The two escape hatches stay, narrowly:

     eq:false     on a --long flag, for a long option that wants ' '
     join:"glued" on a -X flag, for a tool that requires '-Xvalue'

   and each is legal ONLY on the shape it belongs to. A token that declares the
   join for a shape that derives it is a disagreement between the content and
   the rule, and the only honest answer to a disagreement is null — never "guess
   which one the author meant". extract/schema.py refuses the same token at
   build time; this is the run-time backstop. */
function flagJoin(tok){
  var flag=String(tok.flag);
  if(flag.charAt(1)==="-"){                                  /* --long */
    if(tok.join!==undefined && tok.join!==null) return null;  /* `join` is a short-option word */
    if(tok.eq!==undefined && tok.eq!==null && tok.eq!==false && tok.eq!==true) return null;
    return tok.eq===false?" ":"=";
  }
  if(tok.eq!==undefined && tok.eq!==null) return null;        /* -X derives its join; it cannot be declared */
  if(tok.join===undefined || tok.join===null) return " ";
  if(tok.join==="glued") return "";                           /* -Xvalue, where a tool requires it */
  return null;
}

/* assembleCommand(specOrEntry, version, values) -> {command, flags[], blast} | null
   NULL is the only answer for an incomplete or invalid input. There is no
   second return shape carrying a half-built string, because a half-formed root
   command is a worse outcome than a blocked button (threat-model-v1 §3.4). */
function assembleCommand(spec,version,values,opts){
  opts=opts||{};
  var patterns=opts.patterns||[];
  if(!spec||!version) return null;
  if(!inList(["7","8","9","10"],version)) return null;
  if(spec.rhel_versions) return assembleEntry(spec,version,patterns);
  if(!spec.template||!spec.template.length) return null;
  if(spec.versions && !inList(spec.versions,version)) return null;
  var v=validateSpec(spec,version,values||{});
  if(!v.ok) return null;
  var types=fieldTypeMap(spec);
  var words=[],flags=[],i;
  for(i=0;i<spec.template.length;i++){
    var tok=spec.template[i];
    if(!tok) return null;
    if(tok.flag!==undefined && tok.flag!==null && !FLAG_TOKEN_RE.test(String(tok.flag))) return null;
    if(tok.lit!==undefined && tok.lit!==null){
      if(!LIT_TOKEN_RE.test(String(tok.lit))) return null;
      /* MCR-SEC-022 (E7). A lit token emits its `lit` and nothing else, so a
         `flag` beside it emits nothing — its only effect was to switch the D1
         positional rule off, unchecked, for whatever literal it was attached to.
         Whether a literal is an option is DERIVED from the literal (see
         isPositionalToken()), so the key is unnecessary for a real option and a
         bypass for anything else. Refused either way, including when it tells
         the truth: a rule with an off-switch is not a rule, and the shipped
         content carried two exemplars of the shape for the next author to copy.
         extract/schema.py refuses it at build time; this is the backstop. */
      if(tok.flag!==undefined && tok.flag!==null) return null;
      /* A literal may belong to a field — '--add-forward-port=...toaddr=' belongs
         to the toaddr value that follows it. requires: names that field, so the
         literal disappears WITH it and can never be left dangling. */
      if(tok.requires!==undefined && tok.requires!==null){
        var owner=fieldFor(spec,tok.requires);
        if(!owner) return null;                   /* lit binds to a field that does not exist */
        if(!tokenPresent(spec,version,v.resolved,tok)){
          /* MCR-SEC-013. `requires` is this literal's declaration that it may
             vanish — the lit's equivalent of optional:true. It is still an
             argument slot, so it may only vanish under the same rule a field
             token obeys: every later positional token has to vanish with it.
             The legal shape is the one MCR-SEC-002 shipped — the literal and
             the value after it gated on the SAME field, so they leave together
             and nothing is promoted. */
          if(isPositionalToken(tok) && laterPositionalSurvives(spec,version,v.resolved,i)) return null;
          continue;
        }
      }
      words.push(String(tok.lit));
      /* MCR-SEC-023. The lit branch used to push the word and return, so an
         option the command SHOWS — `sshd -T`, `setsebool -P`, `lvextend -r`,
         `journalctl --no-pager --boot` — was absent from the flag-by-flag panel
         entirely. A panel silent about a flag that is present is a smaller
         version of threat-model §4's Explainer row, a panel that describes one
         that is not. The same derived test decides it: an option-shaped literal
         is an option, so it belongs in the flag list, in command order. With no
         curated explain and no dictionary hit, `explain:null` renders
         "unverified — see man page" — the no-guess law, not a guess. */
      if(FLAG_TOKEN_RE.test(String(tok.lit))){
        flags.push({flag:String(tok.lit),explain:tok.explain||null});
      }
      continue;
    }
    if(tok.richRule){
      var composed=composeRichRule(v.resolved,tok.richRule,types);
      if(composed===null) return null;
      if(tok.flag){
        var rjoin=flagJoin(tok);                  /* MCR-SEC-015: one join rule, not two */
        if(rjoin===null) return null;
        words.push(String(tok.flag)+rjoin+shQuote(composed));
        flags.push({flag:String(tok.flag),explain:tok.explain||null});
      }else{
        words.push(shQuote(composed));
      }
      continue;
    }
    var field=fieldFor(spec,tok.field);
    if(!field) return null;                       /* template cites a field that does not exist */
    if(!tokenPresent(spec,version,v.resolved,tok)){
      /* MCR-SEC-002. This token is about to vanish — because the value was not
         supplied, or because the field is gated out of this release. Dropping a
         token is a decision about the TEMPLATE, not about one field, so it is
         only legal when the template declared it:

           - optional:true is mandatory. Without it the template is not complete
             on this release and the only honest answer is null. A shortened
             command with Copy enabled and no banner is worse than a blocked
             button (threat-model-v1 §3.4).
           - a POSITIONAL token may additionally only vanish if every later
             positional token vanishes too. Otherwise argument n+1 is promoted
             into slot n — `chown 'apache' '/var/www'` silently becoming
             `chown '/var/www'` — and the command still assembles.

         A version-gated field takes the same path as an unsupplied one: the same
         template must not be well-formed on RHEL 9 and mis-positioned on RHEL 8. */
      if(tok.optional!==true) return null;
      if(isPositionalToken(tok) && laterPositionalSurvives(spec,version,v.resolved,i)) return null;
      continue;
    }
    var q=shQuote(v.resolved[tok.field]);
    if(tok.flag){
      var join=flagJoin(tok);                     /* MCR-SEC-015: derived from the flag's shape */
      if(join===null) return null;                /* the token declares a join its shape derives */
      words.push(String(tok.flag)+join+q);
      flags.push({flag:String(tok.flag),explain:field.explain||null});
    }else{
      words.push(q);
    }
  }
  var command=words.join(" ");
  if(command==="") return null;
  var b=blastFor(command,spec.blast,patterns);
  return {id:spec.id,tool:spec.tool,command:command,flags:flags,blast:b.blast,
          blast_reasons:b.reasons,notes:spec.notes||null,resolved_from:null,version:version};
}
/* ===== MCR-ASSEMBLER-END ================================================== */

/* ============ data island loader ============ */
var DATA,DATASETS;
try{
  DATA=JSON.parse(document.getElementById("mcr-data").textContent);
  DATASETS={
    META:DATA.meta,
    COMMANDS:DATA.commands,
    TOOLS:DATA.tools,
    DANGEROUS:DATA.dangerous,
    GLOSSARY:DATA.glossary,
    RULES:DATA.rules,
    FLAGS:DATA.flags,
    CCI_NIST:DATA.cci_nist,
    EXPECTED:DATA.expected_output,
    INDEX_SEED:DATA.index_seed
  };
}catch(e){
  document.getElementById("editor-card").innerHTML=
    "<h2>Not built yet</h2><p>This is the template. Run <code>python3 build.py</code> to inject content and produce <code>dist/md-code-red_&lt;version&gt;.html</code>.</p>";
  return;
}
var PATTERNS=(DATASETS.DANGEROUS&&DATASETS.DANGEROUS.patterns)||[];

/* ============ generator registry (CR-T-17..25, ADR-001 §8 module 4) ============
   A generator is not authored as a second list: it IS a commands.json entry
   whose shape is {fields[], template[]} instead of {rhel_versions}
   (extract/schema.py's spec_errors() is the build-time authority for that
   shape — see MCR-SEC-006's block comment above the assembler's own
   FLAG_TOKEN_RE/LIT_TOKEN_RE). GENERATORS is simply the runtime's derived view
   of "which content-island entries are generators", computed once at boot so
   the tool list, the form renderer and Q5's feature-marker scan (which greps
   the shipped shell for the literal text "var GENERATORS=") all read the same
   list instead of each re-deriving "has a template" ad hoc. */
var GENERATORS=(function(){
  var entries=(DATASETS.COMMANDS&&DATASETS.COMMANDS.entries)||[],out=[];
  for(var i=0;i<entries.length;i++){ if(entries[i].template) out.push(entries[i]); }
  return out;
})();
function isGeneratorEntry(entry){ return !!(entry&&entry.template); }

/* ============ version state — one source of truth, mirrored to sessionStorage ============ */
var STATE={version:"9",rail:"builder",toolId:null,entryId:null,line:0,acked:false,
           toast:"",paletteOpen:false,paletteSel:0,paletteHits:[],formValues:{}};
(function(){
  var saved=STORE.getSession("version",null);
  if(saved && RHEL_VERSIONS.indexOf(saved)>=0) STATE.version=saved;
  var lastTool=STORE.get("lasttool",null);       /* stored by ID only, never free text */
  if(lastTool && toolById(lastTool)) STATE.toolId=lastTool;
})();
function setVersion(v){
  if(RHEL_VERSIONS.indexOf(v)<0) return;
  STATE.version=v;
  STATE.acked=false;                              /* a new version is a new command */
  STORE.setSession("version",v);
  renderAll();
}

/* ============ content lookups ============ */
function toolById(id){
  var tools=(DATASETS.TOOLS&&DATASETS.TOOLS.tools)||[];
  for(var i=0;i<tools.length;i++){ if(tools[i].id===id) return tools[i]; }
  return null;
}
function entryById(id){
  var entries=(DATASETS.COMMANDS&&DATASETS.COMMANDS.entries)||[];
  for(var i=0;i<entries.length;i++){ if(entries[i].id===id) return entries[i]; }
  return null;
}
function entriesForTool(id){
  var entries=(DATASETS.COMMANDS&&DATASETS.COMMANDS.entries)||[],out=[];
  for(var i=0;i<entries.length;i++){ if(entries[i].tool===id) out.push(entries[i]); }
  return out;
}
function toolAvailability(tool){
  var a=(tool&&tool.availability)||{};
  return a[STATE.version]||{available:false,reason:"no availability recorded for RHEL "+STATE.version};
}
/* The dictionary answer for a flag, in the SELECTED version only. Decoding a
   RHEL 9 command against a RHEL 10 dictionary would be a silent lie, so a
   version with no dictionary yields the humility copy, not a neighbour's text. */
function flagExplain(toolId,flag,version){
  var dict=(DATASETS.FLAGS||{})[version||STATE.version];
  var cli=dict&&dict.clis?dict.clis[toolId]:null;
  if(!cli||!cli.flags) return null;
  for(var i=0;i<cli.flags.length;i++){
    var f=cli.flags[i];
    if(f.names && f.names.indexOf(flag)>=0 && f.explain) return f.explain;
  }
  return null;
}
/* ============ decoder — ADR-001 §8 module 7 ============
   Grey Beard's decodeCmd() grown a version dimension: every flag an assembled
   result carries is resolved to an explanation, curated first (a static
   commands.json entry's own flags[].explain) and the SELECTED-VERSION flag
   dictionary second (flagExplain() already refuses to read a neighbour
   version's dictionary — decodeCmd() is told the version explicitly rather
   than assuming STATE.version, so a future paste-and-decode panel can decode
   against a version that is not the one currently on screen). Unknown or
   uncurated stays null — the no-guess law applies here exactly as it does at
   authoring time (CR-P0-02 AC3). */
function decodeCmd(toolId,version,flags){
  var out=[],i;
  flags=flags||[];
  for(i=0;i<flags.length;i++){
    var f=flags[i];
    var explain=f.explain||flagExplain(toolId,f.flag,version);
    out.push({flag:f.flag,explain:explain||null});
  }
  return out;
}
/* ---- one rendered-state object per interaction (MCR-SEC-012) --------------
   threat-model-v1 §9 and §4 require that the copy path and the evidence
   exporter "read from the same rendered-state object the screen displays, never
   recompute independently". The implementation recomputed: renderEditor(),
   renderBlastBanner(), renderInspector() and doCopy() each called
   assembleCommand() afresh — four independent computations of the thing the
   operator is about to run as root.

   Nothing diverged, because assembleCommand() is pure (the harness enforces
   that: no document, no window, no storage, no DATASETS, no STATE inside the
   block) and STATE does not change between a render and a copy. It diverges the
   moment any input to assembly stops being deterministic — a timestamp, a
   capture record, a lazily built index — and by then the divergence is between
   what the ISSM signed and what the admin ran.

   RESULT is that object. It is computed once per interaction, keyed on the state
   assembly reads, and dropped at the start of every renderAll(). The gutter, the
   banner, the inspector, the clipboard preview, doCopy() and the CR-T-28
   exporter all read it. */
var RESULT={key:null,value:null};
/* A generator's assembled command depends on live form input as well as on
   STATE.version/entryId, so its key folds STATE.formValues in too — every
   keystroke is then a genuinely new "interaction" for MCR-SEC-012's cache,
   computed once and reused by the gutter, the banner, the inspector and the
   clipboard, exactly like a static entry's key never needing formValues at
   all (a plain string concatenation is a no-op when the object is empty). */
function resultKey(){ return STATE.version+"|"+String(STATE.entryId)+"|"+formValuesKey(); }
function formValuesKey(){
  var keys=[],k,out=[];
  for(k in STATE.formValues){ if(Object.prototype.hasOwnProperty.call(STATE.formValues,k)) keys.push(k); }
  keys.sort();
  for(var i=0;i<keys.length;i++){
    out.push(encodeURIComponent(keys[i])+"="+encodeURIComponent(STATE.formValues[keys[i]]));
  }
  return out.join("&");
}
function computeResult(){
  if(!STATE.entryId) return null;
  var entry=entryById(STATE.entryId);
  if(!entry) return null;
  var values=isGeneratorEntry(entry)?STATE.formValues:{};
  var res=assembleCommand(entry,STATE.version,values,{patterns:PATTERNS});
  if(!res) return null;
  return withCopyPayloads(res,entry);
}
function invalidateResult(){ RESULT.key=null; RESULT.value=null; }
function currentResult(){
  var key=resultKey();
  if(RESULT.key!==key){
    RESULT.key=key;
    RESULT.value=computeResult();
  }
  return RESULT.value;
}

/* The lines of the comment header, as plain label+value text. They are NOT
   "# "-prefixed here: commentPayload() owns the prefix so that exactly one
   place in this file decides what a clipboard line looks like (MCR-SEC-003). */
function commentHeaderLines(res,entry,blast){
  var lines=[APP_NAME+" "+APP_VERSION+" — RHEL "+res.version];
  if(entry&&entry.intent) lines.push("intent: "+entry.intent);
  var stig=entry?stigRowsFor(entry):[];
  for(var i=0;i<stig.length;i++){
    lines.push("STIG: "+stig[i].stig_id+" (CAT "+catFor(stig[i])+")  NIST: "+((stig[i].nist||[]).join(", ")||"n/a"));
  }
  lines.push("blast: "+blast);
  return lines;
}

/* Attach both clipboard payloads to the result, and re-evaluate blast over the
   LONGER of the two. The destructive-pattern table has to see everything the
   clipboard can receive, not just the command line (MCR-SEC-003); the banner
   then fires before the operator clicks Copy, not after.

   Two passes, because the header carries the blast value itself: compose with
   the command-level blast, scan the whole payload, then recompose with the
   final blast so the header never states a blast the banner contradicts. */
function withCopyPayloads(res,entry){
  var probe=commentPayload(commentHeaderLines(res,entry,res.blast),res.command);
  var b=blastFor(probe===null?res.command:probe,res.blast,PATTERNS);
  res.blast=b.blast;
  res.blast_reasons=b.reasons;
  res.copy_plain=res.command;
  res.copy_comment=commentPayload(commentHeaderLines(res,entry,res.blast),res.command);
  return res;
}

/* ============ theme — prefers-color-scheme default, explicit choice persists ============ */
var THEME=(function(){
  function current(){ return document.documentElement.getAttribute("data-theme"); }
  function apply(mode){
    if(mode==="dark"||mode==="light") document.documentElement.setAttribute("data-theme",mode);
    else document.documentElement.removeAttribute("data-theme");
  }
  function resolved(){
    var m=current();
    if(m) return m;
    try{
      if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    }catch(e){}
    return "light";
  }
  return {
    init:function(){ apply(STORE.getSession("theme",null)); },
    resolved:resolved,
    explicit:current,
    toggle:function(){
      var next=resolved()==="dark"?"light":"dark";
      apply(next);
      STORE.setSession("theme",next);
      renderStatusBar();
    }
  };
})();

/* ============ clipboard — air-gapped: a selection and execCommand, nothing else ============ */
function copyText(text){
  var ta=document.createElement("textarea");
  ta.value=String(text);
  ta.setAttribute("readonly","readonly");
  ta.style.position="fixed";
  ta.style.top="-1000px";
  document.body.appendChild(ta);
  ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy")===true; }catch(e){ ok=false; }
  document.body.removeChild(ta);
  return ok;
}
function toast(msg){
  STATE.toast=msg;
  renderStatusBar();
}
function doCopy(withComment){
  var res=currentResult();
  if(!res){ toast("Nothing to copy — no complete command is assembled."); return; }
  var payload=withComment?res.copy_comment:res.copy_plain;
  if(payload===null||payload===undefined){
    toast("Copy refused — the comment header could not be rendered as single-line text.");
    return;
  }
  /* res.blast was already computed over this payload (withCopyPayloads), so the
     acknowledgement the operator gave is an acknowledgement of the whole
     clipboard contents, header included — not of the command line alone. */
  if(res.blast==="red" && !STATE.acked){ toast("Destructive command — tick the review box first."); return; }
  var ok=copyText(payload);
  toast(ok?("Copied to clipboard — RHEL "+res.version):"Copy failed — select the text in the editor and use your browser's copy.");
}

/* ============ STIG helpers ============ */
function stigRowsFor(entry){
  var rows=(entry&&entry.stig)||[],out=[];
  for(var i=0;i<rows.length;i++){ if(rows[i].rhel_version===STATE.version) out.push(rows[i]); }
  return out;
}
function catFor(row){
  var rules=((DATASETS.RULES||{})[STATE.version]||{}).rules||[];
  for(var i=0;i<rules.length;i++){ if(rules[i].i===row.stig_id) return rules[i].c||"?"; }
  return "?";
}

/* ============ renderers — every value crosses innerHTML through esc()/escapeAttr() ============ */
function renderVersionSelector(){
  var html="";
  for(var i=0;i<RHEL_VERSIONS.length;i++){
    var v=RHEL_VERSIONS[i];
    html+="<button type=\"button\" data-version=\""+escapeAttr(v)+"\" aria-pressed=\""+
          (v===STATE.version?"true":"false")+"\" aria-label=\"RHEL "+escapeAttr(v)+"\">"+esc(v)+"</button>";
  }
  el("version-seg").innerHTML=html;
}

function renderRail(){
  var btns=document.querySelectorAll("#rail .railbtn");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-current",btns[i].getAttribute("data-rail")===STATE.rail?"true":"false");
  }
}

/* The tool list is gated, never filtered: a tool that RHEL N does not ship stays
   on screen, disabled, carrying the reason and the alternative (CR-P0-01 AC2). */
/* Is this catalog entry offered on the selected release, and why not if it
   isn't — the same question, answered the same way, for a static curated
   entry (gated by rhel_versions[v].unavailable) and a generator spec (gated
   by spec.versions, CR-T-17+). Neither branch ever hides the row; both return
   a reason the sidebar renders (CR-P0-01 AC2). */
function entryGateInfo(e){
  if(isGeneratorEntry(e)){
    var gated=!!(e.versions && !inList(e.versions,STATE.version));
    return {gated:gated,
            reason:gated?"This generator is not offered on RHEL "+STATE.version+".":""};
  }
  var slot=(e.rhel_versions||{})[STATE.version]||{};
  var gated2=!!slot.unavailable;
  return {gated:gated2, reason:gated2?((slot.unavailable&&slot.unavailable.reason)||""):""};
}

function renderToolList(){
  var tools=(DATASETS.TOOLS&&DATASETS.TOOLS.tools)||[];
  var html="";
  if(STATE.rail!=="builder"){
    html+="<p class=\"region-label\">"+esc(STATE.rail)+"</p>";
    html+="<p class=\"muted\">This rail lands with its own task: STIG search and the control crosswalk (CR-T-26), the Ansible generator (CR-T-25), favourites and recent (CR-T-27), and the About panel with the content fingerprint (CR-T-30). The Command Builder rail is live now.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  html+="<p class=\"region-label\">Tools</p>";
  if(!tools.length){
    html+="<p class=\"muted\">No tools in this build's content island.</p>";
    el("sidebar-body").innerHTML=html;
    return;
  }
  html+="<ul class=\"list\" data-listnav=\"tools\">";
  for(var i=0;i<tools.length;i++){
    var t=tools[i];
    var av=toolAvailability(t);
    var open=(t.id===STATE.toolId);
    if(av.available){
      html+="<li><button type=\"button\" class=\"row\" data-tool=\""+escapeAttr(t.id)+"\" aria-current=\""+
            (open?"true":"false")+"\">"+esc(t.label||t.id);
      if(av.note){ html+="<span class=\"why\">"+esc(av.note)+"</span>"; }
      html+="</button></li>";
    }else{
      html+="<li><button type=\"button\" class=\"row\" aria-disabled=\"true\" disabled title=\""+
            escapeAttr(GATED_COPY+STATE.version+(av.reason?" — "+av.reason:""))+"\">"+esc(t.label||t.id)+
            "<span class=\"why\">"+esc(GATED_COPY+STATE.version)+(av.alternative?esc(" — use "+av.alternative):"")+"</span></button></li>";
    }
    if(!open) continue;
    var entries=entriesForTool(t.id);
    html+="<li><ul class=\"list\" data-listnav=\"entries\">";
    if(!entries.length){
      html+="<li><p class=\"muted\">No catalogued command for this tool yet — the catalog is authored in CR-T-33.</p></li>";
    }
    for(var j=0;j<entries.length;j++){
      var e=entries[j];
      var gate=entryGateInfo(e);
      if(gate.gated){
        html+="<li><button type=\"button\" class=\"row\" aria-disabled=\"true\" disabled title=\""+
              escapeAttr(GATED_COPY+STATE.version+(gate.reason?" — "+gate.reason:""))+"\">"+
              esc(e.intent||e.id)+"<span class=\"why\">"+esc(GATED_COPY+STATE.version)+"</span></button></li>";
      }else{
        html+="<li><button type=\"button\" class=\"row\" data-entry=\""+escapeAttr(e.id)+"\" aria-current=\""+
              (e.id===STATE.entryId?"true":"false")+"\">"+esc(e.intent||e.id)+
              (isGeneratorEntry(e)?"<span class=\"why\">guided form</span>":"")+"</button></li>";
      }
    }
    html+="</ul></li>";
  }
  html+="</ul>";
  el("sidebar-body").innerHTML=html;
}

/* The banner owns its own region so no other renderer ever concatenates a
   function's return value into an innerHTML expression — the Q17 audit only
   has to look at string literals and esc() calls, in every renderer, forever. */
function renderBlastBanner(res){
  var html="";
  if(!res||res.blast!=="red"){ el("blast-banner").innerHTML=html; return; }
  html+="<div class=\"blast\" role=\"alert\"><h2>Destructive operation — review before running</h2>";
  var reasons=res.blast_reasons||[];
  if(!reasons.length){
    html+="<p>This entry is catalogued as blast radius red by its content reviewer.</p>";
  }
  for(var i=0;i<reasons.length;i++){
    html+="<p><strong>"+esc(reasons[i].label||reasons[i].id)+"</strong> — "+esc(reasons[i].why||"")+"</p>";
  }
  html+="<label><input type=\"checkbox\" data-action=\"ack\""+(STATE.acked?" checked":"")+
        "> I have reviewed this command</label></div>";
  el("blast-banner").innerHTML=html;
}

function renderEditor(){
  var html="";
  renderBlastBanner(currentResult());
  if(!STATE.entryId){
    html+="<div class=\"card\"><h2>No command selected</h2><p class=\"muted\">Pick a tool from the sidebar, or press <code>/</code> to search. Copy is not rendered at all until a command is assembled — there is no dead control to tab through.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  var entry=entryById(STATE.entryId);
  if(!entry){
    html+="<div class=\"card\"><h2>Entry not found</h2><p class=\"muted\">This build's content island has no entry with that id. Nothing is guessed and nothing is rendered from raw text.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  if(isGeneratorEntry(entry)){
    renderGeneratorEditor(entry);
    return;
  }
  var res=currentResult();
  if(!res){
    var slot=(entry.rhel_versions||{})[STATE.version]||{};
    var why=(slot.unavailable&&slot.unavailable.reason)||"";
    var alt=(slot.unavailable&&slot.unavailable.alternative)||"";
    html+="<div class=\"card\"><h2>"+esc(GATED_COPY+STATE.version)+"</h2>";
    html+="<p class=\"muted\">"+esc(why||"This entry has no command for the selected release, so no command is assembled and nothing can be copied.")+"</p>";
    if(alt) html+="<p class=\"muted\">Alternative: "+esc(alt)+"</p>";
    html+="</div>";
    el("editor-card").innerHTML=html;
    return;
  }
  html+="<h2>"+esc(entry.intent||entry.id)+"</h2>";
  html+="<p class=\"muted\">"+esc(entry.tool)+" · RHEL "+esc(res.version)+" · blast "+esc(res.blast)+
        (res.resolved_from?esc(" · same as RHEL "+res.resolved_from):"")+"</p>";
  var lines=String(res.command).split("\n");
  html+="<div class=\"codeblock\" aria-label=\"Assembled command\">";
  for(var i=0;i<lines.length;i++){
    html+="<div class=\"codeline\" role=\"button\" tabindex=\"0\" data-line=\""+escapeAttr(String(i))+
          "\" aria-current=\""+(i===STATE.line?"true":"false")+
          "\" aria-label=\"Line "+escapeAttr(String(i+1))+"\"><span class=\"ln\">"+esc(String(i+1))+
          "</span><span class=\"lc\">"+esc(lines[i])+"</span></div>";
  }
  html+="</div>";
  var blocked=(res.blast==="red"&&!STATE.acked);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy-comment\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy with comment</button>";
  html+="</div>";
  /* threat-model-v1 §9: what is in the preview is exactly and only what gets
     copied. The comment header used to be built at click time and never shown;
     it is rendered here, escaped, from the same res.copy_comment string that
     doCopy() puts on the clipboard (MCR-SEC-003). */
  if(res.copy_comment){
    html+="<p class=\"region-label\">Copy with comment — exactly what reaches the clipboard</p>";
    html+="<pre class=\"copypreview\" aria-label=\"Clipboard preview for Copy with comment\">"+
          esc(res.copy_comment)+"</pre>";
  }
  if(res.notes) html+="<p class=\"muted\">"+esc(res.notes)+"</p>";
  html+="<p class=\"muted\">Verify: "+esc(entry.verify||"")+"</p>";
  html+="<p class=\"muted\">Undo: "+esc(entry.undo||"")+"</p>";
  el("editor-card").innerHTML=html;
}

/* ============ generator form renderer (CR-T-17..25, ADR-001 §8 module 5) ====
   Builds the SIDEBAR-of-the-editor form from a generator's fields[] — marks
   required fields per UI spec §4 (*, "(required)" in the label text, never
   colour alone, aria-required), and renders a version-gated field disabled +
   aria-disabled + aria-describedby pointing at the reason, exactly like a
   gated tool or entry row. The form frame (this function) is rebuilt only on
   entry selection and on a RHEL version change — never on a keystroke, so
   typing never loses focus; renderGeneratorResult() below is the part that
   redraws on every keystroke, into its own #gen-result sink. */
/* One accumulator, inline, exactly like every other renderer in this file —
   deliberately NOT split into a per-field helper that RETURNS an HTML string:
   Q17's audit only trusts a segment reaching a sink if it is a string
   literal, one of esc()/escapeAttr()/escapeRegex(), or an accumulator this
   gate derived from assignments in THIS file — a bare call to a helper
   function is none of those, so the helper's returned markup would be an
   unaudited segment no matter how carefully the helper itself escapes it. */
function renderGeneratorForm(entry){
  var html="<p class=\"region-label\">Fields</p>";
  var fields=entry.fields||[];
  for(var i=0;i<fields.length;i++){
    var field=fields[i];
    var name=field.name;
    var val=STATE.formValues[name]!==undefined?STATE.formValues[name]:"";
    var gated=!fieldAvailable(field,STATE.version);
    var id="genf-"+entry.id+"-"+name;
    html+="<div class=\"field\"><label for=\""+escapeAttr(id)+"\">"+esc(name);
    if(field.required){ html+=" <span class=\"req\">*</span> (required)"; }
    else{ html+=" (optional)"; }
    html+="</label>";
    if(gated){
      html+="<input type=\"text\" id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
            "\" disabled aria-disabled=\"true\" aria-describedby=\""+escapeAttr(id)+"-why\" value=\"\">";
      html+="<p class=\"why\" id=\""+escapeAttr(id)+"-why\">"+esc(GATED_COPY+STATE.version)+"</p>";
      html+="</div>";
      continue;
    }
    /* type "enum" is the author-curated closed set (field.options); a handful
       of built-in FIELD_TYPES are ALSO closed sets (protocol/family/action)
       with their enum baked into the type itself — both render a <select>,
       neither makes the operator type a value the assembler would just as
       happily have offered as a choice. */
    var builtinEnum=(FIELD_TYPES[field.type]||{}).enums;
    if(field.type==="enum"||builtinEnum){
      html+="<select id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
            "\" aria-required=\""+(field.required?"true":"false")+"\">";
      html+="<option value=\"\">(choose)</option>";
      var opts=field.type==="enum"?(field.options||[]):builtinEnum;
      for(var j=0;j<opts.length;j++){
        var o=opts[j];
        var ov=(typeof o==="string")?o:o.value;
        var optGated=(typeof o!=="string")&&o.versions&&!inList(o.versions,STATE.version);
        html+="<option value=\""+escapeAttr(ov)+"\"";
        if(ov===val){ html+=" selected"; }
        if(optGated){ html+=" disabled"; }
        html+=">"+esc(ov);
        if(optGated){ html+=" ("+esc(GATED_COPY+STATE.version)+")"; }
        html+="</option>";
      }
      html+="</select></div>";
      continue;
    }
    html+="<input type=\"text\" id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
          "\" aria-required=\""+(field.required?"true":"false")+"\" maxlength=\""+
          escapeAttr(String((FIELD_TYPES[field.type]||{}).cap||200))+"\" placeholder=\""+
          escapeAttr((FIELD_TYPES[field.type]||{}).label||field.type)+"\" value=\""+
          escapeAttr(val)+"\"></div>";
  }
  el("gen-fields").innerHTML=html;
}
/* Fills #gen-result — the assembled command, the toolbar, the clipboard
   preview, verify/undo/notes — from the SAME currentResult() every other
   region reads (MCR-SEC-012). Runs on every keystroke; never touches the
   fields above it, so a text input never loses focus mid-word. */
function renderGeneratorResult(){
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  var target=el("gen-result");
  if(!entry||!target) return;
  var res=currentResult();
  renderBlastBanner(res);
  var html="";
  if(!res){
    if(entry.versions && !inList(entry.versions,STATE.version)){
      html+="<div class=\"card\"><h2>"+esc(GATED_COPY+STATE.version)+"</h2>"+
            "<p class=\"muted\">This generator is not offered on RHEL "+esc(STATE.version)+
            ".</p></div>";
    }else{
      var v=validateSpec(entry,STATE.version,STATE.formValues);
      html+="<div class=\"card\"><h2>Fill in the required fields</h2>";
      if(v.missing.length){
        html+="<p class=\"muted\">Still needed: "+esc(v.missing.join(", "))+"</p>";
      }
      for(var i=0;i<v.invalid.length;i++){
        html+="<p class=\"muted\">"+esc(v.invalid[i].name)+": "+esc(v.invalid[i].reason)+"</p>";
      }
      html+="<p class=\"muted\">Copy is not rendered at all until a complete command is "
            +"assembled — there is no dead control to tab through.</p></div>";
    }
    target.innerHTML=html;
    return;
  }
  html+="<p class=\"muted\">"+esc(entry.tool)+" · RHEL "+esc(res.version)+" · blast "+esc(res.blast)+"</p>";
  var lines=String(res.command).split("\n");
  html+="<div class=\"codeblock\" aria-label=\"Assembled command\">";
  for(var li=0;li<lines.length;li++){
    html+="<div class=\"codeline\" role=\"button\" tabindex=\"0\" data-line=\""+escapeAttr(String(li))+
          "\" aria-current=\""+(li===STATE.line?"true":"false")+
          "\" aria-label=\"Line "+escapeAttr(String(li+1))+"\"><span class=\"ln\">"+esc(String(li+1))+
          "</span><span class=\"lc\">"+esc(lines[li])+"</span></div>";
  }
  html+="</div>";
  var blocked=(res.blast==="red"&&!STATE.acked);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy-comment\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy with comment</button>";
  html+="</div>";
  if(res.copy_comment){
    html+="<p class=\"region-label\">Copy with comment — exactly what reaches the clipboard</p>";
    html+="<pre class=\"copypreview\" aria-label=\"Clipboard preview for Copy with comment\">"+
          esc(res.copy_comment)+"</pre>";
  }
  if(res.notes) html+="<p class=\"muted\">"+esc(res.notes)+"</p>";
  html+="<p class=\"muted\">Verify: "+esc(entry.verify||"")+"</p>";
  html+="<p class=\"muted\">Undo: "+esc(entry.undo||"")+"</p>";
  target.innerHTML=html;
}
function renderGeneratorEditor(entry){
  /* The frame owns ONLY its own literal/esc() markup (Q17's audit rule: a
     bare call to another render function is not a trusted segment, only
     esc()/escapeAttr()/escapeRegex() and literals are) — the fields and the
     result each write into their OWN sink below, as separate statements,
     never concatenated into this accumulator. */
  var html="<h2>"+esc(entry.intent||entry.id)+"</h2>";
  html+="<p class=\"muted\">"+esc(entry.tool)+" — guided form</p>";
  html+="<div id=\"gen-fields\"></div><div id=\"gen-result\"></div>";
  el("editor-card").innerHTML=html;
  renderGeneratorForm(entry);
  renderGeneratorResult();
}

function renderInspector(){
  var html="";
  var res=currentResult();
  if(!res){
    html+="<p class=\"muted\">Flag-by-flag explanations and STIG badges render here once a command is assembled.</p>";
    el("inspector-body").innerHTML=html;
    return;
  }
  var entry=entryById(res.id);
  var rows=entry?stigRowsFor(entry):[];
  for(var i=0;i<rows.length;i++){
    var cat=catFor(rows[i]);
    var cls=(cat==="I"?"badge cat1":(cat==="II"?"badge cat2":(cat==="III"?"badge cat3":"badge")));
    html+="<span class=\""+escapeAttr(cls)+"\">STIG "+esc(rows[i].stig_id)+", Category "+esc(cat)+"</span>";
    var nist=(rows[i].nist||[]).join(", ");
    if(nist) html+="<span class=\"badge\">NIST "+esc(nist)+"</span>";
    var cci=(rows[i].cci||[]).join(", ");
    if(cci) html+="<span class=\"badge\">"+esc(cci)+"</span>";
  }
  html+="<p class=\"region-label\">Flag by flag</p>";
  var flags=decodeCmd(res.tool,res.version,res.flags||[]);
  if(!flags.length) html+="<p class=\"muted\">This command takes no flags.</p>";
  for(var j=0;j<flags.length;j++){
    var explain=flags[j].explain;
    html+="<div class=\"flagrow\"><span class=\"tok\">"+esc(flags[j].flag)+"</span>";
    if(explain){
      html+="<span class=\"mean\">"+esc(explain)+"</span>";
    }else{
      /* the no-guess law: no curated paraphrase for this version's dictionary
         means the panel says so, in the selected version only */
      html+="<span class=\"mean unverified\">"+esc(UNVERIFIED_FLAG_COPY)+"</span>";
    }
    html+="</div>";
  }
  var srcObj=entry&&entry.source?entry.source:null;
  if(srcObj){
    html+="<p class=\"region-label\">Source</p>";
    html+="<p class=\"muted\">"+esc(srcObj.title||"")+" — "+esc(srcObj.version||"")+
          " (retrieved "+esc(srcObj.retrieved_on||"")+")</p>";
  }
  el("inspector-body").innerHTML=html;
}

function stigReleaseLabel(){
  var rules=DATASETS.RULES||{};
  var rec=rules[STATE.version];
  var meta=rec&&rec._meta?rec._meta:null;
  if(!meta) return "no STIG dataset for RHEL "+STATE.version;
  var label="STIG "+(meta.version||"?")+" · benchmark "+(meta.benchmark_date||"?");
  if(meta.sunset) label+=" · SUNSET";
  if(meta.partial) label+=" · partial dataset";
  return label;
}
function renderStatusBar(){
  var parts=[];
  if(STATE.toast) parts.push("<span class=\"statusitem toast\">"+esc(STATE.toast)+"</span>");
  parts.push("<span class=\"statusitem\">RHEL "+esc(STATE.version)+"</span>");
  parts.push("<span class=\"statusitem\">"+esc(stigReleaseLabel())+"</span>");

  parts.push("<span class=\"statusitem\">built "+esc(APP_BUILD_DATE)+"</span>");
  parts.push("<span class=\"statusitem\">"+esc(APP_CLASSIFICATION)+"</span>");
  parts.push("<button type=\"button\" class=\"themebtn\" data-action=\"theme\" aria-label=\"Toggle dark and light theme\">Theme: "+
             esc(THEME.resolved()==="dark"?"Dark":"Light")+"</button>");
