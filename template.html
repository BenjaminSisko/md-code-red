   correct: a half-formed pipeline is worse than a blocked button. But a
   composer that refuses without saying WHICH STAGE is wrong is a usability
   failure, and a usability failure on a gate gets worked around -- an operator
   who cannot see why stage 3 will not compose assembles the line by hand in a
   text editor, which is the outcome this whole product exists to prevent. A
   worked-around gate is worse than no gate.

   So this is the pipeline's validateSpec(): the UI's window into the same
   decision, per stage, naming the stage and the reason. It NEVER returns a
   command, partial or otherwise -- the only producer of a command string is
   assemblePipeline(), and `ok` here is assemblePipeline()'s own answer rather

  if(!st||typeof st!=="object"){ out.ok=false; out.reason="this stage is not a stage"; return out; }

    op=pipeOperator(opKey);

      out.ok=false;

      return out;

    }

    var tv=validateField("path",st.target,null);

    if(isExecutionSink(tv.value)){

                 "delay on it, and this tool will not compose it";

       line the panel had no way to show it, so a write to a path nobody has
       classified rendered with no badge at all -- indistinguishable, to the
       operator, from a stage nobody rated. `unrated` is the answer the product
       owes them: not green (green is a human claim -- somebody curated an entry
       and said so), not silently yellow either. redirectTargetBlast() is the
       same function the assembler calls, asked the same question. */
    out.blast=redirectTargetBlast(tv.value);

    if(index===0){ out.ok=false; out.reason="xargs needs a command in front of it to read from"; return out; }
    if(opKey!=="pipe"){ out.ok=false; out.reason="only a pipe feeds xargs"; return out; }
    if(prevKind!=="command"){ out.ok=false; out.reason="the stage feeding xargs must be a command"; return out; }
    var x=st.xargs||{};
    if(x.nul===true&&(prevCommand===null||!producesNulDelimited(prevCommand))){
      out.ok=false;
      out.reason="-0 reads NUL-delimited records, and the stage in front of it does not produce "+
                 "them (find -print0, grep -Z)";
      return out;
    }
    if(x.replace===true&&x.maxArgs!==undefined&&x.maxArgs!==null&&x.maxArgs!==""){
      out.ok=false; out.reason="-I and -n contradict each other; xargs resolves that silently"; return out;
    }
    if(x.maxArgs!==undefined&&x.maxArgs!==null&&x.maxArgs!==""){
      var mv=validateField("integer",x.maxArgs,null);
      if(!mv.ok){ out.ok=false; out.reason="arguments per run: "+mv.reason; return out; }
      if(mv.value==="0"){ out.ok=false; out.reason="arguments per run: 0 is not a batch size"; return out; }
    }
  }
  if(!isComposableSpec(st.spec)){
    out.ok=false;
    out.reason="only a guided form composes into a pipeline. A reference command is a quoted "+
               "vendor string, and joining two of them would produce a command the vendor never "+
               "published while the citation still says they did";
    return out;
  }
  if(st.spec.versions && !inList(st.spec.versions,version)){
    out.ok=false; out.reason=GATED_COPY+version; return out;
  }
  var v=validateSpec(st.spec,version,st.values||{});
  out.missing=v.missing;
  out.invalid=v.invalid;
  if(!v.ok){
    out.ok=false;
    out.reason=v.missing.length?("still needed: "+v.missing.join(", ")):"a value is not valid for its field";
    return out;
  }

  if(res===null){ out.ok=false; out.reason="this command cannot be completed on RHEL "+version; return out; }
  if(stageRefused(st.spec.tool,res.command)){
    out.ok=false;

               "a second quoting domain this tool does not compose into";
    return out;
  }

     structurally; without this line the panel would refuse with no reason at
     all, which is the worked-around gate PL6 is about. */
  if(!stageBinaryDeclared(st.spec,res.command,toolIndex)){

  }

function validatePipeline(stages,version,opts){
  var out={ok:false,stages:[],reason:null};
  if(!stages||typeof stages.length!=="number"||!stages.length){
    out.reason="the pipeline is empty";
    return out;
  }
  if(stages.length>MAX_PIPELINE_STAGES){
    out.reason="a pipeline is capped at "+MAX_PIPELINE_STAGES+" stages so it stays reviewable";
    return out;

    prevKind=d.kind;
    prevOpKey=(stages[i]&&stages[i].op!==undefined&&stages[i].op!==null)?stages[i].op:null;
    if(d.kind==="command"||d.kind==="xargs") prevCommand=d.command||null;

     explained here, made there (MCR-SEC-012's rule applied to the composer). */

    for(i=0;i<out.stages.length;i++){
      if(!out.stages[i].ok){ out.reason="stage "+(i+1)+": "+out.stages[i].reason; break; }
    }

}

/* ===== MCR-INDEX-BEGIN =====================================================
   CR-T-29. buildIndex() and queryIndex() are the lazy typed search index.
   Deliberately pure — a function of the `datasets` object it is handed, never
   of the global DATASETS/STATE — for the same reason the assembler above is
   pure: tests/test_search_index.js lifts this block out of the SHIPPED
   artifact by these markers (mirroring tests/hostile_harness.js) and times it
   against the real embedded dataset, so "<100ms on the full dataset" is a
   number this file's own tests print, not a claim.

   "Lazy": nothing here runs at boot. The app calls buildIndex(DATASETS) once,
   on the first palette keystroke, and keeps the result in a module-level
   cache (outside this block, beside SEARCH_INDEX) for the life of the page.
   "Typed": every record in the index carries a `kind` — Tool, Command, Flag,
   STIG, CCI, NIST — so the palette can group results instead of presenting
   one flat, undifferentiated list (CR-P0-06, UI spec §4).

    var t=tools[i];
    if(!t||!t.id) continue;
    idx.push({kind:"Tool",id:t.id,tool:t.id,version:null,cat:null,
              label:t.label||t.id,
              hay:String((t.label||t.id)+" "+t.id).toLowerCase()});
  }
  var entries=(datasets.COMMANDS&&datasets.COMMANDS.entries)||[];
  for(i=0;i<entries.length;i++){
    var e=entries[i];
    if(!e||!e.id) continue;
    idx.push({kind:"Command",id:e.id,tool:e.tool||null,version:null,cat:null,
              label:e.intent||e.id,
              hay:String((e.intent||"")+" "+e.id+" "+(e.tool||"")).toLowerCase()});
    var eflags=e.flags||[];
    for(j=0;j<eflags.length;j++){
      var ef=eflags[j];
      if(!ef||!ef.flag) continue;
      idx.push({kind:"Flag",id:e.id,tool:e.tool||null,version:null,cat:null,
                label:ef.flag,
                hay:String(ef.flag+" "+(ef.explain||"")+" "+(e.tool||"")).toLowerCase()});
    }
  }
  var versions=["7","8","9","10"];
  for(k=0;k<versions.length;k++){
    var ver=versions[k];
    var dict=(datasets.FLAGS||{})[ver];
    var clis=(dict&&dict.clis)||{};
    var cliIds=[],ck;
    for(ck in clis){ if(Object.prototype.hasOwnProperty.call(clis,ck)) cliIds.push(ck); }
    for(i=0;i<cliIds.length;i++){
      var cid=cliIds[i];
      var cli=clis[cid];
      var cflags=(cli&&cli.flags)||[];
      for(j=0;j<cflags.length;j++){
        var cf=cflags[j];
        var names=(cf&&cf.names)||[];
        if(!names.length) continue;
        idx.push({kind:"Flag",id:cid,tool:cid,version:ver,cat:null,
                  label:names[0],
                  hay:String(names.join(" ")+" "+(cf.explain||"")+" "+cid).toLowerCase()});
      }
    }
    var ruleset=((datasets.RULES||{})[ver]&&datasets.RULES[ver].rules)||[];
    for(i=0;i<ruleset.length;i++){
      var r=ruleset[i];
      if(!r||!r.i) continue;
      idx.push({kind:"STIG",id:r.i,tool:null,version:ver,cat:r.c||null,
                label:r.t||r.i,
                hay:String((r.i||"")+" "+(r.t||"")+" "+(r.cci||[]).join(" ")+" "+
                          (r.n||[]).join(" ")).toLowerCase()});
    }
  }
  /* The REFERENCE tier is NOT built here, and its absence is the design.
     This function walks whole datasets to build lower-cased haystacks; doing
     that for 14,439 mined records would hydrate all three family islands on
     the first keystroke and hand back a 19,000-entry array -- eager loading
     wearing a lazy function's name. The corpus is searched through the
     build-time inverted index instead (queryReference(), MCR-HYDRATE), which
     resolves postings first and hydrates only the families a query can
     actually reach. "Reference" keeps its slot in INDEX_KIND_ORDER below:
     queryIndex() never emits that group, and paletteMatches() splices the
     index's answer into the same position, so the grouping order an operator
     sees is still stated exactly once. */
  var cciMap=(datasets.CCI_NIST&&datasets.CCI_NIST.cci)||{};
  var cciIds=[],cck;
  for(cck in cciMap){ if(Object.prototype.hasOwnProperty.call(cciMap,cck)) cciIds.push(cck); }
  for(i=0;i<cciIds.length;i++){
    var cid2=cciIds[i];
    var nist=(cciMap[cid2]&&cciMap[cid2].nist)||[];
    idx.push({kind:"CCI",id:cid2,tool:null,version:null,cat:null,
              label:cid2+(nist.length?(" -> "+nist.join(", ")):""),
              hay:String(cid2+" "+nist.join(" ")).toLowerCase()});
    for(j=0;j<nist.length;j++){
      idx.push({kind:"NIST",id:nist[j],tool:null,version:null,cat:null,
                label:"NIST "+nist[j]+" ("+cid2+")",
                hay:String(nist[j]+" "+cid2).toLowerCase()});
    }

  return idx;
}
/* queryIndex(index, q) -> {groups:[{kind,hits:[...]}], total, terms}
   Every term must match (AND, not OR) somewhere in a record's haystack — a
   whole-word match outranks a substring match, exactly like the shell's own
   paletteMatches() this replaces. Grouped by kind, kept in a stable kind
   order, each group capped so one huge family (Flag, STIG) cannot crowd every
   other kind off the palette. */

   line can never be the first thing a search offers when a curated entry
   matches the same words. */

  for(ti=0;ti<raw.length;ti++){ if(raw[ti]) terms.push(raw[ti]); }
  out.terms=terms.length;
  if(!terms.length||!index||!index.length) return out;
  var scored=[],i,t;
  for(i=0;i<index.length;i++){
    var rec=index[i],score=0,hit=true;
    for(t=0;t<terms.length;t++){
      var needle=terms[t];
      var at=rec.hay.indexOf(needle);
      if(at<0){ hit=false; break; }
      var wordStart=(at===0)||/[^a-z0-9]/.test(rec.hay.charAt(at-1));
      score+=wordStart?3:1;
    }
    if(hit) scored.push({rec:rec,score:score});
  }
  scored.sort(function(a,b){ return b.score-a.score; });
  out.total=scored.length;

  for(i=0;i<scored.length;i++){
    var kind=scored[i].rec.kind;
    if(!byKind[kind]) byKind[kind]=[];
    if(byKind[kind].length<INDEX_GROUP_CAP) byKind[kind].push(scored[i].rec);
  }
  for(k2=0;k2<INDEX_KIND_ORDER.length;k2++){
    var kn=INDEX_KIND_ORDER[k2];
    if(byKind[kn]&&byKind[kn].length) out.groups.push({kind:kn,hits:byKind[kn]});
  }
  return out;
}

/* ===== MCR-EVIDENCE-BEGIN ===================================================
   CR-T-28. formatEvidenceText() is the deterministic plain-text formatter
   behind Export command and control reference. Pure, like the block above: every value it prints
   is passed in explicitly, nothing is read from DATASETS/STATE/the DOM/the
   clock inside it, so tests/test_evidence_export.js can call it twice with the
   same fixture and assert the output is byte-identical except the operator's
   own date line (threat-model-v1 §8: the export "carries a content fingerprint
   and STIG version" and is "read from the same rendered-state object as the
   screen, never recomputed" — `res` here IS that object, the one
   currentResult() already produced; this function only formats it).

   `res` is the RESULT value from computeResult()/currentResult() (MCR-SEC-012)
   — command, flags, blast — never reassembled here. Everything else
   (STIG row, rule text, source citation, capture metadata, fingerprint,
   versions) is content-island data or app identity, handed in by the caller. */
/* Line-safety for the evidence export (Marcus Reed's Panels review,
   PANEL-002 / condition G2, range table shared per condition H2). esc()
   only neutralises HTML metacharacters for the <pre> preview, correctly --
   it is not a sanitiser (MCR-SEC-009) -- but a bidi override or a raw NUL in
   a rule title or check/fix text would still reach this PLAIN-TEXT export
   unchanged, and this text crosses trust boundary 5 into an SCTM/ATO
   package.

   evidenceHeaderSafe()/evidenceLineSafe() strip MCR-ASSEMBLER's own
   INVISIBLE_RE_G range (bidi overrides/isolates, zero-width, variation
   selectors, soft hyphen -- the exact class MCR-SEC-004 already refuses in
   curated FIELD VALUES) and neutralise HEADER_UNSAFE_G's control-character
   range the same way headerSafe() does for the clipboard header
   (MCR-SEC-003) -- H2: ONE shared range table read from MCR-ASSEMBLER, not
   a second hand-rolled copy. The first cut of this function (G2) kept its
   own numeric range table "to stay independently liftable" and that copy
   had already drifted from INVISIBLE_RE (missing U+061C, U+00AD,
   U+206A-U+206F, U+FE0F) by the time H2 caught it --
   tests/test_evidence_export_real.js and tests/test_evidence_invisible_
   coverage.js both already lift MCR-ASSEMBLER and MCR-EVIDENCE together, so
   "this block must never reach outside itself" was solving a problem the
   test suite had already stopped having; a live, correct, shared table beats
   a "pure" one that quietly stops being true.

   whitespace and trims each line, which is safe for a single clipboard
   comment line but not for this export's own content -- "STIG version: V2R8
   benchmark date: 01 Jul 2026" relies on a real double space, and the
   pre-existing CR-T-28 test asserts that line survives byte-for-byte.
   evidenceHeaderSafe() leaves ordinary spaces alone; it only ever touches
   characters that are actually hostile.

   has no verify text, no undo text, no reviewed blast rating and no capture

/* Blast for a mined command. UNRATED, never green (ADR-002).

   Green in this product is a human claim: a content reviewer looked at the
   command, decided what it does, and signed for it. Nobody has done that for a
   mined line, so the absence of a destructive-pattern match is not a safety
   finding and must not be painted as one. blastFor() is reused rather than
   re-implemented -- the same table, the same unquoted projection, the same
   scan -- and only the floor changes. */
function referenceBlast(command,patterns){
  var b=blastFor(command,"green",patterns);

}

/* TM2-F5. What does `unrated` do to the COPY control?

   As shipped before this answer, a mined `rm` variant matching no pattern would
   have copied with LESS friction than a curated green command -- the curated one
   at least carries a reviewer's undo text on screen. That is backwards. An
   unrated command is one nobody rated, so copy is held behind an acknowledgement
   for EVERY reference record regardless of blast: unrated, yellow and red alike.
   A red match adds the destructive banner on top of it; it does not replace it.
   The friction is deliberately the same shape as the red-blast acknowledgement

function referenceCopyBlocked(acked){ return !acked; }

/* Per-command attribution (licensing ruling v1 Ruling 2, condition 4). */
function refGuideUrl(tpl,version,slug){
  if(!tpl||!version||!slug) return "";
  return String(tpl).replace("%s",String(version)).replace("%s",String(slug));

/* The citation block, as plain text lines, for ONE occurrence. Pure: every
   value is passed in. Never carries a sentence from the source -- a mined

  if(occ.g){

    var remoteColon=values.destination.indexOf(":");
    var remotePath=values.destination.slice(remoteColon+1);
    if(remotePath.length>1&&/\/$/.test(remotePath)) remotePath=remotePath.slice(0,-1);

/* Founder alpha feedback (2026-09-17), problem 3: on RHEL 9 (no host captures

   extraction hosts." string, repeated under every one of them in the sidebar

   OVERALL caveat state: the note text shared by more tools on this version

   note differs still says something the overall line does not (journalctl's

/* ---- one rendered-state object per interaction (MCR-SEC-012) --------------

/* The lines of the comment header, as plain label+value text. They are NOT
   "# "-prefixed here: commentPayload() owns the prefix so that exactly one

function commentHeaderLines(res,entry,blast){
  var lines=[APP_NAME+" "+APP_VERSION+" — RHEL "+res.version],i,j;
  /* CR-T-31: a pipeline's header names EVERY stage, with the entry each stage

     third of what is about to run is the Explainer row of threat-model §4. */

    for(i=0;i<res.stages.length;i++){
      var st=res.stages[i];
      var stEntry=(st.spec&&st.spec.id)?entryById(st.spec.id):null;
      var opLabel=st.op?(PIPE_OPERATORS[st.op]?PIPE_OPERATORS[st.op].emit+" ":""):"";
      if(st.kind==="redirect"){
        lines.push("stage "+(i+1)+": "+opLabel+st.target+"  ["+st.blast+"]");
        continue;
      }
      if(st.kind==="operator"){

        continue;
      }
      lines.push("stage "+(i+1)+": "+opLabel+((stEntry&&stEntry.intent)||st.command||"")+

/* Attach both clipboard payloads to the result, and re-evaluate blast over the

  /* CR-T-25. The generated file is a THIRD clipboard payload, and it is the one

     playbook. The file's own containment is composeDoc()'s quoting, proved by

/* ============ theme — prefers-color-scheme default, explicit choice persists ============ */
var THEME=(function(){
  function current(){ return document.documentElement.getAttribute("data-theme"); }
  function apply(mode){
    if(mode==="dark"||mode==="light") document.documentElement.setAttribute("data-theme",mode);
    else document.documentElement.removeAttribute("data-theme");
  }
  function resolved(){
    var m=current();
    if(m) return m;
    try{
      if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    }catch(e){}
    return "light";
  }
  return {
    init:function(){ apply(STORE.getSession("theme",null)); },
    resolved:resolved,
    explicit:current,
    toggle:function(){
      var next=resolved()==="dark"?"light":"dark";
      apply(next);
      STORE.setSession("theme",next);
      renderStatusBar();
    }
  };
})();

/* ============ clipboard — air-gapped: a selection and execCommand, nothing else ============ */
function copyText(text){
  var previous=document.activeElement;
  var ta=document.createElement("textarea");
  ta.value=String(text);
  ta.setAttribute("readonly","readonly");
  ta.style.position="fixed";
  ta.style.top="-1000px";
  document.body.appendChild(ta);
  ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy")===true; }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(previous&&previous.focus&&document.contains(previous)) previous.focus();
  return ok;
}
function toast(msg){
  STATE.toast=msg;
  renderStatusBar();
}
function doCopy(withComment){
  var res=currentResult();
  if(!res){ toast("Nothing to copy — no complete command is assembled."); return; }
  var payload=withComment?res.copy_comment:res.copy_plain;
  if(payload===null||payload===undefined){
    toast("Copy refused — the comment header could not be rendered as single-line text.");
    return;
  }
  /* res.blast was already computed over this payload (withCopyPayloads), so the
     acknowledgement the operator gave is an acknowledgement of the whole
     clipboard contents, header included — not of the command line alone. */
  if(res.blast==="red" && !STATE.acked){ toast("Destructive command — tick the review box first."); return; }
  var ok=copyText(payload);
  toast(ok?("Copied to clipboard — RHEL "+res.version):"Copy failed — select the text in the editor and use your browser's copy.");
}
function doCopyPlanStep(which){
  var entry=STATE.entryId?entryById(STATE.entryId):null,res=currentResult();
  if(!entry||!res||!isGeneratorEntry(entry)){ toast("No complete guided plan is assembled."); return; }
  if(res.blast==="red"&&!STATE.acked){ toast("Destructive command — tick the review box first."); return; }
  var plan=operationalPlan(entry,res),payload;
  payload=plan.copy[which];
  if(payload===undefined){ toast("That plan step is unavailable."); return; }
  if(payload===null){ toast("This step is guidance; only runnable command steps can be copied."); return; }
  if(!instructionIsBound(payload)){ toast("Copy refused — this step still contains an unresolved placeholder."); return; }
  toast(copyText(payload)?"Copied operational plan step":"Copy failed — select the displayed plan text and copy it manually.");
}

/* CR-T-25. Copying the generated FILE. Separate from doCopy() on purpose: the

  var res=currentResult();

    toast("Nothing to copy — this command generates no file.");
    return;
  }
  if(res.blast==="red" && !STATE.acked){ toast("Destructive command — tick the review box first."); return; }

/* ============ STIG helpers ============ */
function stigRowsFor(entry){
  var rows=(entry&&entry.stig)||[],out=[];
  for(var i=0;i<rows.length;i++){ if(rows[i].rhel_version===STATE.version) out.push(rows[i]); }
  return out;
}
function catFor(row){
  var rules=((DATASETS.RULES||{})[STATE.version]||{}).rules||[];
  for(var i=0;i<rules.length;i++){ if(rules[i].i===row.stig_id) return rules[i].c||"?"; }
  return "?";
}
/* rule lookup by STIG ID on a GIVEN version (not always STATE.version — a
   standalone rule opened from search carries its own version). Returns a data
   object, never markup, so it is safe to read from inside a render
   accumulator: only fields of what it returns that are passed through esc()
   ever reach a sink. */
function ruleFor(stigId,version){
  var rules=((DATASETS.RULES||{})[version]||{}).rules||[],i;
  for(i=0;i<rules.length;i++){ if(rules[i].i===stigId) return rules[i]; }
  return null;
}
/* CCI -> NIST SP 800-53 crosswalk (CR-T-26: "CCIs -> NIST controls via
   cci_nist"). Data only, deduplicated, order-preserving. */
function nistForCci(cciList){
  var map=(DATASETS.CCI_NIST&&DATASETS.CCI_NIST.cci)||{},out=[],i,j;
  cciList=cciList||[];
  for(i=0;i<cciList.length;i++){
    var rec=map[cciList[i]];
    var nist=(rec&&rec.nist)||[];
    for(j=0;j<nist.length;j++){ if(out.indexOf(nist[j])<0) out.push(nist[j]); }
  }
  return out;
}

/* ============ per-version verification status ============
   CEO ruling closing Riley Park's first capture review (capture-review-run1-
   2026-09-18.md RILEY-F1): `verified` is an object keyed by RHEL version, each
   value false or a {by, on, host, capture, command_as_run} receipt — never a single
   whole-entry claim. This is the ONE place that turns entry.verified[version]
   (plus, where one exists, a joined STIG capture) into the three states the
   UI ever shows for a version:

     "verified"   — a real receipt sits on THIS version. Never propagated from
                    a same_as TARGET's receipt (extract/schema.py's
                    verified_errors() refuses a receipt on a same_as/unavailable
                    row in the first place, so if this version's own row IS one
                    of those, it can never reach the "verified" branch below).
     "captured"   — no receipt yet, but a capture exists for this exact
                    (entry, version) — visible here only when the entry carries
                    a stig[] row for this version with expected_output joined
                    (build.py's assemble()); a captured-but-unindexed
                    non-STIG capture (extract/import_captures.py's own
                    INDEXING note) has no channel into the shipped data island,
                    so it falls through to "unverified" honestly rather than
                    guessing.
     "unverified" — neither. Includes same_as/unavailable rows: those were
                    never independently run on this version, so "not
                    host-verified" is the true statement even though the
                    command TEXT may be identical to a version that was.

   Pure: reads only its own arguments plus the content island, returns data,
   never markup (Q17's audit rule — every field a caller reads off this
   crosses esc()/escapeAttr() at the call site, same as ruleFor()/
   nistForCci() above). */
function verificationStatusForVersion(entry, version, command){
  var ver=(entry&&entry.verified)||{};
  var receipt=ver[version];
  if(receipt&&typeof receipt==="object"){
    if(command&&receipt.command_as_run===command){
      return {state:"verified", label:"Verified",
              text:"this exact command was verified by "+receipt.by+" on "+receipt.on+
                   " ("+receipt.host+")"};
    }
    return {state:"unverified", label:"Not host-verified",
            text:"the current command differs from the command in the reviewed host receipt"};
  }
  var rows=(entry&&entry.stig)||[],i;
  for(i=0;i<rows.length;i++){
    if(rows[i].rhel_version===version&&rows[i].expected_output){
      return {state:"captured", label:"Captured", text:"captured, awaiting QA"};
    }
  }
  return {state:"unverified", label:"Not host-verified", text:"not host-verified"};
}
function verificationStatusForResult(res,entry,version){
  if(res&&res.stages){
    return {state:"unverified",label:"Composed — not host-verified",
            text:"the composed pipeline has no single host-verification receipt; review each stage"};
  }
  return entry?verificationStatusForVersion(entry,version,res&&res.command):null;
}

/* ============ CR-T-26: the STIG panel ============
   Writes #stig-panel (inspector, screen) and #print-stig-panel (editor,
   print-only) from the SAME accumulator, in two separate statements — the
   idiom every other multi-sink renderer in this file already uses (see
   renderBlastBanner()'s comment). Nothing here is a bare call spliced into the
   accumulator: ruleFor()/nistForCci() return DATA, and every field they
   return crosses the sink through esc() at the call site, exactly like every
   other renderer (Q17, MCR-SEC-004/014).

   Badge appears ONLY when the current selection carries at least one STIG row
   for the selected release (CR-P0-03) — an entry with no stig[], or a version
   with no row for it, renders an empty panel, not an empty card. */
function renderStigPanel(){
  var html="";
  var rows=[],version=STATE.version;
  var standalone=!!(STATE.stigRuleId&&STATE.stigRuleVersion);
  /* A pipeline suppresses control identity inherited from a selected command.
     A standalone STIG rule opened from search is a separate reading task and
     remains visible; it is still excluded from the composed command export. */
  if(STATE.pipeline.length&&!standalone){
    el("stig-panel").innerHTML="";
    el("print-stig-panel").innerHTML="";
    return;
  }
  if(standalone){
    version=STATE.stigRuleVersion;
    rows=[{stig_id:STATE.stigRuleId,rhel_version:STATE.stigRuleVersion,cci:null,nist:null}];
  }else if(STATE.entryId){
    var entry=entryById(STATE.entryId);
    rows=entry?stigRowsFor(entry):[];
    if(entry){
      var slot=(entry.rhel_versions||{})[STATE.version]||{};
      if(slot.changed_in_note){
        html+="<p class=\"changednote\">Changed in RHEL "+esc(STATE.version)+": "+
              esc(slot.changed_in_note)+"</p>";
      }
    }
  }
  if(!rows.length){
    el("stig-panel").innerHTML=html;
    el("print-stig-panel").innerHTML=html;
    return;
  }
  var sunsetMeta=((DATASETS.RULES||{})[version]||{})._meta;
  if(sunsetMeta&&sunsetMeta.sunset){
    html+="<div class=\"sunsetbanner\" role=\"note\">RHEL "+esc(version)+
          " STIG "+esc(sunsetMeta.version||"?")+" is SUNSET at DISA — a terminal release, no "+
          "further updates expected.</div>";
  }
  var i;
  for(i=0;i<rows.length;i++){
    var row=rows[i];
    var rule=ruleFor(row.stig_id,version);
    var cat=(rule&&rule.c)||"?";
    var cls=(cat==="I"?"badge cat1":(cat==="II"?"badge cat2":(cat==="III"?"badge cat3":"badge")));
    var cci=(row.cci&&row.cci.length)?row.cci:((rule&&rule.cci)||[]);
    var nist=(row.nist&&row.nist.length)?row.nist:nistForCci(cci);
    html+="<div class=\"stigcard\">";
    html+="<span class=\""+escapeAttr(cls)+"\">STIG "+esc(row.stig_id)+", Category "+esc(cat)+"</span>";
    var ci;
    for(ci=0;ci<cci.length;ci++){ html+="<span class=\"badge\">"+esc(cci[ci])+"</span>"; }
    if(nist.length){ html+="<span class=\"badge\">NIST "+esc(nist.join(", "))+"</span>"; }
    html+="<h3>"+esc(rule&&rule.t?rule.t:"(no rule text embedded for this build)")+"</h3>";
    if(rule&&rule.chk){
      html+="<details><summary>Check text</summary><pre class=\"stigtext\">"+esc(rule.chk)+"</pre></details>";
    }
    if(rule&&rule.fix){
      html+="<details><summary>Fix text</summary><pre class=\"stigtext\">"+esc(rule.fix)+"</pre></details>";
    }
    var cap=row.expected_output;
    if(cap&&(cap.stdout!==undefined||cap.text!==undefined)){
      html+="<details open><summary>Expected compliant output (captured)</summary>"+
            "<pre class=\"stigtext\">"+esc(cap.stdout!==undefined?cap.stdout:cap.text)+"</pre></details>";
    }else{
      html+="<p class=\"nocaptureyet\">No capture yet — expected output has not been recorded for "+
            esc(row.stig_id)+" on RHEL "+esc(version)+".</p>";
    }
    if(standalone&&rule&&(!rule.cmds||!rule.cmds.length)){
      html+="<p class=\"muted\">No command in this build's catalog is linked to this rule yet.</p>";
    }
    html+="</div>";
  }
  el("stig-panel").innerHTML=html;
  el("print-stig-panel").innerHTML=html;
}

/* Is this catalog entry offered on the selected release, and why not if it
   isn't — the same question, answered the same way, for a static curated
   entry (gated by rhel_versions[v].unavailable) and a generator spec (gated
   by spec.versions, CR-T-17+). Neither branch ever hides the row; both return

/* ============ CR-T-31: the pipeline composer's UI ==========================
   The doctrine this whole panel exists to keep: A PIPELINE IS STRUCTURE THE
   TOOL OWNS, NEVER A VALUE THE USER SUPPLIES. There is therefore no text input
   anywhere in this panel that accepts an operator. The operator picker is a
   <select> whose OPTION VALUES are the assembler's own closed-table KEYS --
   "pipe", "and", "redirect" -- and whose option LABELS render the emitted text
   for the operator to read. `|` appears on screen, escaped, as a label. It
   never appears in a value, never reaches STATE, and never reaches a command
   except from PIPE_OPERATORS' own string literal.

   A stage's values object IS STATE.formValues while that stage is being edited
   (by reference), so a keystroke in the generator form edits the stage in place
   with no second copy to keep in step. Selecting a different entry leaves stage
   editing, which is why pipelineEdit() and selectEntry() are the only two
   places STATE.pipelineEditing changes.

   Only a GENERATOR entry can become a stage. That is not a filter this panel
   applies for tidiness -- assemblePipeline() refuses a spec that carries a
   handed command string outright (isComposableSpec), so a static entry and a
   mined reference record are structurally incapable of being stages. The panel
   says WHY rather than silently offering nothing (ADR-002, and PL6's rule that
   a refusal nobody can read gets worked around in a text editor). */
/* CR-T-31. The one-line heading over an assembled command names the SUBJECT of
   what is about to run. For a single command that is the entry's tool. For a
   pipeline it is not: a two-stage line headed "journalctl" tells the operator
   they are about to run journalctl, and the second stage -- which may be the
   one that writes a file -- is not named at all. A pipeline says so, and says
   how many stages it has, because the stage count is the number of things that
   have to be read before it is run. Both header sites call this, so the screen
   and the generator panel cannot come to different conclusions. */
function resultSubject(res,entry){
  if(res&&res.tool==="pipeline"&&res.stages){
    return "pipeline of "+res.stages.length+" stages";
  }
  return (entry&&entry.tool)?entry.tool:((res&&res.tool)||"");
}
/* The privilege badge has the same problem: it is the CURRENT entry's, and for
   a pipeline the current entry may not even be a stage. Every distinct
   privilege any stage requires is named, so "requires root" cannot be dropped
   because the stage needing it is not the one on screen. */
function resultPrivilege(res,entry){
  if(!(res&&res.tool==="pipeline"&&res.stages)) return (entry&&entry.privilege)||"";
  var seen=[],i,st,e;
  for(i=0;i<res.stages.length;i++){
    st=res.stages[i];
    e=(st.spec&&st.spec.id)?entryById(st.spec.id):null;
    if(e&&e.privilege&&!inList(seen,e.privilege)) seen.push(e.privilege);
  }
  return seen.join(" + ");
}
function cloneValues(v){
  var out={},k;
  for(k in v){ if(Object.prototype.hasOwnProperty.call(v,k)) out[k]=v[k]; }
  return out;
}
function bumpPipeline(){ STATE.pipelineRev++; STATE.acked=false; STATE.toast=""; }
/* The assembler's stage array, built fresh from STATE. Every command stage
   hands over the ENTRY as its spec -- the same object assembleCommand() is
   given for a single command -- so a stage is assembled by exactly the code a
   one-command build uses, which is what makes the one-stage invariant hold by
   construction rather than by care. */
function pipelineStages(){
  var out=[],i;
  for(i=0;i<STATE.pipeline.length;i++){
    var row=STATE.pipeline[i];
    var stage={};
    if(i>0) stage.op=row.op;
    if(row.kind==="redirect"){ stage.target=row.target||""; out.push(stage); continue; }
    if(row.kind==="operator"){ out.push(stage); continue; }
    stage.spec=entryById(row.entryId);
    stage.values=row.values;
    if(row.kind==="xargs"){
      stage.kind="xargs";
      stage.xargs={nul:row.xargs.nul===true,replace:row.xargs.replace===true,
                   maxArgs:row.xargs.maxArgs||""};
    }
    out.push(stage);
  }
  return out;
}
/* The shape of a stage row in STATE, derived from the operator's `takes`: a
   path operator carries a target and no command, a standalone operator carries
   neither. Deriving it here means the click router never has to decide what
   kind of stage an operator implies, and the two can never disagree. */
function pipelineRowFor(opKey,entryId,values){
  var op=opKey?PIPE_OPERATORS[opKey]:null;
  var takes=op?op.takes:"stage";
  if(takes==="path") return {kind:"redirect",op:opKey,target:"",entryId:null,values:{},xargs:{}};
  if(takes==="none") return {kind:"operator",op:opKey,target:"",entryId:null,values:{},xargs:{}};
  return {kind:"command",op:opKey,target:"",entryId:entryId,values:values,
          xargs:{nul:false,replace:false,maxArgs:""}};
}
function pipelineAdd(){
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  if(!entry||!isGeneratorEntry(entry)){
    toast("Only a guided form composes into a pipeline. Pick a generator entry first.");
    return;
  }
  var first=STATE.pipeline.length===0;
  var row=pipelineRowFor(first?null:"pipe",entry.id,cloneValues(STATE.formValues));
  STATE.pipeline.push(row);
  STATE.pipelineEditing=STATE.pipeline.length-1;
  STATE.formValues=row.values;                  /* by reference: a keystroke edits the stage */
  bumpPipeline();
  renderAll();
}
function pipelineRemove(i){
  if(i<0||i>=STATE.pipeline.length) return;
  STATE.pipeline.splice(i,1);
  /* The new first stage joins nothing, so it cannot keep an operator -- and a
     redirect or a standalone operator cannot LEAD a pipeline at all, because
     there is nothing in front of it to redirect. Removing the one command in
     front of `> /tmp/a >> /tmp/b` leaves TWO such rows, so this drops them
     until the head is a command, rather than once: a single shift left the
     head row carrying a stale operator, which assemblePipeline() then refused
     with "only a guided form composes into a pipeline" -- a true refusal
     naming the wrong reason, which PL6 calls a gate that gets worked around. */
  while(STATE.pipeline.length&&STATE.pipeline[0].kind!=="command"&&
        STATE.pipeline[0].kind!=="xargs"){
    STATE.pipeline.shift();
  }
  if(STATE.pipeline.length){
    STATE.pipeline[0].op=null;
    /* xargs reads what the stage in front of it produced, so it cannot lead
       either. It carries an entry and its values, though, so it is DEMOTED to
       an ordinary command stage rather than discarded: the operator keeps the
       form they filled in and the pipeline composes. */
    if(STATE.pipeline[0].kind==="xargs") STATE.pipeline[0].kind="command";
  }
  STATE.pipelineEditing=null;
  STATE.formValues={};
  bumpPipeline();
  renderAll();
}
function pipelineClear(){
  STATE.pipeline=[];
  STATE.pipelineEditing=null;
  STATE.formValues={};
  bumpPipeline();
  renderAll();
}
function pipelineMove(i,delta){
  var j=i+delta;
  if(i<0||i>=STATE.pipeline.length||j<0||j>=STATE.pipeline.length) return;
  /* Only a command can stand first: a redirect has nothing in front of it to
     redirect, and xargs has nothing in front of it to read. Refused HERE, with
     a reason, rather than allowed and then refused by assemblePipeline() under
     a reason about something else (PL6). */
  if(j===0&&STATE.pipeline[i].kind!=="command"){
    toast(STATE.pipeline[i].kind==="xargs"
          ?"xargs reads what the stage in front of it produced, so it cannot be the first stage."
          :"Only a command can be the first stage: there is nothing in front of this one to redirect.");
    return;
  }
  var a=STATE.pipeline[i],b=STATE.pipeline[j];
  /* the OPERATORS stay with their positions, not with their stages: stage 1
     never carries one and every later stage always does, so reordering can
     never produce a pipeline whose first stage is joined to something. */
  var aop=a.op,bop=b.op;
  STATE.pipeline[i]=b; STATE.pipeline[j]=a;
  STATE.pipeline[i].op=aop; STATE.pipeline[j].op=bop;
  if(STATE.pipeline[0]) STATE.pipeline[0].op=null;
  STATE.pipelineEditing=null;
  STATE.formValues={};
  bumpPipeline();
  renderAll();
}
/* A redirection is a stage with no command: an operator and a validated file.
   It is added with `redirect` selected and an empty target, which is an
   INCOMPLETE stage -- the pipeline refuses to assemble and the panel names it,
   which is the behaviour PL6 asks for and not a state to be avoided. */
function pipelineAddRedirect(){
  if(!STATE.pipeline.length){
    toast("A redirection needs a command in front of it. Add a command stage first.");
    return;
  }
  if(STATE.pipeline.length>=MAX_PIPELINE_STAGES){
    toast("A pipeline is capped at "+MAX_PIPELINE_STAGES+" stages so it stays reviewable.");
    return;
  }
  STATE.pipeline.push(pipelineRowFor("redirect",null,{}));
  STATE.pipelineEditing=null;
  STATE.formValues={};
  bumpPipeline();
  renderAll();
}
function pipelineEdit(i){
  var row=STATE.pipeline[i];
  if(!row||(row.kind!=="command"&&row.kind!=="xargs")) return;
  STATE.pipelineEditing=i;
  STATE.entryId=row.entryId;
  STATE.formValues=row.values;                  /* by reference, as above */
  bumpPipeline();
  renderAll();
}
/* The operator picker. `key` arrives from a <select> whose option values are
   the closed table's keys; anything that is not an own key of that table is
   discarded here and again inside the assembler. Two refusals, and the second
   one is the one that counts: even if this function were wrong, assembler-side
   pipeOperator() would still return null and the pipeline would not compose. */
function pipelineSetOp(i,key){
  if(i<=0||i>=STATE.pipeline.length) return;
  if(!Object.prototype.hasOwnProperty.call(PIPE_OPERATORS,key)) return;
  var was=STATE.pipeline[i];
  var row=pipelineRowFor(key,was.entryId,was.values);
  if(row.kind==="command"&&(was.kind==="command"||was.kind==="xargs")){
    row.kind=was.kind; row.xargs=was.xargs;     /* keep an xargs stage an xargs stage */
  }else{
    /* Switching a command stage to `>` makes it a redirect, and the entry and
       the values the operator filled in are carried along UNUSED so that
       switching back restores them instead of silently discarding a filled-in
       form. pipelineStages() reads entryId/values for command and xargs rows
       ONLY, and assemblePipeline() refuses a path stage that carries a spec or
       values at all, so nothing here can reach an assembled command. */
    row.entryId=was.entryId;
    row.values=was.values;
    row.target=was.target||"";
    row.xargs=was.xargs||{nul:false,replace:false,maxArgs:""};
    /* a redirect has no form, so it cannot be the stage the form is editing */
    if(STATE.pipelineEditing===i){ STATE.pipelineEditing=null; STATE.formValues={}; }
  }
  STATE.pipeline[i]=row;
  bumpPipeline();
  renderAll();
}
function pipelineSetKind(i,kind){
  var row=STATE.pipeline[i];
  if(!row||(row.kind!=="command"&&row.kind!=="xargs")) return;
  row.kind=(kind==="xargs")?"xargs":"command";
  bumpPipeline();
  renderAll();
}
function pipelineSetField(i,field,value){
  var focusIdentity=renderedFocusIdentity();
  var row=STATE.pipeline[i];
  if(!row) return;
  if(field==="target"){ if(row.target===value) return; row.target=value; }
  else if(field==="maxargs"){ if(row.xargs.maxArgs===value) return; row.xargs.maxArgs=value; }
  else if(field==="nul"){
    var nulValue=(value==="1"); if(row.xargs.nul===nulValue) return; row.xargs.nul=nulValue;
  }
  else if(field==="replace"){
    var replaceValue=(value==="1"); if(row.xargs.replace===replaceValue) return; row.xargs.replace=replaceValue;
  }
  else return;
  bumpPipeline();
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  if(entry&&isGeneratorEntry(entry)) renderGeneratorResult();
  else renderEditor();
  renderInspector();
  renderPipelinePanel();
  renderStatusBar();
  restoreRenderedFocus(focusIdentity);
}
/* PL6: the panel names the stage that is incomplete, and only that stage.
   validatePipeline() is the assembler's own decision, per stage, so what this
   renders can never disagree with what assemblePipeline() did. */
/* PF6: a pure renderer gives every security rating one executable path.  It
   fails closed on an unknown value instead of manufacturing an unstyled class. */
function pipelineBlastBadge(blast){
  if(!inList(["green","yellow","red","unrated"],blast)) return "";
  return "<span class=\"sbadge b-"+escapeAttr(blast)+"\">"+esc(blast)+"</span>";
}
/* Replacing the focused pipeline row causes Chromium to emit a synchronous
   change event during the innerHTML assignment. That late event carries the
   same value already stored by the input event. Refuse its nested render so
   one node replacement completes before another begins. */
var pipelinePanelRendering=false;
function renderPipelinePanel(){
  if(pipelinePanelRendering) return;
  var target=el("pipeline-panel");
  if(!target) return;
  if(!STATE.pipeline.length){
    var cur=STATE.entryId?entryById(STATE.entryId):null;
    if(cur&&isGeneratorEntry(cur)){
      target.innerHTML="<div class=\"card\"><p class=\"region-label\">Pipeline</p>"+
        "<p class=\"muted\">Add this command as the first stage, then pick an operator and add "+
        "the next one. The operator is chosen from a fixed list this tool emits itself; there is "+
        "no field anywhere that accepts a pipe or a redirection as text.</p>"+
        "<div class=\"toolbar\"><button type=\"button\" class=\"btn\" data-pipe-action=\"add\">"+
        "Add to pipeline</button></div></div>";
      return;
    }
    if(cur){
      /* ADR-002, said out loud rather than by offering nothing. A reference or
         static entry carries a command as a STRING the vendor published; a
         stage must carry a TEMPLATE this assembler emits word by word, which is
         why isComposableSpec() refuses one STRUCTURALLY rather than a picker
         filtering it out. An operator who sees no button and no reason
         concludes the feature is broken and assembles the line by hand, which
         is the outcome the whole composer exists to prevent (PL6). */
      target.innerHTML="<div class=\"card\"><p class=\"region-label\">Pipeline</p>"+
        "<p class=\"muted\">This entry cannot be a pipeline stage. Its command is a quoted "+
        "vendor string, and joining two of those would produce a command the vendor never "+
        "published while the citation still said they did -- so the composer refuses it by "+
        "construction, not by hiding the button. Pick a guided form (a generator entry) to "+
        "build a pipeline.</p></div>";
      return;
    }
    target.innerHTML="";

  var v=validatePipeline(pipelineStages(),STATE.version,pipelineOpts());
  var html="<div class=\"card\"><p class=\"region-label\">Pipeline — "+
           esc(String(STATE.pipeline.length))+" of "+esc(String(MAX_PIPELINE_STAGES))+" stages</p>";
  html+="<div class=\"stagelist\">";
  for(var i=0;i<STATE.pipeline.length;i++){
    var row=STATE.pipeline[i];
    var d=v.stages[i]||{ok:true,reason:null};
    var rowEntry=row.entryId?entryById(row.entryId):null;
    html+="<div class=\""+(d.ok?"stagerow":"stagerow bad")+"\">";
    html+="<div class=\"stagehead\"><span class=\"stageno\">Stage "+esc(String(i+1))+
          (i===STATE.pipelineEditing?" — editing":"")+"</span>";
    html+=pipelineBlastBadge(d.blast);
    html+="</div>";
    if(i>0){
      html+="<div class=\"stageops\"><label for=\"pipeop-"+escapeAttr(String(i))+"\">joined by</label>";
      html+="<select id=\"pipeop-"+escapeAttr(String(i))+"\" data-pipe-field=\"op\" data-pipe-index=\""+
            escapeAttr(String(i))+"\" aria-label=\"Operator joining stage "+escapeAttr(String(i+1))+
            " to the stage before it\">";
      for(var k=0;k<PIPE_OPERATOR_KEYS.length;k++){
        var key=PIPE_OPERATOR_KEYS[k];
        html+="<option value=\""+escapeAttr(key)+"\""+(row.op===key?" selected":"")+">"+
              esc(PIPE_OPERATORS[key].emit)+"  —  "+esc(PIPE_OPERATORS[key].label)+"</option>";
      }
      html+="</select></div>";
    }
    if(row.kind==="redirect"){
      html+="<div class=\"stageops\"><label for=\"pipetgt-"+escapeAttr(String(i))+"\">file</label>";
      html+="<input type=\"text\" id=\"pipetgt-"+escapeAttr(String(i))+"\" data-pipe-field=\"target\" "+
            "data-pipe-index=\""+escapeAttr(String(i))+"\" maxlength=\"255\" "+
            "placeholder=\"absolute path\" value=\""+escapeAttr(row.target||"")+"\"></div>";
    }else if(row.kind==="operator"){
      html+="<span class=\"stagecmd\">"+esc(PIPE_OPERATORS[row.op]?PIPE_OPERATORS[row.op].emit:"")+
            "</span>";
    }else{
      html+="<span class=\"stagecmd\">"+esc(d.command||((rowEntry&&rowEntry.intent)||row.entryId||""))+
            "</span>";
      html+="<div class=\"stageops\">";
      if(i>0){
        html+="<label for=\"pipekind-"+escapeAttr(String(i))+"\">run</label>";
        html+="<select id=\"pipekind-"+escapeAttr(String(i))+"\" data-pipe-field=\"kind\" "+
              "data-pipe-index=\""+escapeAttr(String(i))+"\">";
        html+="<option value=\"command\""+(row.kind==="command"?" selected":"")+">directly</option>";
        html+="<option value=\"xargs\""+(row.kind==="xargs"?" selected":"")+">once per input line (xargs)</option>";
        html+="</select>";
      }
      if(row.kind==="xargs"){
        html+="<label><input type=\"checkbox\" data-pipe-field=\"nul\" data-pipe-index=\""+
              escapeAttr(String(i))+"\""+(row.xargs.nul?" checked":"")+"> -0 (NUL-delimited input)</label>";
        html+="<label><input type=\"checkbox\" data-pipe-field=\"replace\" data-pipe-index=\""+
              escapeAttr(String(i))+"\""+(row.xargs.replace?" checked":"")+
              "> -I (append one {} argument to the child command)</label>";
        html+="<label for=\"pipen-"+escapeAttr(String(i))+"\">-n</label>";
        html+="<input type=\"text\" id=\"pipen-"+escapeAttr(String(i))+"\" data-pipe-field=\"maxargs\" "+
              "data-pipe-index=\""+escapeAttr(String(i))+"\" maxlength=\"10\" placeholder=\"per run\" "+
              "value=\""+escapeAttr(row.xargs.maxArgs||"")+"\">";
      }
      html+="</div>";
    }
    if(!d.ok&&d.reason){
      html+="<p class=\"stagewhy\">Stage "+esc(String(i+1))+": "+esc(d.reason)+"</p>";
    }
    html+="<div class=\"stageops\">";
    if(row.kind==="command"||row.kind==="xargs"){
      html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"edit\" data-pipe-index=\""+
            escapeAttr(String(i))+"\">Edit fields</button>";
    }
    html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"up\" data-pipe-index=\""+
          escapeAttr(String(i))+"\""+(i===0?" disabled aria-disabled=\"true\"":"")+
          " aria-label=\"Move stage "+escapeAttr(String(i+1))+" earlier\">Move up</button>";
    html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"down\" data-pipe-index=\""+
          escapeAttr(String(i))+"\""+(i===STATE.pipeline.length-1?" disabled aria-disabled=\"true\"":"")+
          " aria-label=\"Move stage "+escapeAttr(String(i+1))+" later\">Move down</button>";
    html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"remove\" data-pipe-index=\""+
          escapeAttr(String(i))+"\" aria-label=\"Remove stage "+escapeAttr(String(i+1))+
          "\">Remove</button>";
    html+="</div></div>";
  }
  html+="</div>";
  if(!v.ok&&v.reason){
    html+="<p class=\"stagewhy\">"+esc(v.reason)+"</p>";
    html+="<p class=\"muted\">Nothing is assembled while a stage is incomplete. A half-formed "+
          "pipeline is worse than a blocked button, and this panel names the stage rather than "+
          "leaving you to find it.</p>";
  }
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"add\""+
        (STATE.pipeline.length>=MAX_PIPELINE_STAGES?" disabled aria-disabled=\"true\" title=\"A pipeline is capped so it stays reviewable\"":"")+
        ">Add current command as a stage</button>";
  html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"redirect\""+
        (STATE.pipeline.length>=MAX_PIPELINE_STAGES?" disabled aria-disabled=\"true\"":"")+
        ">Add a redirection</button>";
  html+="<button type=\"button\" class=\"btn\" data-pipe-action=\"clear\">Clear pipeline</button>";
  html+="</div></div>";
  pipelinePanelRendering=true;
  try{ target.innerHTML=html; }
  finally{ pipelinePanelRendering=false; }
}
/* The reference-tier editor pane. READ ONLY, by construction rather than by
   discipline: there is no form, no field, no template, no assembler call and no
   `res` object anywhere below. What is rendered is rec.c, escaped, and its
   citation. The one control is Copy, and it is held behind an acknowledgement
   (TM2-F5 -- see referenceCopyBlocked).

   The label is deliberately unmissable and deliberately repeated: this panel
   looks like the curated command panel, and the whole risk of the reference tier
   is an operator reading a mined line as though a human signed for it. */
function renderReferenceEditor(rec){
  var meta=refMeta();
  var rb=referenceBlast(rec.c,PATTERNS);
  var html="<div class=\"reftier-banner\" role=\"note\">";
  html+="<h2>Vendor reference &mdash; not host-verified, not assembled by this tool</h2>";
  html+="<p>This command was mined from vendor documentation. Nobody in this shop ran it, rated "+
        "it, wrote a verify step for it or wrote an undo step for it. It is shown because the "+
        "vendor published it, and for no other reason.</p>";
  html+="</div>";
  html+="<h2>"+esc(rec.t)+"</h2>";
  html+="<p class=\"muted\">tier "+esc(rec.tier)+" \u00b7 authority "+esc(rec.authority)+
        " \u00b7 licence "+esc(rec.license_class)+" \u00b7 blast "+esc(rb.blast)+
        " \u00b7 RHEL "+esc((rec.v||[]).join(", "))+"</p>";
  if(rb.blast==="unrated"){
    html+="<p class=\"muted\">Blast <strong>unrated</strong>: this command matches no pattern in "+
          "the destructive table, and that is not a finding that it is safe. Nobody rated it. A "+
          "curated entry says green only when a reviewer signed for it.</p>";
  }
  if(rec.trunc){
    html+="<p class=\"warn\">INCOMPLETE LINE. The vendor's own page wrapped and cut this "+
          "command, and this tool will not guess the rest. What is below is the beginning of a "+
          "command, not a command.</p>";
  }
  var lines=String(rec.c).split("\n");
  html+="<div class=\"codeblock reftier\" aria-label=\"Vendor reference command, read only\">";
  for(var i=0;i<lines.length;i++){
    html+="<div class=\"codeline\"><span class=\"ln\">"+esc(String(i+1))+
          "</span><span class=\"lc\">"+esc(lines[i])+"</span></div>";
  }
  html+="</div>";
  html+="<div class=\"blast\" role=\"alert\"><label><input type=\"checkbox\" data-action=\"ref-ack\""+
        (STATE.refAck?" checked":"")+"> I understand this is unverified vendor reference text</label>";
  var reasons=rb.reasons||[];
  for(var k=0;k<reasons.length;k++){
    html+="<p><strong>"+esc(reasons[k].label||reasons[k].id)+"</strong> &mdash; "+
          esc(reasons[k].why||"")+"</p>";
  }
  html+="</div>";
  var blocked=referenceCopyBlocked(STATE.refAck);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn\" data-action=\"ref-copy\""+
        (blocked?" aria-disabled=\"true\" disabled title=\"Tick the box to unlock copy\"":"")+
        ">Copy</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"ref-copy-comment\""+
         (blocked?" aria-disabled=\"true\" disabled title=\"Tick the box to unlock copy\"":"")+
         ">Copy with citation</button>";
  if(referenceEvidenceQuote(rec,meta)!==null){
    html+="<button type=\"button\" class=\"btn\" data-action=\"ref-evidence\""+
          (blocked?" aria-disabled=\"true\" disabled title=\"Tick the box to unlock evidence quotation\"":"")+
          ">Copy governing evidence quote</button>";
  }
  html+="</div>";
  html+="<p class=\"region-label\">Source</p><ul class=\"list\">";
  var occ=rec.o||[],m;
  for(m=0;m<occ.length;m++){
    html+="<li><p class=\"muted\">"+esc(refCitationLine(occ[m],meta))+"</p></li>";
  }
  html+="</ul>";
  if(rec.n&&rec.n>occ.length){
    html+="<p class=\"muted\">Cited "+esc(String(rec.n))+" times across the sources; the "+
          esc(String(occ.length))+" citations above are the ones this build carries.</p>";
  }
  if(rec.license_class==="cc-by-sa-3.0"){
    html+="<p class=\"muted\">"+esc(meta.guide_attribution||"")+". Reproduced under the Creative "+
          "Commons Attribution-Share Alike 3.0 Unported licence. See the About panel for the full "+
          "notice.</p>";
  }
  html+="<p class=\"muted\">Nothing on this panel is assembled. There is no verify step, no undo "+
        "step and no capture receipt, because this tier has none to give.</p>";
  el("editor-card").innerHTML=html;
}

function renderEditor(){
  var html="";
  if(STATE.rail==="favorites"){
    renderBlastBanner(null);
    renderHome();
    return;
  }
  if(STATE.rail==="about"){
    renderAbout();
    return;
  }
  if(STATE.refId){
    var refrec=refCommandById(STATE.refId);
    if(refrec){
      renderBlastBanner(null);
      renderReferenceEditor(refrec);
      return;
    }
  }
  renderBlastBanner(currentResult());
  if(!STATE.entryId){
    if(STATE.stigRuleId){
      html+="<div class=\"card\"><h2>"+esc(STATE.stigRuleId)+"</h2>"+
            "<p class=\"muted\">Opened from search. The check text, fix text and control mapping "+
            "are in the Inspector panel — this rule has no command in this build's "+
            "catalog to assemble.</p></div>";
      el("editor-card").innerHTML=html;
      return;
    }
    html+="<div class=\"card\"><h2>No command selected</h2><p class=\"muted\">Pick a tool from the sidebar, or press <code>/</code> to search. Copy is not rendered at all until a command is assembled — there is no dead control to tab through.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  var entry=entryById(STATE.entryId);
  if(!entry){
    html+="<div class=\"card\"><h2>Entry not found</h2><p class=\"muted\">This build's content island has no entry with that id. Nothing is guessed and nothing is rendered from raw text.</p></div>";
    el("editor-card").innerHTML=html;
    return;
  }
  if(isGeneratorEntry(entry)){
    renderGeneratorEditor(entry);
    return;
  }
  var res=currentResult();
  if(!res){
    if(STATE.pipeline.length){
      var pv=validatePipeline(pipelineStages(),STATE.version,pipelineOpts());
      html+="<div class=\"card\"><h2>Complete the pipeline</h2><p class=\"muted\">"+
            esc(pv.reason||"One or more pipeline stages are incomplete.")+"</p>"+
            "<p class=\"muted\">Use the pipeline panel to complete or remove the affected stage.</p></div>";

    var slot=(entry.rhel_versions||{})[STATE.version]||{};

    var alt=(slot.unavailable&&slot.unavailable.alternative)||"";
    html+="<div class=\"card\"><h2>"+esc(GATED_COPY+STATE.version)+"</h2>";
    html+="<p class=\"muted\">"+esc(why||"This entry has no command for the selected release, so no command is assembled and nothing can be copied.")+"</p>";
    if(alt) html+="<p class=\"muted\">Alternative: "+esc(alt)+"</p>";
    html+="</div>";
    el("editor-card").innerHTML=html;
    return;
  }
  html+="<p class=\"taskcrumb\">Build / "+esc(res.stages?"pipeline":entry.tool)+" / "+
        esc(res.stages?"composed command":"reviewed command")+"</p>";
  html+="<h2 class=\"tasktitle\" tabindex=\"-1\">"+esc(res.stages?resultSubject(res,entry):(entry.intent||entry.id))+"</h2>";
  html+="<div class=\"workflowsteps\" aria-label=\"Task stages\"><span>1 Configure</span><span>2 Review</span><span>3 Verify</span></div>";
  var subjA=resultSubject(res,entry),privA=resultPrivilege(res,entry);
  var riskLabelA=res.blast==="green"?"Low impact":(res.blast==="yellow"?"Changes system":"Destructive");
  var vstatusA=verificationStatusForResult(res,entry,res.version);
  html+="<div class=\"trustbar\"><span class=\"trustfact risk-"+escapeAttr(res.blast)+"\">"+esc(riskLabelA)+"</span>"+
        "<span class=\"trustfact\">RHEL "+esc(res.version)+"</span><span class=\"trustfact\">"+esc(vstatusA.label)+"</span>";
  if(privA) html+="<span class=\"trustfact\">requires "+esc(privA)+"</span>";
  if(res.resolved_from) html+="<span class=\"trustfact\">same as RHEL "+esc(res.resolved_from)+"</span>";
  html+="</div>";
  html+="<p class=\"muted\">"+esc(subjA)+(res.stages?" · composed workflow":" · reviewed task")+"</p>";
  var lines=String(res.command).split("\n");
  html+="<div class=\"codeblock\" aria-label=\"Assembled command\">";
  for(var i=0;i<lines.length;i++){
    html+="<div class=\"codeline\" role=\"button\" tabindex=\"0\" data-line=\""+escapeAttr(String(i))+
          "\" aria-current=\""+(i===STATE.line?"true":"false")+
          "\" aria-label=\"Line "+escapeAttr(String(i+1))+"\"><span class=\"ln\">"+esc(String(i+1))+
          "</span><span class=\"lc\">"+esc(lines[i])+"</span></div>";
  }
  html+="</div>";
  var blocked=(res.blast==="red"&&!STATE.acked);
  html+="<div class=\"toolbar\">";
  html+="<button type=\"button\" class=\"btn primaryaction\" data-action=\"copy\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy command</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"copy-comment\""+(blocked?" aria-disabled=\"true\" disabled title=\"Tick the review box to unlock copy\"":"")+">Copy with comment</button>";
  html+="<button type=\"button\" class=\"btn\" data-action=\"export-evidence\">Export command and control reference</button>";
  if(!res.stages){
    html+="<button type=\"button\" class=\"favbtn\" data-action=\"fav-toggle\" data-favid=\""+
          escapeAttr(entry.id)+"\" aria-pressed=\""+(isFavorite(entry.id)?"true":"false")+"\">"+
          (isFavorite(entry.id)?"Favorited":"Favorite")+"</button>";
  }
  html+="</div>";
  /* threat-model-v1 §9: what is in the preview is exactly and only what gets
     copied. The comment header used to be built at click time and never shown;
     it is rendered here, escaped, from the same res.copy_comment string that
     doCopy() puts on the clipboard (MCR-SEC-003). */
  if(res.copy_comment){
    html+="<p class=\"region-label\">Copy with comment — exactly what reaches the clipboard</p>";
    html+="<pre class=\"copypreview\" aria-label=\"Clipboard preview for Copy with comment\">"+
          esc(res.copy_comment)+"</pre>";
  }
  if(res.notes) html+="<p class=\"muted\">"+esc(res.notes)+"</p>";
  if(res.stages){
    html+="<p class=\"muted\">This composed workflow has no single Verify or Undo receipt. Review every stage in the Inspector and verify each stage on the target host.</p>";
  }else{
    html+="<p class=\"muted\">Verify: "+esc(entry.verify||"")+"</p>";
    html+="<p class=\"muted\">Undo: "+esc(entry.undo||"")+"</p>";
  }
  el("editor-card").innerHTML=html;
}

/* ============ generator form renderer (CR-T-17..25, ADR-001 §8 module 5) ====
   Builds the SIDEBAR-of-the-editor form from a generator's fields[] — marks
   required fields per UI spec §4 (*, "(required)" in the label text, never
   colour alone, aria-required), and renders a version-gated field disabled +
   aria-disabled + aria-describedby pointing at the reason, exactly like a
   gated tool or entry row. The form frame (this function) is rebuilt only on
   entry selection and on a RHEL version change — never on a keystroke, so
   typing never loses focus; renderGeneratorResult() below is the part that
   redraws on every keystroke, into its own #gen-result sink. */
/* One accumulator, inline, exactly like every other renderer in this file —
   deliberately NOT split into a per-field helper that RETURNS an HTML string:
   Q17's audit only trusts a segment reaching a sink if it is a string
   literal, one of esc()/escapeAttr()/escapeRegex(), or an accumulator this
   gate derived from assignments in THIS file — a bare call to a helper
   function is none of those, so the helper's returned markup would be an
   unaudited segment no matter how carefully the helper itself escapes it. */
function renderGeneratorForm(entry){
  var html="<p class=\"region-label\">Essential fields</p><p class=\"muted\">Configure the operation. The command preview updates without rebuilding these controls.</p>";
  var fields=entry.fields||[];
  for(var i=0;i<fields.length;i++){
    var field=fields[i];
    var name=field.name;
    var val=STATE.formValues[name]!==undefined?STATE.formValues[name]:"";
    var gated=!fieldAvailable(field,STATE.version);
    var id="genf-"+entry.id+"-"+name;
    var teaching=fieldInstruction(entry,name);
    html+="<div class=\"field\"><label for=\""+escapeAttr(id)+"\">"+esc((teaching&&teaching.label)||field.label||name);
    if(field.required){ html+=" <span class=\"req\">*</span> (required)"; }
    else{ html+=" (optional)"; }
    html+="</label>";
    if(teaching){
      html+="<div class=\"fieldhelp\"><p>"+esc(teaching.meaning)+"</p>";
      html+="<details><summary>Why this field?</summary>"+
            "<p><strong>Example:</strong> "+esc(teaching.example===null?"No curated example.":teaching.example)+"</p>"+
            "<p><strong>Discover:</strong> "+esc(teaching.discovery_command===null?
            "No discovery command has been curated; consult the cited source.":teaching.discovery_command)+"</p>"+
            "<p><strong>Consequence:</strong> "+esc(teaching.consequence)+"</p></details></div>";
    }
    if(gated){
      html+="<input type=\"text\" id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
            "\" disabled aria-disabled=\"true\" aria-describedby=\""+escapeAttr(id)+"-why\" value=\"\">";
      html+="<p class=\"why\" id=\""+escapeAttr(id)+"-why\">"+esc(GATED_COPY+STATE.version)+"</p>";
      html+="</div>";
      continue;
    }
    /* A checkbox is a presentation of one existing closed enum shape: the
       checked value is the spec's sole literal "yes" option, while unchecked
       means the optional field is absent. No boolean or DOM value enters the
       assembler, and content cannot choose an arbitrary checkbox payload. */
    if(field.control==="checkbox"){
      html+="<input type=\"checkbox\" id=\""+escapeAttr(id)+"\" data-field=\""+
            escapeAttr(name)+"\" value=\"yes\""+(val==="yes"?" checked":"")+
            " aria-required=\"false\"></div>";
      continue;
    }
    /* type "enum" is the author-curated closed set (field.options); a handful
       of built-in FIELD_TYPES are ALSO closed sets (protocol/family/action)
       with their enum baked into the type itself — both render a <select>,
       neither makes the operator type a value the assembler would just as
       happily have offered as a choice. */
    var builtinEnum=(FIELD_TYPES[field.type]||{}).enums;
    if(field.type==="enum"||builtinEnum){
      html+="<select id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
            "\" aria-required=\""+(field.required?"true":"false")+"\">";
      html+="<option value=\"\">(choose)</option>";
      var opts=field.type==="enum"?(field.options||[]):builtinEnum;
      for(var j=0;j<opts.length;j++){
        var o=opts[j];
        var ov=(typeof o==="string")?o:o.value;
        var optGated=(typeof o!=="string")&&o.versions&&!inList(o.versions,STATE.version);
        html+="<option value=\""+escapeAttr(ov)+"\"";
        if(ov===val){ html+=" selected"; }
        if(optGated){ html+=" disabled"; }
        html+=">"+esc(ov);
        if(optGated){ html+=" ("+esc(GATED_COPY+STATE.version)+")"; }
        html+="</option>";
      }
      html+="</select></div>";
      continue;
    }
    html+="<input type=\"text\" id=\""+escapeAttr(id)+"\" data-field=\""+escapeAttr(name)+
          "\" aria-required=\""+(field.required?"true":"false")+"\" maxlength=\""+
          escapeAttr(String((FIELD_TYPES[field.type]||{}).cap||200))+"\" placeholder=\""+
          escapeAttr(teaching&&teaching.example?teaching.example:((FIELD_TYPES[field.type]||{}).label||field.type))+"\" value=\""+
          escapeAttr(val)+"\"></div>";
  }
  el("gen-fields").innerHTML=html;
}
/* Fills #gen-result — the assembled command, the toolbar, the clipboard
   preview, verify/undo/notes — from the SAME currentResult() every other
   region reads (MCR-SEC-012). Runs on every keystroke; never touches the
   fields above it, so a text input never loses focus mid-word. */
function renderGeneratorResult(){
  var entry=STATE.entryId?entryById(STATE.entryId):null;
  var target=el("gen-result");
  if(!entry||!target) return;
  var res=currentResult();
  renderBlastBanner(res);
  var html="";
  if(!res){
    if(STATE.pipeline.length){
      var pipelineValidation=validatePipeline(pipelineStages(),STATE.version,pipelineOpts());
      html+="<div class=\"card\"><h2>Complete the pipeline</h2><p class=\"muted\">"+
            esc(pipelineValidation.reason||"One or more pipeline stages are incomplete.")+"</p>"+
            "<p class=\"muted\">Use the pipeline panel to complete or remove the affected stage.</p></div>";
      target.innerHTML=html;
      return;
    }
    if(entry.versions && !inList(entry.versions,STATE.version)){
      html+="<div class=\"card\"><h2>"+esc(GATED_COPY+STATE.version)+"</h2>"+
            "<p class=\"muted\">This generator is not offered on RHEL "+esc(STATE.version)+
            ".</p></div>";
    }else{
      var v=validateSpec(entry,STATE.version,STATE.formValues);
      html+="<div class=\"card\"><h2>Fill in the required fields</h2>";
      if(v.missing.length){
        html+="<p class=\"muted\">Still needed: "+esc(v.missing.join(", "))+"</p>";
      }
      for(var i=0;i<v.invalid.length;i++){
        html+="<p class=\"muted\">"+esc(v.invalid[i].name)+": "+esc(v.invalid[i].reason)+"</p>";
      }
      html+="<p class=\"muted\">Copy is not rendered at all until a complete command is "
            +"assembled — there is no dead control to tab through.</p></div>";
    }
    target.innerHTML=html;
    return;
  }
  var subjG=resultSubject(res,entry),privG=resultPrivilege(res,entry);
  var riskLabelG=res.blast==="green"?"Low impact":(res.blast==="yellow"?"Changes system":"Destructive");
  var vstatusG=verificationStatusForResult(res,entry,res.version);
  html+="<p class=\"region-label\">Command preview</p><div class=\"trustbar\"><span class=\"trustfact risk-"+escapeAttr(res.blast)+"\">"+
        esc(riskLabelG)+"</span><span class=\"trustfact\">RHEL "+esc(res.version)+"</span>"+
        "<span class=\"trustfact\">"+esc(vstatusG.label)+"</span>";
