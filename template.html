<!--
  ============================================================================
  Tool:               __APP_NAME__ — RHEL Admin Toolkit
  Version:            __VERSION__
  Last modified:      __BUILT_DATE__
  Classification:     __CLASSIFICATION__
  Content fingerprint (SHA-256 of every data island): __CONTENT_FINGERPRINT__
  Air-gap certified:  YES — zero network calls, zero external assets, one file.
  ----------------------------------------------------------------------------
  Built by build.py from template.html + content/. Never patched by hand:

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>__APP_NAME__ __VERSION__</title>
<style>
/* ---- theme tokens: UI spec v1 §6. Light on :root, dark re-declared twice so
       an explicit choice wins in both directions and prefers-color-scheme
       resolves the default at first paint with no flash of the wrong theme. -- */
:root{
  --bg-app:#fafafa; --bg-surface:#ffffff; --bg-editor:#f6f8fa; --bg-gutter:#eef1f6;
  --text-primary:#27272a; --text-secondary:#51607a; --text-muted:#8494ab;
  --accent:#b45309; --success:#059669; --warning:#b45309; --danger:#dc2626;
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.06);
  --badge-info:#3730a3; --border-primary:#d4d4d8; --focus-ring:#f59e0b;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* --rail-w was 48px (icon-only, label revealed on hover/focus). Problem 3
     (2026-09-17): the rail now shows its label text unconditionally, so the
     column needs to be wide enough for "Command Builder" at 12px, not just
     one glyph — see .railbtn/.railbtn .lbl. */
  --rail-w:160px; --sidebar-w:240px; --inspector-w:320px; --statusbar-h:28px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
    --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#71717a;
    --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
    --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
    --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
  }
}
:root[data-theme="dark"]{
  --bg-app:#09090b; --bg-surface:#18181b; --bg-editor:#0a0e15; --bg-gutter:#0d1119;
  --text-primary:#d4d4d8; --text-secondary:#a1a1aa; --text-muted:#71717a;
  --accent:#f59e0b; --success:#10b981; --warning:#eab308; --danger:#ef4444;
  --badge-critical:#dc2626; --badge-critical-fill:rgba(220,38,38,.08);
  --badge-info:#6366f1; --border-primary:#27272a; --focus-ring:#fbbf24;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg-app); color:var(--text-primary);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  display:grid; grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) var(--inspector-w);
  grid-template-rows:minmax(0,1fr) var(--statusbar-h);
  grid-template-areas:"rail sidebar editor inspector" "status status status status";
}
body[data-sidebar="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) var(--inspector-w);}
body[data-inspector="off"]{grid-template-columns:var(--rail-w) var(--sidebar-w) minmax(0,1fr) 0;}
body[data-sidebar="off"][data-inspector="off"]{grid-template-columns:var(--rail-w) 0 minmax(0,1fr) 0;}
body[data-sidebar="off"] #sidebar,body[data-inspector="off"] #inspector{display:none;}
@media (max-width:1024px){
  body{
    grid-template-columns:var(--rail-w) 200px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 220px var(--statusbar-h);
    grid-template-areas:"rail sidebar editor" "rail sidebar inspector" "status status status";
  }
}
/* Never outline:none without a replacement (UI spec §6) — :focus is the ESR
   fallback for engines that predate :focus-visible. */
:focus{outline:2px solid var(--focus-ring); outline-offset:1px;}
:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
#rail{grid-area:rail; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  display:flex; flex-direction:column; align-items:stretch; gap:2px; padding:6px 6px;}
#sidebar{grid-area:sidebar; background:var(--bg-surface); border-right:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#editor{grid-area:editor; background:var(--bg-editor); overflow:auto; padding:14px 16px; min-width:0;}
#inspector{grid-area:inspector; background:var(--bg-surface); border-left:1px solid var(--border-primary);
  overflow:auto; padding:10px;}
#statusbar{grid-area:status; background:var(--bg-surface); border-top:1px solid var(--border-primary);
  display:flex; align-items:center; gap:10px; padding:0 10px; font-size:12px;
  color:var(--text-secondary); overflow:hidden; white-space:nowrap;}
#palette[hidden]{display:none;}
#palette{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
  align-items:flex-start; justify-content:center; padding-top:12vh; z-index:50;}
#palette>.panel{background:var(--bg-surface); border:1px solid var(--border-primary);
  border-radius:8px; width:min(640px,92vw); padding:12px;}
#palette input{width:100%; padding:7px 9px; font:inherit; color:var(--text-primary);
  background:var(--bg-editor); border:1px solid var(--border-primary); border-radius:5px;}
.region-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 8px;}
.railbtn{position:relative; width:100%; height:34px; border:1px solid transparent; border-radius:6px;
  background:transparent; color:var(--text-secondary); font-family:var(--font-mono);
  font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; padding:0 8px;
  text-align:left;}
.railbtn:hover{border-color:var(--border-primary); color:var(--text-primary);}
.railbtn[aria-current="true"]{border-color:var(--accent); color:var(--accent);}
/* Founder alpha feedback (2026-09-17), problem 3: "the left rail's icons [...]
   read as bare symbols with no meaning." The glyph (">", "$", etc.) and the
   aria-label/title always named each rail item, but .lbl used to sit
   absolutely positioned with opacity:0, shown only on :hover/:focus — so a
   sighted mouse user saw nothing but the bare glyph until they happened to
   point at it. The label is now ordinary, always-visible button content,
   laid out next to the glyph instead of overlaid on hover; the glyph keeps
   its fixed width so every row's label still lines up in a column. */
.railbtn .glyph{display:inline-block; width:16px; text-align:center; flex:none;}
.railbtn .lbl{font-family:var(--font-ui); font-size:12px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;}
.seg{display:flex; gap:4px; margin:0 0 10px;}
.seg button{flex:1; padding:4px 0; border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; cursor:pointer;}
.seg button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600;}
.card{border:1px solid var(--border-primary); border-radius:8px; background:var(--bg-surface);
  padding:12px 14px; margin:0 0 12px;}
.card h2{margin:0 0 6px; font-size:15px;}
.muted{color:var(--text-muted);}
code,pre{font-family:var(--font-mono);}
.statusitem{display:inline-flex; align-items:center; gap:5px;}
.statusitem+.statusitem::before{content:"\00b7"; color:var(--text-muted); margin-right:5px;}
.themebtn{margin-left:auto; border:1px solid var(--border-primary); border-radius:5px;
  background:transparent; color:var(--text-secondary); font:inherit; font-size:12px;
  padding:1px 8px; cursor:pointer;}
.toast{color:var(--accent); font-weight:600;}
/* list rows — tools, entries, palette results. Arrow keys move between them. */
.list{list-style:none; margin:0 0 12px; padding:0;}
.list li{margin:0 0 2px;}
.row{display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:5px;
  background:transparent; color:var(--text-primary); font:inherit; padding:4px 7px; cursor:pointer;}
.row:hover{border-color:var(--border-primary);}
.row[aria-current="true"]{border-color:var(--accent); color:var(--accent);}
.row[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed; border-style:dashed;
  border-color:var(--border-primary);}
.row .why{display:block; font-size:11px; color:var(--text-muted);}
/* editor code block: gutter column + monospace lines */
.codeblock{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  overflow-x:auto; margin:0 0 12px;}
.codeline{display:flex; align-items:flex-start; font-family:var(--font-mono); font-size:13px;}
.codeline:focus{outline-offset:-2px;}
.codeline .ln{flex:0 0 42px; text-align:right; padding:2px 8px 2px 0; color:var(--text-muted);
  background:var(--bg-gutter); border-right:1px solid var(--border-primary);
  user-select:none; -webkit-user-select:none;}
.codeline .lc{padding:2px 10px; white-space:pre; color:var(--text-primary);}
.codeline[aria-current="true"] .lc{color:var(--accent);}
/* read-only preview of the clipboard payload — threat-model-v1 §9: what is in
   the preview is exactly and only what gets copied (MCR-SEC-003) */
.copypreview{border:1px solid var(--border-primary); border-radius:6px; background:var(--bg-editor);
  color:var(--text-muted); font-family:var(--font-mono); font-size:12px; line-height:1.5;
  padding:8px 10px; margin:0 0 12px; overflow-x:auto; white-space:pre;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px;}
.btn{border:1px solid var(--border-primary); border-radius:5px; background:var(--bg-surface);
  color:var(--text-primary); font:inherit; font-size:13px; padding:4px 11px; cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn[disabled],.btn[aria-disabled="true"]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
/* red blast banner — role="alert", never colour alone, holds Copy until acked */
.blast{border:2px solid var(--danger); border-radius:6px; padding:10px 12px; margin:0 0 12px;
  background:var(--badge-critical-fill);}
.blast h2{color:var(--danger); font-size:14px; margin:0 0 4px;}
.blast label{display:block; margin-top:8px; font-size:13px;}
.badge{display:inline-block; border:1px solid var(--badge-info); border-radius:999px;
  padding:0 8px; font-size:11px; margin:0 5px 5px 0; color:var(--text-primary);}
.badge.cat1{border-color:var(--badge-critical); background:var(--badge-critical-fill); color:var(--danger);}
.badge.cat2{border-color:var(--danger); color:var(--danger);}
.badge.cat3{border-color:var(--warning); color:var(--warning);}
.badge.privilege{border-color:var(--warning); color:var(--warning); margin-left:6px;}
/* Per-version verification status (CEO ruling: verified is per-version, not
   per-entry — capture-review-run1-2026-09-18.md RILEY-F1). Three states only,
   never a free color: a real {by,on,host,capture} receipt (verified), a
   capture with no receipt yet (captured, awaiting QA), or neither
   (not host-verified). See verificationStatusForVersion(). */
.vbadge{display:inline-block; border-radius:999px; padding:0 8px; font-size:11px;
  margin-left:6px; border:1px solid var(--border-primary); color:var(--text-secondary);}
.vbadge.v-verified{border-color:var(--success); color:var(--success);}
.vbadge.v-captured{border-color:var(--warning); color:var(--warning);}
.vbadge.v-unverified{color:var(--text-muted);}
.flagrow{border-top:1px solid var(--border-primary); padding:6px 0;}
.flagrow .tok{font-family:var(--font-mono); font-size:12px; color:var(--accent);}
.flagrow .mean{display:block; font-size:12px; color:var(--text-secondary);}
.unverified{color:var(--text-muted); font-style:italic;}
/* generator guided-form fields (CR-T-17..25) — required/optional/version-gated
   states per UI spec v1 §4: required carries a coloured mark and "(required)"
   in the label text (never colour alone), a gated field is disabled with its
   reason in a .why line, exactly like a gated tool/entry row above. */
.field{display:flex; flex-direction:column; gap:3px; margin:0 0 10px;}
.field label{font-size:12px; color:var(--text-secondary);}
.field .req{color:var(--danger);}
.field input,.field select{font:inherit; font-size:13px; padding:4px 7px;
  border:1px solid var(--border-primary); border-radius:5px;
  background:var(--bg-app); color:var(--text-primary);}
.field input[disabled],.field select[disabled]{color:var(--text-muted); cursor:not-allowed;
  border-style:dashed;}
.field .why{margin:0; font-size:11px; color:var(--text-muted);}
/* ---- CR-T-26 STIG panel ---- */
#stig-panel:empty{display:none;}
.stigcard{border:1px solid var(--border-primary); border-radius:8px; margin:0 0 12px; padding:10px 12px;}
.stigcard h3{margin:0 0 6px; font-size:13px;}
.stigtext{white-space:pre-wrap; word-break:break-word; background:var(--bg-editor);
  border:1px solid var(--border-primary); border-radius:5px; padding:6px 8px;
  margin:4px 0 0; font-size:12px; max-height:260px; overflow:auto;}
.stigcard summary{cursor:pointer; font-size:12px; color:var(--accent); margin:6px 0 0;}
.sunsetbanner{border:1px solid var(--warning); border-radius:6px; padding:6px 8px;
  margin:0 0 8px; font-size:12px; color:var(--warning);}
.changednote{border-left:3px solid var(--badge-info); padding:2px 0 2px 8px;
  margin:6px 0 0; font-size:12px; color:var(--text-secondary);}
.nocaptureyet{font-size:12px; font-style:italic; color:var(--text-muted); margin:6px 0 0;}
/* ---- CR-T-29 palette result groups ---- */
.palettegroup{font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); margin:8px 0 2px; padding:0 2px;}
.palettegroup:first-child{margin-top:0;}
.palettetiming{font-size:11px; color:var(--text-muted); margin:6px 0 0;}
/* ---- CR-T-28 evidence exporter ---- */
#evidence-modal[hidden]{display:none;}
#evidence-modal{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
  align-items:flex-start; justify-content:center; padding-top:6vh; z-index:60;}
#evidence-modal>.panel{background:var(--bg-surface); border:1px solid var(--border-primary);
  border-radius:8px; width:min(760px,94vw); max-height:86vh; overflow:auto; padding:14px;}
.evidencepre{white-space:pre-wrap; word-break:break-word; background:var(--bg-editor);
  border:1px solid var(--border-primary); border-radius:6px; padding:10px 12px;
  font-size:12px; margin:8px 0;}
/* ---- CR-T-30 favorites, recent, about ---- */
.favbtn{border:1px solid var(--border-primary); border-radius:5px; background:transparent;
  color:var(--text-secondary); font:inherit; font-size:12px; padding:1px 8px; cursor:pointer;}
.favbtn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent);}
.aboutblock{border-left:3px solid var(--border-primary); padding:2px 0 2px 10px;
  margin:0 0 12px; font-size:12px; white-space:pre-wrap;}
@media print{
  body{display:block;}
  #rail,#sidebar,#inspector,#statusbar,#palette,#evidence-modal{display:none;}
  #editor{background:none; color:#000;}
  .codeline .ln{background:none;}
  .print-only{display:block !important;}
}
.print-only{display:none;}
</style>
</head>
<body data-sidebar="on" data-inspector="on">

<!-- RAIL — activity rail. Founder alpha feedback (2026-09-17): the glyph plus
     label is now always visible, not revealed only on hover/focus (UI spec §2
     as amended, problem 3) -- see .railbtn/.railbtn .lbl in the stylesheet. -->
<nav id="rail" role="navigation" aria-label="Activity rail">
  <button type="button" class="railbtn" data-rail="builder" aria-label="Command Builder" title="Command Builder (Ctrl+Alt+1)"><span class="glyph" aria-hidden="true">&gt;</span><span class="lbl">Command Builder</span></button>
  <button type="button" class="railbtn" data-rail="stig" aria-label="STIG and Evidence Search" title="STIG and Evidence Search (Ctrl+Alt+2)"><span class="glyph" aria-hidden="true">$</span><span class="lbl">STIG Search</span></button>
  <button type="button" class="railbtn" data-rail="ansible" aria-label="Ansible Generator" title="Ansible Generator (Ctrl+Alt+3)"><span class="glyph" aria-hidden="true">Y</span><span class="lbl">Ansible</span></button>
  <button type="button" class="railbtn" data-rail="favorites" aria-label="Favorites and Recent" title="Favorites and Recent (Ctrl+Alt+4)"><span class="glyph" aria-hidden="true">*</span><span class="lbl">Favorites</span></button>
  <button type="button" class="railbtn" data-rail="reference" aria-label="Reference Commands" title="Reference Commands (Ctrl+Alt+5)"><span class="glyph" aria-hidden="true">?</span><span class="lbl">Reference</span></button>
  <button type="button" class="railbtn" data-rail="about" aria-label="About" title="About (Ctrl+Alt+6)"><span class="glyph" aria-hidden="true">i</span><span class="lbl">About</span></button>
</nav>

<!-- SIDEBAR — context panel for the active rail tool -->
<aside id="sidebar" role="complementary" aria-label="Sidebar">
  <p class="region-label">RHEL version</p>
  <div class="seg" id="version-seg" role="group" aria-label="RHEL version selector"></div>
  <div id="sidebar-body"><p class="muted">Reading the embedded content island.</p></div>
</aside>

<!-- EDITOR — the generated command, with gutter -->
<main id="editor" role="main" aria-label="Editor">
  <div id="blast-banner"></div>
  <div class="card" id="editor-card" aria-live="polite" aria-atomic="false">
    <h2>Loading</h2>
    <p class="muted" id="editor-empty">Reading the embedded content island.</p>
  </div>
  <!-- print view (CR-T-30, UI spec §4): the screen's STIG panel lives in
       #inspector, which @media print hides along with the rest of the chrome.
       renderStigPanel() writes the SAME content here, in a separate statement,
       as its own audited sink (Q17), so what prints is the current entry plus
       its STIG panel and nothing else — no external resources, no chrome. -->
  <div id="print-stig-panel" class="print-only"></div>
</main>

<!-- INSPECTOR — flag explanations, badges, provenance -->
<aside id="inspector" role="complementary" aria-label="Inspector">
  <p class="region-label">Inspector</p>
  <!-- CR-T-26: renderStigPanel() owns this sink exclusively. -->
  <div id="stig-panel"></div>
  <div id="inspector-body"><p class="muted">Flag-by-flag explanations render here.</p></div>
</aside>

<!-- STATUSBAR — version state, pinned STIG releases, tool version -->
<footer id="statusbar" role="contentinfo" aria-label="Status bar"></footer>

<!-- PALETTE — command palette overlay (/ or Ctrl/Cmd+K) -->
<div id="palette" role="dialog" aria-modal="true" aria-label="Command palette" hidden>
  <div class="panel">
    <label class="region-label" for="palette-input">Search tools and commands</label>
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
           aria-controls="palette-results" aria-describedby="palette-help"
           placeholder="Tool name or command intent">
    <p class="region-label" id="palette-help">Up and down arrows move, Enter opens, Esc closes</p>
    <div id="palette-results"></div>
  </div>
</div>

<!-- EVIDENCE MODAL — CR-T-28. exportEvidence() owns this sink exclusively; the
     <pre> here is the SAME string doCopy()'s clipboard rule requires: what is
     previewed is exactly and only what a Copy button on this panel copies
     (threat-model-v1 §9, MCR-SEC-003's rule applied to the exporter). -->
<div id="evidence-modal" role="dialog" aria-modal="true" aria-label="Export as evidence" hidden>
  <div class="panel" id="evidence-modal-body"></div>
</div>

<script id="mcr-data" type="application/json">/*__DATA__*/</script>
<!-- THE REFERENCE CORPUS. Four more JSON islands, and NOT ONE of them is parsed
     at boot (Al Kowalski's ruling: lazy per-family, per-tier hydration is
     mandatory past 5,000 corpus records, and the inverted index lands before the
     second family does; this tranche is 14,488 records across three families).

     mcr-ref-index is the build-time inverted index: token -> posting list. The
     palette parses it on the first keystroke and uses it to decide which
     families a query can possibly hit. Each mcr-ref-FAMILY island holds that
     family's records alone, and is parsed the first time something actually
     needs one -- so a search that only matches DISA text never pays for the
     4.1 MB of Red Hat documentation, and an operator who never opens the
     Reference rail never pays for any of it.

     They are separate ELEMENTS rather than strings inside mcr-data on purpose:
     JSON-escaping the families into the main island measured 32.8% larger, and
     it would hide them from qa.py, the test harnesses and anyone reading the
     shipped file. build.py's ISLANDS list is the one declaration of this set,
     and qa.py Q1 names the same set and proves each one parses.

     No element name is spelled out anywhere in this comment: Q1 counts script
     elements with a regular expression over the raw file, which cannot tell
     markup from a comment describing markup, and a comment that mentions the
     tag by name adds a phantom element to that count. -->

<script id="mcr-ref-index" type="application/json">/*__REF_INDEX__*/</script>
<script id="mcr-ref-stig_rules" type="application/json">/*__REF_STIG_RULES__*/</script>
<script id="mcr-ref-raw_captures" type="application/json">/*__REF_RAW_CAPTURES__*/</script>
<script id="mcr-ref-redhat_guides" type="application/json">/*__REF_REDHAT_GUIDES__*/</script>
<script>
"use strict";
(function(){
/* ============ old-browser polyfills (ESR-era Firefox on air-gapped boxes) ============ */
if(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach=Array.prototype.forEach;
if(!Element.prototype.matches) Element.prototype.matches=Element.prototype.msMatchesSelector||Element.prototype.webkitMatchesSelector;
if(!Element.prototype.closest) Element.prototype.closest=function(s){var n=this;while(n&&n.nodeType===1){if(n.matches(s))return n;n=n.parentElement||n.parentNode;}return null;};

/* ============ identity constants (qa.py checks these against build.py) ============ */
var APP_NAME="__APP_NAME__";
var APP_VERSION="__VERSION__";
var APP_BUILD_DATE="__BUILT_DATE__";
var APP_CLASSIFICATION="__CLASSIFICATION__";
/* CR-T-28/CR-T-30. sha256 of the data island, computed by build.py BEFORE the
   island is substituted into this file (never a hash of a string containing
   itself) and embedded here as a plain constant, exactly like the four above
   it. qa.py Q1 re-hashes the shipped island and checks it against this
   constant independently. */
var CONTENT_FINGERPRINT="__CONTENT_FINGERPRINT__";
var RHEL_VERSIONS=["7","8","9","10"];
/* Founder alpha feedback (2026-09-17): the version selector opened on RHEL 9,

  var NS="mdcr.v1.";

   name, and the dual-key refusal means `tok.flag` here can only belong to a
   field or a rich rule. */
function isPositionalToken(tok){
  if(!tok || tok.flag) return false;
  if(tok.field!==undefined && tok.field!==null) return true;
  if(tok.lit===undefined || tok.lit===null) return false;
  if(FLAG_TOKEN_RE.test(String(tok.lit))) return false;    /* option-shaped lit: an OPTION */
  return tok.requires!==undefined && tok.requires!==null;
}
/* The shift rule, stated once. A positional token at index `at` is about to
   vanish: does any positional token AFTER it survive? If one does, argument n+1
   is promoted into slot n and the only honest answer is null. Both callers — the
   conditional lit (MCR-SEC-013) and the droppable field token (MCR-SEC-002) —
   ask this same question, because it is the same question. */
function laterPositionalSurvives(spec,version,resolved,at){
  for(var j=at+1;j<spec.template.length;j++){
    if(!isPositionalToken(spec.template[j])) continue;
    if(tokenPresent(spec,version,resolved,spec.template[j])) return true;
  }
  return false;
}

/* validateSpec() is the UI's window into the same decision assembleCommand()
   makes, so the form can say WHICH field is wrong without the assembler ever
   returning a partially built command to explain itself with. */
function validateSpec(spec,version,values){
  var out={ok:true,missing:[],invalid:[],gated:[],resolved:{}};
  var fields=(spec&&spec.fields)||[];
  values=values||{};
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    if(!fieldAvailable(f,version)){
      out.gated.push(f.name);
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;                                   /* gated out: cannot contribute */
    }
    var raw=values[f.name];
    var supplied=!(raw===null||raw===undefined||raw==="");
    if(!supplied){
      if(f.required){ out.ok=false; out.missing.push(f.name); }
      continue;
    }
    var probe=f;
    if(f.type==="enum"){ probe={name:f.name,type:f.type,options:f.options,_version:version}; }
    var r=validateField(f.type,raw,probe);
    if(!r.ok){
      out.ok=false;
      out.invalid.push({name:f.name,reason:r.reason});
      continue;                                   /* an invalid OPTIONAL value is still
                                                     a refusal: never silently dropped */
    }
    out.resolved[f.name]=r.value;
  }
  return out;
}

/* firewalld rich rules are composed from independently validated sub-fields and
   trusted literal syntax — never by concatenating one free-text box into the
   command line (threat-model-v1 §3.1, highest-risk field class).

   MCR-SEC-001. The comment that used to stand here argued that no validated
   value can contain a double quote "because no field type's allow-list admits
   one". That was FALSE and a future author would have relied on it: `comment`
   admits every printable character and `enum` admits whatever a content author
   lists, so a value could close an attribute and open new rich-rule elements —
   a firewall-policy bypass (the installed rule's ACTION differs from the one on
   screen) that shell quoting cannot see, because the injected text never leaves
   its single-quoted shell token. Two rules replace that claim:

   1. STRUCTURAL — a rich-rule slot may only be filled by a field whose type is
      listed for that slot in RICHRULE_SLOT_TYPES, and every one of those is a
      closed grammar. `comment` and `enum` are deliberately NOT rich-rule
      sub-field types. Rich-rule attribute syntax has no escape sequence for a
      double quote inside an attribute value, so there is no encoding that makes
      free text safe there; the honest answer is no free-text path into a rich
      rule at all, rather than a fourth escaping domain that cannot be written
      correctly.
   2. CHARACTER — every mapped value is re-checked here, at composition time,
      against a closed value set, and the whole rule is refused (null) if any
      value carries a quote, a backslash, whitespace, or anything else that could
      open a new element. Rule 1 already makes rule 2 unreachable today; rule 2
      is what still holds if a future type is added to rule 1's table in error. */
var RICHRULE_SLOT_TYPES={
  family:["family"],
  source:["cidr","ipaddr","ipv4","ipv6"],
  destination:["cidr","ipaddr","ipv4","ipv6"],
  service:["service"],
  port:["port","portrange"],
  protocol:["protocol"],
  action:["action"]
};
var RICHRULE_SLOTS=["family","source","destination","service","port","protocol","action"];
/* No quote, no backslash, no whitespace, no '=', no '<' or '>': nothing that can
   terminate an attribute value or begin another rich-rule element. */
var RICHRULE_VALUE_RE=/^[A-Za-z0-9_.:\/-]+$/;

function richRuleSlotOk(slot,type){
  return inList(RICHRULE_SLOT_TYPES[slot]||null,type);
}

/* composeRichRule(resolvedValues, plan, fieldTypes) -> string | null
   `fieldTypes` maps field name -> declared type, so the structural rule above can
   be enforced on the SPEC, not merely on the value that happened to be typed. */
function composeRichRule(map,plan,types){
  if(!plan||!types) return null;
  var k,i;
  for(k in plan){
    if(!Object.prototype.hasOwnProperty.call(plan,k)) continue;
    if(!inList(RICHRULE_SLOTS,k)) return null;             /* unknown rich-rule slot */
    if(!richRuleSlotOk(k,types[plan[k]])) return null;     /* type not allowed in this slot */
  }
  for(i=0;i<RICHRULE_SLOTS.length;i++){
    var nm=plan[RICHRULE_SLOTS[i]];
    if(!nm) continue;
    var val=map[nm];
    if(val===undefined||val===null) continue;
    if(typeof val!=="string"||!RICHRULE_VALUE_RE.test(val)) return null;   /* fail closed */
  }
  var family=map[plan.family];
  if(!family) return null;
  var out='rule family="'+family+'"';
  if(plan.source && map[plan.source]) out+=' source address="'+map[plan.source]+'"';
  if(plan.destination && map[plan.destination]) out+=' destination address="'+map[plan.destination]+'"';
  if(plan.service && map[plan.service]) out+=' service name="'+map[plan.service]+'"';
  if(plan.port && map[plan.port]){
    if(!plan.protocol || !map[plan.protocol]) return null;   /* a port with no protocol is half-formed */
    out+=' port port="'+map[plan.port]+'" protocol="'+map[plan.protocol]+'"';
  }
  var action=plan.action?map[plan.action]:null;
  if(!action) return null;
  return out+" "+action;
}

/* ---- the generated FILE (MCR-SEC-010, CR-T-25) ---------------------------
   An Ansible generator produces two things, not one: the command line the
   operator runs, and the FILE that command runs against. `doc` is the second.
   It is a declared line list in the spec, walked here — never a template string
   with values interpolated into it, for the same reason template[] is a token
   list and not a format string.

   TWO GRAMMARS, ONE RULE EACH.

   kind "yaml": every operator value is yamlQuote()d. Keys are either curated
   literals matching DOC_KEY_RE (no colon, no space, no quote — a plain YAML key
   that needs no quoting) or come from a validated field, in which case the KEY
   is yamlQuote()d too, because a mapping key is as much a scalar as a value is.

   kind "ini": ansible.cfg is an INI file and INI HAS NO ESCAPE SEQUENCE. There
   is no encoding that makes free text safe in `key = value`: a newline ends the
   entry, a ';' or '#' can begin a comment, an '=' is the separator. So this
   grammar gets NO quoter — inventing a fourth escaper that cannot be written
   correctly is exactly the mistake MCR-SEC-001 refused for rich rules. It gets
   the same two rules rich rules got instead:

     1. STRUCTURAL. An ini line may only cite a field whose declared type is in
        INI_FIELD_TYPES, and every one of those is a closed grammar. `comment`
        (the one free-text type) and `enum` (whose options a content author
        writes) are deliberately absent.
     2. CHARACTER. Every value is re-checked here, at composition time, against
        INI_VALUE_RE, and the whole file is refused (null) if any value
        carries anything that could end the entry or begin a comment. Rule 1
        makes rule 2 unreachable today; rule 2 is what still holds if a future
        type is added to rule 1's table in error.

   NULL is the only answer for anything that does not compose. There is no
   half-written file, for the same reason there is no half-built command
   (threat-model-v1 §3.4): a playbook missing a line still runs. */
var DOC_KINDS=["yaml","ini"];
/* A plain YAML key / INI key: no colon, no whitespace, no quote, no comment
   character. Curated content, checked the way template[].lit is checked. */
var DOC_KEY_RE=/^[A-Za-z_][A-Za-z0-9_.-]*$/;
/* A curated literal VALUE in a doc line. Closed even though the yaml kind
   quotes it anyway — the ini kind does not, and one table for both is one
   table to get right. */
var DOC_LIT_RE=/^[A-Za-z0-9_./:@+-]+$/;
/* No whitespace, no quote, no ';' or '#', no '=', no control character:
   nothing that can end an INI entry or start a comment. */
var INI_VALUE_RE=/^[A-Za-z0-9_./:@+-]+$/;
/* Closed grammars only, for the reason above the function. */
var INI_FIELD_TYPES=["path","username","groupname","integer","port","hostname",
                     "interface","package","unit","ipv4","ipv6","ipaddr"];
var DOC_MAX_INDENT=8;
var DOC_INDENT="  ";

function docIndent(n){
  var out="",i;
  for(i=0;i<n;i++) out+=DOC_INDENT;
  return out;
}
/* Is this doc line going to contribute at all on this release? Same question
   tokenPresent() asks of a template token, asked of a line: a line with a
   `field` needs that field resolved and available, a line with `requires` needs
   the field it names, and a line with neither is unconditional. */
function docLinePresent(spec,version,resolved,line){
  var owner;
  if(line.requires!==undefined && line.requires!==null){
    owner=fieldFor(spec,line.requires);
    if(!owner) return false;
    if(!fieldAvailable(owner,version)) return false;
    if(!Object.prototype.hasOwnProperty.call(resolved,line.requires)) return false;
  }
  var names=[line.field,line.keyField],i;
  for(i=0;i<names.length;i++){
    if(names[i]===undefined||names[i]===null) continue;
    owner=fieldFor(spec,names[i]);
    if(!owner) return false;
    if(!fieldAvailable(owner,version)) return false;
    if(!Object.prototype.hasOwnProperty.call(resolved,names[i])) return false;
  }
  return true;
}
/* A doc line's gate: the field whose presence decides whether it appears, or
   null when it always appears. The YAML analogue of token_gate(). */
function docLineGate(line){
  if(!line) return null;
  if(line.requires!==undefined && line.requires!==null) return line.requires;
  if(line.field!==undefined && line.field!==null) return line.field;
  if(line.keyField!==undefined && line.keyField!==null) return line.keyField;
  return null;
}
/* A YAML mapping is keyed, not positional, so a dropped line promotes nothing —
   the MCR-SEC-002 shift rule has no analogue here. What DOES have one is the
   block: dropping `vars:` while `ansible_user:` underneath it survives leaves an
   orphan indented under the wrong parent, which is a structural rewrite of the
   file exactly as surely as a promoted argument is of a command line. So a
   line that can vanish may only vanish if every DEEPER line that follows it
   vanishes with it — which is what "gated on the same field" buys. */
function docBlockOrphans(spec,version,resolved,lines,at){
  var gate=docLineGate(lines[at]),out=[],j;
  for(j=at+1;j<lines.length;j++){
    if((lines[j].indent||0)<=(lines[at].indent||0)) break;   /* block ended */
    if(docLineGate(lines[j])===gate) continue;               /* leaves with it */
    if(!docLinePresent(spec,version,resolved,lines[j])) continue;
    out.push(j);
  }
  return out;
}

/* composeDoc(spec, version, resolvedValues) -> {kind, filename, text} | null */
function composeDoc(spec,version,resolved){
  var doc=spec&&spec.doc;
  if(!doc||!inList(DOC_KINDS,doc.kind)) return null;
  var lines=doc.lines;
  if(!lines||!lines.length) return null;
  var yaml=(doc.kind==="yaml"),out=[],i;
  if(yaml) out.push("---");
  for(i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line) return null;
    if(!docLinePresent(spec,version,resolved,line)){
      /* Same law as MCR-SEC-002: dropping is a property of the DOCUMENT, so the
         file has to have declared it, and a declared drop may not orphan
         the block underneath it. */
      if(line.optional!==true) return null;
      if(docBlockOrphans(spec,version,resolved,lines,i).length) return null;
      continue;
    }
    if(yaml){
      if(!(typeof line.indent==="number")||line.indent<0||line.indent>DOC_MAX_INDENT) return null;
    }else if(line.indent!==undefined && line.indent!==null && line.indent!==0){
      return null;                                /* INI has no nesting */
    }
    /* an INI section header: [defaults] */
    if(line.section!==undefined && line.section!==null){
      if(yaml) return null;
      if(!DOC_KEY_RE.test(String(line.section))) return null;
      out.push("["+String(line.section)+"]");
      continue;
    }
    /* the key */
    var key;
    if(line.keyField!==undefined && line.keyField!==null){
      if(!yaml) return null;                      /* an INI key is never operator text */
      var kf=fieldFor(spec,line.keyField);
      if(!kf) return null;
      var kv=resolved[line.keyField];
      if(typeof kv!=="string"||CTRL_RE.test(kv)||INVISIBLE_RE.test(kv)) return null;
      key=yamlQuote(kv);
    }else{
      if(line.key===undefined||line.key===null) return null;
      if(!DOC_KEY_RE.test(String(line.key))) return null;
      key=String(line.key);
    }
    /* the value: a field, a curated literal, a curated boolean, or nothing */
    var value=null;
    if(line.field!==undefined && line.field!==null){
      var f=fieldFor(spec,line.field);
      if(!f) return null;
      var v=resolved[line.field];
      if(typeof v!=="string") return null;
      /* CHARACTER rule, applied in BOTH grammars. The field validators already
         refuse every one of these; this is the second, independent layer that
         still holds if a future field type is admitted here in error. */
      if(CTRL_RE.test(v)||INVISIBLE_RE.test(v)) return null;
      if(yaml){
        value=yamlQuote(v);
      }else{
        if(!inList(INI_FIELD_TYPES,f.type)) return null;      /* STRUCTURAL rule */
        if(!INI_VALUE_RE.test(v)) return null;                /* CHARACTER rule */
        value=v;
      }
    }else if(line.lit!==undefined && line.lit!==null){
      if(!DOC_LIT_RE.test(String(line.lit))) return null;
      value=yaml?yamlQuote(String(line.lit)):String(line.lit);
    }else if(line.bool!==undefined && line.bool!==null){
      if(line.bool!==true && line.bool!==false) return null;
      value=line.bool?"true":"false";             /* curated JSON boolean, never operator text */
    }
    if(yaml){
      out.push(docIndent(line.indent)+(line.seq===true?"- ":"")+key+":"+(value===null?"":" "+value));
    }else{
      if(value===null) return null;               /* a bare INI key is not a thing */
      out.push(key+" = "+value);
    }
  }
  if(out.length<=(yaml?1:0)) return null;         /* nothing emitted: not a file */
  var name=doc.filename;
  if(typeof name!=="string"||!/^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/.test(name)) return null;
  return {kind:doc.kind,filename:name,text:out.join("\n")+"\n"};
}

/* ---- the clipboard payload (MCR-SEC-003) ---------------------------------
   "Copy with comment" used to build its header as "# label: " + raw content
   text. None of that header is rendered anywhere — the operator sees only the
   assembled command in the gutter — so a newline in `intent` put a SECOND,
   unrendered line on the clipboard, which on the shipped reproduction was
   `rm -rf /var/log/audit`. The destructive-pattern table never saw it either,
   because blastFor() only ever looked at res.command.

   Three rules, here in the pure assembler block so the harness can prove them:
     1. headerSafe() renders every interpolated value to single-line printable
        text. Control characters, NUL and U+2028/U+2029 become spaces; nothing
        is silently deleted and nothing can end a line.
     2. commentPayload() splits every line it is handed on CR/LF/CRLF anyway —
        belt to rule 1's braces — and prefixes EVERY resulting line with "# ".
        There is no "# label: " + value concatenation anywhere.
     3. The command is the only line in the payload that is not "# "-prefixed,
        and a command that is not single-line printable text refuses to compose
        a payload at all (null), rather than contributing an unprefixed line.
   The caller then runs blastFor() over the whole payload, header included. */
var HEADER_UNSAFE_G=/[\u0000-\u001F\u007F-\u009F\u2028\u2029]/g;
var HEADER_UNSAFE_RE=/[\u0000-\u001F\u007F-\u009F\u2028\u2029]/;
function headerSafe(s){
  /* H2: widened to also strip INVISIBLE_RE_G's range (bidi overrides/
     isolates, zero-width, variation selectors, soft hyphen, etc. -- see the
     shared table's own comment above) ahead of the existing control-
     character/whitespace treatment. A strict superset of the previous
     behaviour: nothing that passed through clean before is treated any
     differently now. */
  return String(s).replace(HEADER_UNSAFE_G," ").replace(INVISIBLE_RE_G,"").replace(/ {2,}/g," ").replace(/^ +| +$/g,"");
}
function commentPayload(lines,command){
  var cmd=String(command);
  if(cmd===""||HEADER_UNSAFE_RE.test(cmd)) return null;
  var out=[],i,j;
  lines=lines||[];
  for(i=0;i<lines.length;i++){
    var parts=String(lines[i]).split(/\r\n|\r|\n/);
    for(j=0;j<parts.length;j++){
      var text=headerSafe(parts[j]);
      if(text==="") continue;
      out.push("# "+text);
    }
  }
  out.push(cmd);
  return out.join("\n");
}

var BLAST_RANK={green:0,yellow:1,red:2};

/* The semantic form of an assembled command: the same string with the quoting
   shQuote() added taken back off, token boundaries intact.

   MCR-SEC-008. The destructive-pattern table is matched against the fully
   assembled, post-quoting command (threat-model-v1 §3.3) — correct, and it
   interacts badly with uniform quoting: shQuote() inserts a ' at every
   literal->value boundary, so a pattern that spans one can never match.
   `rm -rf /` against `rm -rf '/etc/pki'` is the case, and the table is data
   precisely so a content reviewer can add exactly that row. Patterns are now
   matched against BOTH forms; a row that matched before still matches. */
function unquoteCommand(s){
  var out="",inQ=false,i=0,str=String(s);
  while(i<str.length){
    var c=str.charAt(i);
    if(inQ){
      if(c==="'") inQ=false; else out+=c;
      i++; continue;
    }
    if(c==="'"){ inQ=true; i++; continue; }
    if(c==="\\" && i+1<str.length){ out+=str.charAt(i+1); i+=2; continue; }
    out+=c; i++;
  }
  return out;
}

/* The destructive-pattern table is matched against the FULLY ASSEMBLED,
   post-quoting command AND its unquoted projection, and a content entry's own
   blast:"red" trips the banner independently — two ways in, in case the pattern
   table has a gap (threat-model-v1 §3.3). */
function blastFor(command,base,patterns){
  var blast=(base in BLAST_RANK)?base:"green";
  var rank=BLAST_RANK[blast], reasons=[];
  var hay=String(command).toLowerCase();
  var bare=unquoteCommand(command).toLowerCase();
  patterns=patterns||[];
  for(var i=0;i<patterns.length;i++){
    var p=patterns[i];
    if(!p||!p.match) continue;
    var needle=String(p.match).toLowerCase();
    if(hay.indexOf(needle)<0 && bare.indexOf(needle)<0) continue;
    reasons.push({id:p.id,label:p.label,why:p.why,floor:p.blast_floor});
    var r=BLAST_RANK[p.blast_floor];
    if(r>rank){ rank=r; blast=p.blast_floor; }
  }
  return {blast:blast,reasons:reasons};
}

function assembleEntry(entry,version,patterns){
  var slot=entry.rhel_versions?entry.rhel_versions[version]:null;
  if(!slot||slot.unavailable) return null;
  var cmd=slot.command;
  if(typeof cmd!=="string"||cmd==="") return null;
  var flags=[],src=entry.flags||[];
  for(var i=0;i<src.length;i++){
    flags.push({flag:src[i].flag,explain:(src[i].explain===undefined?null:src[i].explain)});
  }
  var b=blastFor(cmd,entry.blast,patterns);
  return {id:entry.id,tool:entry.tool,command:cmd,flags:flags,blast:b.blast,
          blast_reasons:b.reasons,notes:slot.notes||null,
          resolved_from:slot.resolved_from||null,version:version,doc:null};
}

/* MCR-SEC-006. `template[].flag` and `template[].lit` are emitted UNQUOTED —
   that is the design, they are curated content, not user input — but "trusted"
   and "unchecked" are not the same word. A template is content, content is a
   file, and a file can be wrong: `{flag:"--zone; rm -rf /etc; #"}` assembled
   into a working command line with nothing to stop it at build time or at run
   time. These two allow-lists are the run-time half (extract/schema.py's
   spec_errors() is the build-time half), and they admit no whitespace, no
   quote, and no shell metacharacter. A token that does not match makes the
   whole template null — never "emit the parts that are fine". */
var FLAG_TOKEN_RE=/^-{1,2}[A-Za-z0-9][A-Za-z0-9-]*$/;
var LIT_TOKEN_RE=/^[A-Za-z0-9_.\/=:,+-]+$/;

/* MCR-SEC-015 (condition E1). How a flag is joined to its value is a property of
   the FLAG'S SHAPE, not a per-token decision a content author gets to make and
   get wrong twenty times:

     --long   joins with '='  — getopt_long() accepts --name=value; this is the
                                form the man pages show and the product emits
     -X       joins with ' '  — getopt() takes '-X value'. It does NOT accept
                                '-X=value': the '=' is handed straight through as
                                the first character of optarg, so `chage -M=60`
                                sets max-days to the string "=60" and
                                `auditctl -w=/etc/motd` watches nothing while
                                looking, to the operator, like it worked.

   The assembler joined EVERY flag with '=' unless the token said eq:false, and
   eq:false was used nowhere in the 24 shipped generator specs — so 20 short-
   option tokens across 11 of them emitted a command that is wrong for its tool.
   No gate could see it, because every one of those commands is perfectly quoted
   (MCR-SEC-021: containment is not validity).

   Deriving the rule fixes all 20 at once and makes the defect unwritable rather
   than merely absent: the join is computed from the flag, so a new generator
   inherits it. The two escape hatches stay, narrowly:

     eq:false     on a --long flag, for a long option that wants ' '
     join:"glued" on a -X flag, for a tool that requires '-Xvalue'

   and each is legal ONLY on the shape it belongs to. A token that declares the
   join for a shape that derives it is a disagreement between the content and
   the rule, and the only honest answer to a disagreement is null — never "guess
   which one the author meant". extract/schema.py refuses the same token at
   build time; this is the run-time backstop. */
function flagJoin(tok){
  var flag=String(tok.flag);
  if(flag.charAt(1)==="-"){                                  /* --long */
    if(tok.join!==undefined && tok.join!==null) return null;  /* `join` is a short-option word */
    if(tok.eq!==undefined && tok.eq!==null && tok.eq!==false && tok.eq!==true) return null;
    return tok.eq===false?" ":"=";
  }
  if(tok.eq!==undefined && tok.eq!==null) return null;        /* -X derives its join; it cannot be declared */
  if(tok.join===undefined || tok.join===null) return " ";
  if(tok.join==="glued") return "";                           /* -Xvalue, where a tool requires it */
  return null;
}

/* assembleCommand(specOrEntry, version, values) -> {command, flags[], blast} | null
   NULL is the only answer for an incomplete or invalid input. There is no
   second return shape carrying a half-built string, because a half-formed root
   command is a worse outcome than a blocked button (threat-model-v1 §3.4). */
function assembleCommand(spec,version,values,opts){
  opts=opts||{};
  var patterns=opts.patterns||[];
  if(!spec||!version) return null;
  if(!inList(["7","8","9","10"],version)) return null;
  if(spec.rhel_versions) return assembleEntry(spec,version,patterns);
  if(!spec.template||!spec.template.length) return null;
  if(spec.versions && !inList(spec.versions,version)) return null;
  var v=validateSpec(spec,version,values||{});
  if(!v.ok) return null;
  var types=fieldTypeMap(spec);
  var words=[],flags=[],i;
  for(i=0;i<spec.template.length;i++){
    var tok=spec.template[i];
    if(!tok) return null;
    if(tok.flag!==undefined && tok.flag!==null && !FLAG_TOKEN_RE.test(String(tok.flag))) return null;
    if(tok.lit!==undefined && tok.lit!==null){
      if(!LIT_TOKEN_RE.test(String(tok.lit))) return null;
      /* MCR-SEC-022 (E7). A lit token emits its `lit` and nothing else, so a
         `flag` beside it emits nothing — its only effect was to switch the D1
         positional rule off, unchecked, for whatever literal it was attached to.
         Whether a literal is an option is DERIVED from the literal (see
         isPositionalToken()), so the key is unnecessary for a real option and a
         bypass for anything else. Refused either way, including when it tells
         the truth: a rule with an off-switch is not a rule, and the shipped
         content carried two exemplars of the shape for the next author to copy.
         extract/schema.py refuses it at build time; this is the backstop. */
      if(tok.flag!==undefined && tok.flag!==null) return null;

         literal disappears WITH it and can never be left dangling. */

             vanish — the lit's equivalent of optional:true. It is still an
             argument slot, so it may only vanish under the same rule a field

             The legal shape is the one MCR-SEC-002 shipped — the literal and
             the value after it gated on the SAME field, so they leave together
             and nothing is promoted. */

        }

      words.push(String(tok.lit));
      /* MCR-SEC-023. The lit branch used to push the word and return, so an
         option the command SHOWS — `sshd -T`, `setsebool -P`, `lvextend -r`,
         `journalctl --no-pager --boot` — was absent from the flag-by-flag panel
         entirely. A panel silent about a flag that is present is a smaller
         version of threat-model §4's Explainer row, a panel that describes one
         that is not. The same derived test decides it: an option-shaped literal
         is an option, so it belongs in the flag list, in command order. With no
         curated explain and no dictionary hit, `explain:null` renders
         "unverified — see man page" — the no-guess law, not a guess. */
      if(FLAG_TOKEN_RE.test(String(tok.lit))){
        flags.push({flag:String(tok.lit),explain:tok.explain||null});
      }
      continue;
    }
    if(tok.richRule){
      var composed=composeRichRule(v.resolved,tok.richRule,types);
      if(composed===null) return null;
      if(tok.flag){
        var rjoin=flagJoin(tok);                  /* MCR-SEC-015: one join rule, not two */
        if(rjoin===null) return null;
        words.push(String(tok.flag)+rjoin+shQuote(composed));
        flags.push({flag:String(tok.flag),explain:tok.explain||null});
      }else{
        words.push(shQuote(composed));
      }
      continue;
    }
    var field=fieldFor(spec,tok.field);
    if(!field) return null;                       /* template cites a field that does not exist */
    if(!tokenPresent(spec,version,v.resolved,tok)){
      /* MCR-SEC-002. This token is about to vanish — because the value was not
         supplied, or because the field is gated out of this release. Dropping a
         token is a decision about the TEMPLATE, not about one field, so it is
         only legal when the template declared it:

           - optional:true is mandatory. Without it the template is not complete
             on this release and the only honest answer is null. A shortened
             command with Copy enabled and no banner is worse than a blocked
             button (threat-model-v1 §3.4).
           - a POSITIONAL token may additionally only vanish if every later
             positional token vanishes too. Otherwise argument n+1 is promoted
             into slot n — `chown 'apache' '/var/www'` silently becoming
             `chown '/var/www'` — and the command still assembles.

         A version-gated field takes the same path as an unsupplied one: the same
         template must not be well-formed on RHEL 9 and mis-positioned on RHEL 8. */
      if(tok.optional!==true) return null;
      if(isPositionalToken(tok) && laterPositionalSurvives(spec,version,v.resolved,i)) return null;
      continue;
    }

      var join=flagJoin(tok);                     /* MCR-SEC-015: derived from the flag's shape */
      if(join===null) return null;                /* the token declares a join its shape derives */
      words.push(String(tok.flag)+join+q);
      flags.push({flag:String(tok.flag),explain:field.explain||null});
    }else{
      words.push(q);

  var command=words.join(" ");
  if(command==="") return null;
  /* MCR-SEC-010. A generator that declares a `doc` emits a FILE as well as a
     command, and the two stand or fall together: a spec with a doc that will
     not compose returns null rather than handing back the command line with the
     file silently missing. The operator would run `ansible-playbook site.yml`
     against whatever site.yml happened to be there. */
  var doc=null;

    doc=composeDoc(spec,version,v.resolved);
    if(doc===null) return null;
  }
  /* The destructive table sees the file too. blastFor() over the command alone
     would rate `ansible-playbook site.yml --check` on the command, while the
     playbook it runs is the thing that changes hosts -- the same gap

  var b=blastFor(command+(doc?"\n"+doc.text:""),spec.blast,patterns);
  return {id:spec.id,tool:spec.tool,command:command,flags:flags,blast:b.blast,
          blast_reasons:b.reasons,notes:spec.notes||null,resolved_from:null,version:version,
          doc:doc};
}
/* ===== MCR-ASSEMBLER-END ================================================== */

/* ===== MCR-INDEX-BEGIN =====================================================
   CR-T-29. buildIndex() and queryIndex() are the lazy typed search index.
   Deliberately pure — a function of the `datasets` object it is handed, never
   of the global DATASETS/STATE — for the same reason the assembler above is
   pure: tests/test_search_index.js lifts this block out of the SHIPPED
   artifact by these markers (mirroring tests/hostile_harness.js) and times it
   against the real embedded dataset, so "<100ms on the full dataset" is a
   number this file's own tests print, not a claim.

   "Lazy": nothing here runs at boot. The app calls buildIndex(DATASETS) once,
   on the first palette keystroke, and keeps the result in a module-level
   cache (outside this block, beside SEARCH_INDEX) for the life of the page.
   "Typed": every record in the index carries a `kind` — Tool, Command, Flag,
   STIG, CCI, NIST — so the palette can group results instead of presenting
   one flat, undifferentiated list (CR-P0-06, UI spec §4).
   ========================================================================== */
function buildIndex(datasets){
  datasets=datasets||{};

  var tools=(datasets.TOOLS&&datasets.TOOLS.tools)||[];
  for(i=0;i<tools.length;i++){
    var t=tools[i];
    if(!t||!t.id) continue;
    idx.push({kind:"Tool",id:t.id,tool:t.id,version:null,cat:null,
              label:t.label||t.id,
              hay:String((t.label||t.id)+" "+t.id).toLowerCase()});
  }
  var entries=(datasets.COMMANDS&&datasets.COMMANDS.entries)||[];
  for(i=0;i<entries.length;i++){
    var e=entries[i];
    if(!e||!e.id) continue;
    idx.push({kind:"Command",id:e.id,tool:e.tool||null,version:null,cat:null,
              label:e.intent||e.id,
              hay:String((e.intent||"")+" "+e.id+" "+(e.tool||"")).toLowerCase()});
    var eflags=e.flags||[];
    for(j=0;j<eflags.length;j++){
      var ef=eflags[j];
      if(!ef||!ef.flag) continue;
      idx.push({kind:"Flag",id:e.id,tool:e.tool||null,version:null,cat:null,
                label:ef.flag,
                hay:String(ef.flag+" "+(ef.explain||"")+" "+(e.tool||"")).toLowerCase()});
    }
  }
  var versions=["7","8","9","10"];
  for(k=0;k<versions.length;k++){
    var ver=versions[k];
    var dict=(datasets.FLAGS||{})[ver];
    var clis=(dict&&dict.clis)||{};
    var cliIds=[],ck;
    for(ck in clis){ if(Object.prototype.hasOwnProperty.call(clis,ck)) cliIds.push(ck); }
    for(i=0;i<cliIds.length;i++){
      var cid=cliIds[i];
      var cli=clis[cid];
      var cflags=(cli&&cli.flags)||[];
      for(j=0;j<cflags.length;j++){
        var cf=cflags[j];
        var names=(cf&&cf.names)||[];
        if(!names.length) continue;
        idx.push({kind:"Flag",id:cid,tool:cid,version:ver,cat:null,
                  label:names[0],
                  hay:String(names.join(" ")+" "+(cf.explain||"")+" "+cid).toLowerCase()});
      }
    }
    var ruleset=((datasets.RULES||{})[ver]&&datasets.RULES[ver].rules)||[];
    for(i=0;i<ruleset.length;i++){
      var r=ruleset[i];
      if(!r||!r.i) continue;
      idx.push({kind:"STIG",id:r.i,tool:null,version:ver,cat:r.c||null,
                label:r.t||r.i,
                hay:String((r.i||"")+" "+(r.t||"")+" "+(r.cci||[]).join(" ")+" "+
                          (r.n||[]).join(" ")).toLowerCase()});
    }
  }
  /* The REFERENCE tier is NOT built here, and its absence is the design.
     This function walks whole datasets to build lower-cased haystacks; doing
     that for 14,488 mined records would hydrate all three family islands on
     the first keystroke and hand back a 19,000-entry array -- eager loading
     wearing a lazy function's name. The corpus is searched through the
     build-time inverted index instead (queryReference(), MCR-HYDRATE), which
     resolves postings first and hydrates only the families a query can
     actually reach. "Reference" keeps its slot in INDEX_KIND_ORDER below:
     queryIndex() never emits that group, and paletteMatches() splices the
     index's answer into the same position, so the grouping order an operator
     sees is still stated exactly once. */

  var cciIds=[],cck;
  for(cck in cciMap){ if(Object.prototype.hasOwnProperty.call(cciMap,cck)) cciIds.push(cck); }
  for(i=0;i<cciIds.length;i++){
    var cid2=cciIds[i];
    var nist=(cciMap[cid2]&&cciMap[cid2].nist)||[];
    idx.push({kind:"CCI",id:cid2,tool:null,version:null,cat:null,
              label:cid2+(nist.length?(" -> "+nist.join(", ")):""),
              hay:String(cid2+" "+nist.join(" ")).toLowerCase()});
    for(j=0;j<nist.length;j++){
      idx.push({kind:"NIST",id:nist[j],tool:null,version:null,cat:null,
                label:"NIST "+nist[j]+" ("+cid2+")",

/* queryIndex(index, q) -> {groups:[{kind,hits:[...]}], total, terms}
   Every term must match (AND, not OR) somewhere in a record's haystack — a
   whole-word match outranks a substring match, exactly like the shell's own
   paletteMatches() this replaces. Grouped by kind, kept in a stable kind
   order, each group capped so one huge family (Flag, STIG) cannot crowd every
   other kind off the palette. */

   line can never be the first thing a search offers when a curated entry
   matches the same words. */

  for(ti=0;ti<raw.length;ti++){ if(raw[ti]) terms.push(raw[ti]); }
  out.terms=terms.length;
  if(!terms.length||!index||!index.length) return out;
  var scored=[],i,t;
  for(i=0;i<index.length;i++){
    var rec=index[i],score=0,hit=true;
    for(t=0;t<terms.length;t++){
      var needle=terms[t];
      var at=rec.hay.indexOf(needle);
      if(at<0){ hit=false; break; }
      var wordStart=(at===0)||/[^a-z0-9]/.test(rec.hay.charAt(at-1));
      score+=wordStart?3:1;
    }
    if(hit) scored.push({rec:rec,score:score});
  }
  scored.sort(function(a,b){ return b.score-a.score; });
  out.total=scored.length;
  var byKind={},k2;
  for(i=0;i<scored.length;i++){
    var kind=scored[i].rec.kind;
    if(!byKind[kind]) byKind[kind]=[];
    if(byKind[kind].length<INDEX_GROUP_CAP) byKind[kind].push(scored[i].rec);
  }
  for(k2=0;k2<INDEX_KIND_ORDER.length;k2++){
    var kn=INDEX_KIND_ORDER[k2];
    if(byKind[kn]&&byKind[kn].length) out.groups.push({kind:kn,hits:byKind[kn]});
  }
  return out;
}
/* ===== MCR-INDEX-END ======================================================= */

/* ===== MCR-EVIDENCE-BEGIN ===================================================
   CR-T-28. formatEvidenceText() is the deterministic plain-text formatter
   behind Export as Evidence. Pure, like the block above: every value it prints
   is passed in explicitly, nothing is read from DATASETS/STATE/the DOM/the
   clock inside it, so tests/test_evidence_export.js can call it twice with the
   same fixture and assert the output is byte-identical except the operator's
   own date line (threat-model-v1 §8: the export "carries a content fingerprint
   and STIG version" and is "read from the same rendered-state object as the
   screen, never recomputed" — `res` here IS that object, the one
   currentResult() already produced; this function only formats it).

   `res` is the RESULT value from computeResult()/currentResult() (MCR-SEC-012)
   — command, flags, blast — never reassembled here. Everything else
   (STIG row, rule text, source citation, capture metadata, fingerprint,
   versions) is content-island data or app identity, handed in by the caller. */
/* Line-safety for the evidence export (Marcus Reed's Panels review,
   PANEL-002 / condition G2, range table shared per condition H2). esc()
   only neutralises HTML metacharacters for the <pre> preview, correctly --
   it is not a sanitiser (MCR-SEC-009) -- but a bidi override or a raw NUL in
   a rule title or check/fix text would still reach this PLAIN-TEXT export
   unchanged, and this text crosses trust boundary 5 into an SCTM/ATO
   package.

   evidenceHeaderSafe()/evidenceLineSafe() strip MCR-ASSEMBLER's own
   INVISIBLE_RE_G range (bidi overrides/isolates, zero-width, variation
   selectors, soft hyphen -- the exact class MCR-SEC-004 already refuses in
   curated FIELD VALUES) and neutralise HEADER_UNSAFE_G's control-character
   range the same way headerSafe() does for the clipboard header
   (MCR-SEC-003) -- H2: ONE shared range table read from MCR-ASSEMBLER, not
   a second hand-rolled copy. The first cut of this function (G2) kept its
   own numeric range table "to stay independently liftable" and that copy
   had already drifted from INVISIBLE_RE (missing U+061C, U+00AD,
   U+206A-U+206F, U+FE0F) by the time H2 caught it --
   tests/test_evidence_export_real.js and tests/test_evidence_invisible_
   coverage.js both already lift MCR-ASSEMBLER and MCR-EVIDENCE together, so
   "this block must never reach outside itself" was solving a problem the
   test suite had already stopped having; a live, correct, shared table beats
   a "pure" one that quietly stops being true.

   NOT identical to headerSafe(), even so: headerSafe() collapses run-on
   whitespace and trims each line, which is safe for a single clipboard
   comment line but not for this export's own content -- "STIG version: V2R8
   benchmark date: 01 Jul 2026" relies on a real double space, and the
   pre-existing CR-T-28 test asserts that line survives byte-for-byte.
   evidenceHeaderSafe() leaves ordinary spaces alone; it only ever touches
   characters that are actually hostile.

   Runs per PHYSICAL LINE (split on CR/LF first, rejoined after), so
   multi-paragraph check/fix text keeps its line breaks -- only what is
   hostile WITHIN a line is touched. '<', '"' and the apostrophe are left
   exactly as authored: this is a plain-text export, not markup. */
function evidenceHeaderSafe(s){
  return String(s).replace(HEADER_UNSAFE_G," ").replace(INVISIBLE_RE_G,"");
}
function evidenceLineSafe(v){
  var s=String(v==null?"":v),parts=s.split(/\r\n|\r|\n/),i;

function formatEvidenceText(opts){
  opts=opts||{};

  function push(s){ lines.push(evidenceLineSafe(s)); }
  function kv(label,val){ push(label+": "+(val===null||val===undefined||val===""?"not captured":val)); }
  push("MD CODE RED — Evidence Export");
  push("Tool version: "+(opts.appVersion||"")+"  built "+(opts.appBuildDate||""));
  push("Content fingerprint (sha256 of every embedded data island): "+(opts.contentFingerprint||""));
  /* Per-version verification status (task item 4): the receipt line for THE
     EXPORTED VERSION ONLY, never every version the entry carries — an export
     is evidence for one command on one release, and printing other versions'
     states here would blur which release this export is actually about.
     opts.vstatus is pre-computed by the caller (verificationStatusForVersion()
     over opts.entry/opts.version) rather than derived in here, so this
     function stays pure over exactly the values it is handed, same as res/
     stigRow/rule above. */
  if(opts.vstatus){
    push("Verified (RHEL "+(opts.version||"")+"): "+opts.vstatus.text);
  }
  push("");
  if(stigRow){
    push("STIG ID: "+(stigRow.stig_id||""));
    push("STIG version: "+(opts.stigVersion||"")+"  benchmark date: "+(opts.benchmarkDate||""));
    push("Rule title: "+(rule&&rule.t?rule.t:""));
    push("CAT: "+((rule&&rule.c)?rule.c:"?"));
    var cci=(stigRow.cci&&stigRow.cci.length)?stigRow.cci:((rule&&rule.cci)||[]);
    push("CCI: "+(cci&&cci.length?cci.join(", "):"none cited"));
    var nist=(stigRow.nist&&stigRow.nist.length)?stigRow.nist:((rule&&rule.n)||[]);
    push("NIST SP 800-53 controls: "+(nist&&nist.length?nist.join(", "):"none mapped"));
    push("");
    push("Check command / check text:");
    push(rule&&rule.chk?rule.chk:"(no check text embedded for this rule)");
    push("");
    push("Fix command / fix text:");
    push(rule&&rule.fix?rule.fix:"(no fix text embedded for this rule)");
    push("");
    /* Capture records are content validation protocol §7 shape (Eli Cross
       ruling, CR-T-34): redhat_release, not os_release/patch_level; a nested
       stig_compliance.compliant, not a flat compliant. cap.text/cap.compliant
       stay as defensive fallbacks for a differently-shaped record; they are
       never how a real capture answers these lines. */
    var cap=stigRow.expected_output;
    if(cap&&(cap.stdout!==undefined||cap.text!==undefined)){
      var compliant=(cap.stig_compliance&&cap.stig_compliance.compliant!==undefined)?
                     cap.stig_compliance.compliant:cap.compliant;
      push("Expected output (captured): "+(cap.stdout!==undefined?cap.stdout:cap.text));
      push("Compliant: "+(compliant===true?"yes":(compliant===false?"no":"not recorded")));
      push("Capture host: "+(cap.host||"not captured"));
      push("Capture release: "+(cap.redhat_release||cap.os_release||cap.patch_level||"not captured"));
      push("Capture kernel: "+(cap.kernel||"not captured"));
      push("Captured on: "+(cap.captured_on||"not captured"));
    }else{
      push("Expected output: not captured yet — no capture record exists for this STIG ID/RHEL "+
           "version pair (content/expected_output.json).");
    }
    push("");
  }
  if(res){
    push("Assembled command (RHEL "+(res.version||"")+", blast "+(res.blast||"")+"):");
    push(res.command||"");
    if(entry&&entry.privilege) push("Requires: "+entry.privilege);
    push("");
    var flags=res.flags||[],fi;
    if(flags.length){
      push("Flags:");
      for(fi=0;fi<flags.length;fi++){
        push("  "+flags[fi].flag+" — "+(flags[fi].explain||"unverified — see man page"));
      }
      push("");
    }
  }else{
    push("Assembled command: not available — no command is assembled for the current selection.");
    push("");
  }
  var src=opts.source||(entry&&entry.source)||null;
  if(src){
    push("Source citation: "+(src.title||"")+" — "+(src.url_or_man||src.version||"")+
        " (version "+(src.version||"?")+", retrieved "+(src.retrieved_on||"?")+")");
  }else{
    push("Source citation: not recorded on this entry.");
  }
  push("");
  push("Operator date: "+(opts.operatorDate||""));
  return lines.join("\n");
}
/* ===== MCR-EVIDENCE-END ===================================================== */

/* ===== MCR-REFERENCE-BEGIN ==================================================
   The REFERENCE tier (extract/mine_commands.py). Vendor command text mined out
   of the DISA STIG check/fix prose, the staged man/--help captures and the
   staged Red Hat product documentation.

   THESE ARE NOT CURATED ENTRIES, and this block exists so that the difference
   is enforced by code rather than remembered by a reader. A reference record
   has no verify text, no undo text, no reviewed blast rating and no capture
   receipt -- extract/schema.py REFUSES those keys on it -- and it never touches
   the assembler: assembleCommand(), computeResult() and currentResult() read
   DATASETS.COMMANDS and nothing else, there is no id here that entryById() can
   resolve (every one is 'ref-' prefixed), and qa.py's reference gate proves
   both by reading the shipped script.

   Pure, like MCR-ASSEMBLER and MCR-EVIDENCE: everything below is a function of
   its arguments, so the tests can lift it out of the SHIPPED artifact.
   ========================================================================== */

/* Blast for a mined command. UNRATED, never green (ADR-002).

   Green in this product is a human claim: a content reviewer looked at the
   command, decided what it does, and signed for it. Nobody has done that for a
   mined line, so the absence of a destructive-pattern match is not a safety
   finding and must not be painted as one. blastFor() is reused rather than
   re-implemented -- the same table, the same unquoted projection, the same
   scan -- and only the floor changes. */
function referenceBlast(command,patterns){
  var b=blastFor(command,"green",patterns);
  return {blast:(b.blast==="green"?"unrated":b.blast),reasons:b.reasons};
}

/* TM2-F5. What does `unrated` do to the COPY control?

   As shipped before this answer, a mined `rm` variant matching no pattern would
   have copied with LESS friction than a curated green command -- the curated one
   at least carries a reviewer's undo text on screen. That is backwards. An
   unrated command is one nobody rated, so copy is held behind an acknowledgement
   for EVERY reference record regardless of blast: unrated, yellow and red alike.
   A red match adds the destructive banner on top of it; it does not replace it.
   The friction is deliberately the same shape as the red-blast acknowledgement
   the operator already knows. */
function referenceCopyBlocked(acked){ return !acked; }

/* Per-command attribution (licensing ruling v1 Ruling 2, condition 4). */
function refGuideUrl(tpl,version,slug){
  if(!tpl||!version||!slug) return "";
  return String(tpl).replace("%s",String(version)).replace("%s",String(slug));
}

/* The citation block, as plain text lines, for ONE occurrence. Pure: every
   value is passed in. Never carries a sentence from the source -- a mined
   record holds a command line and a citation, and nothing else exists to
   carry. */
function refCitationLine(occ,meta){
  meta=meta||{};
  if(!occ) return "";
  if(occ.s) return "DISA RHEL "+occ.v+" STIG, "+occ.s+" ("+(occ.f||"")+" text, line "+occ.l+")";
  if(occ.g){
    var g=(meta.guides&&meta.guides[occ.g])||{};
    return "Red Hat Enterprise Linux "+occ.v+", "+(g.title||occ.g)+
           " -- "+refGuideUrl(meta.guide_url_template,occ.v,occ.g)+
           " -- "+(meta.guide_attribution||"");
  }
  return (occ.p||"")+" line "+occ.l+(occ.x?(" ("+occ.x+" section)"):"");
}

/* What reaches the clipboard for a reference command. Runs through the SAME
   control-character stripping the evidence export uses (evidenceLineSafe, which
   shares MCR-ASSEMBLER's one range table) -- a mined line is vendor text this
   product did not write, so it gets the strongest line-safety the codebase has,
   not the weakest. Every comment line is '# '-prefixed exactly like
